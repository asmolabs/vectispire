# Teams: the grouping that makes restricted visibility administrable.
#
# Per-account assignment (`t_user_target`) already existed and stays: it is the right tool for
# an exception — one contractor, one repository. What it cannot express is an organisation,
# because it costs one row per account per target and every arrival or departure means editing
# every pairing by hand. A team is the factorisation: targets belong to teams, accounts belong
# to teams, and an account sees the union of what its teams own plus what it was assigned
# directly.
#
# **No foreign key from `target_id` to a target table, and that is not an oversight.** The pair
# `(target_kind, target_id)` points into `t_repository` *or* `t_container_image` depending on
# the kind, and SQL cannot express a key into one-of-two tables. `t_user_target` has the same
# shape for the same reason. The cost — a deleted target leaves dangling rows — is bounded:
# `VisibilityService` resolves the pair through the same lookup as the rest of the system, and
# a pair that resolves to nothing grants nothing.
databaseChangeLog:
  - changeSet:
      id: 006-teams
      author: zanshin
      changes:
        - createTable:
            tableName: t_team
            columns:
              - column:
                  name: id
                  type: ${generated.id.type}
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_t_team
              # Unique because the name is how an administrator refers to a team everywhere —
              # two teams named "Backend" would make every assignment screen a guessing game.
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_team_name
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: created_at
                  type: ${timestamp.type}
                  constraints:
                    nullable: false

        - createTable:
            tableName: t_team_member
            columns:
              # The whole row is its key, like `t_user_target`: there is nothing to record
              # beyond the pairing, and a surrogate id would let the same pairing exist twice.
              - column:
                  name: team_id
                  type: bigint
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_team_member_team
                    references: t_team(id)
                    deleteCascade: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_team_member_user
                    references: t_user(id)
                    deleteCascade: true

        - createTable:
            tableName: t_team_target
            columns:
              - column:
                  name: team_id
                  type: bigint
                  constraints:
                    nullable: false
                    primaryKey: true
                    foreignKeyName: fk_team_target_team
                    references: t_team(id)
                    deleteCascade: true
              - column:
                  name: target_kind
                  type: varchar(20)
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: target_id
                  type: bigint
                  constraints:
                    nullable: false
                    primaryKey: true
