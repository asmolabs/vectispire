# The baseline: the schema as it stands, in one changeset per table.
#
# Ordered so that a table referenced by a foreign key exists before the table that points at
# it. Liquibase does not reorder changesets, and the order matters more than it looks.
#
# **The foreign keys are declared inline, not added afterwards.** `addForeignKeyConstraint`
# reads better and is unusable here: SQLite has no `ALTER TABLE ADD CONSTRAINT`, so a
# constraint that is not part of `CREATE TABLE` simply never exists there. Written the tidy
# way, this schema would have had referential integrity on three engines out of four — and
# nothing would have said so, because the changelog applies without complaint on the fourth.
#
# **Identifiers are `bigint`, not `int`.** The NestJS schema used `SERIAL` because a JavaScript
# number does not distinguish the two; Java does, and an `int` column against a `Long` field is
# a schema-validation failure on every typed engine. Four extra bytes a row, and no ceiling at
# two billion findings — which a busy install reaches in years rather than never.
#
# `deleteCascade: false` is not "no rule": Liquibase emits `ON DELETE SET NULL` for the
# nullable columns below, which is the rule those columns need. An issue outlives the scan
# that first saw it — that is what "first seen" means — and a repository outlives the key it
# was cloned with.
