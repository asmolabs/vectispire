# The indexes. The foreign keys are inline in the baseline — see the note at its head.
databaseChangeLog:
  - changeSet:
      id: baseline-indexes
      author: zanshin
      changes:
        # The queue's covering index, in the order the claim query filters: status, then the
        # label that routes it, then creation order. A different column order makes the engine
        # scan the queue instead of seeking into it, which is invisible until the queue is long.
        - createIndex:
            indexName: idx_scan_queue
            tableName: t_scan
            columns:
              - column: { name: status }
              - column: { name: required_agent_label }
              - column: { name: created_at }
              - column: { name: id }

        # The audit log is read in chain order and never by primary key. Without this, verifying
        # the chain sorts the whole table.
        - createIndex:
            indexName: idx_audit_log_order
            tableName: t_audit_log
            columns:
              - column: { name: timestamp }
              - column: { name: id }

        # **At most one active rule set, enforced by the database.** A unique index over a
        # nullable column counts NULLs as distinct, so inactive rows do not collide — which is
        # why deactivation writes NULL rather than false. Two active sets would mean two
        # executors scanning with different rules, and the SAST backlog resolving and
        # reappearing as they take turns.
        - createIndex:
            indexName: uq_semgrep_rule_set_active
            tableName: t_semgrep_rule_set
            unique: true
            columns:
              - column: { name: is_active }
