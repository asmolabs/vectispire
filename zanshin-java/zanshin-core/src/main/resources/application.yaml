# Defaults for a single-instance deployment. Everything here is overridable, and the two
# settings that must never be is stated below rather than left to a reviewer's memory.
spring:
  application:
    name: zanshin

  datasource:
    url: ${ZANSHIN_DB_URL:jdbc:postgresql://localhost:5432/zanshin}
    username: ${ZANSHIN_DB_USER:zanshin}
    password: ${ZANSHIN_DB_PASSWORD:}

  jpa:
    hibernate:
      # **`validate`, never `update`, and never `create`.** The schema belongs to the changelog.
      # Letting Hibernate reconcile it would mean two authorities for one schema, and the one
      # that runs second wins silently — on whichever engine happens to boot first.
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  # The API and the agent protocol share it. Long polling holds a request open, which is why
  # the read timeout below is generous and the connection count is not.
  port: ${ZANSHIN_PORT:8000}

zanshin:
  scanning:
    # Empty lets the daemon pick, which means the host's architecture — an arm64 development
    # machine would then audit a variant nobody deploys.
    image-platform: ${ZANSHIN_IMAGE_SCAN_PLATFORM:}

    # A repository with no deployment key attached falls back to this machine's own ~/.ssh.
    # **`false` on any installation where the people adding targets are not the people who own
    # that key**: the fallback is host-wide, so adding a URL is then enough to have Zanshin clone
    # it with an identity nobody attached to it.
    host-ssh: ${ZANSHIN_HOST_SSH:true}

  exports:
    # Named in SARIF's information URI and in a VEX document's identifier, so a document handed
    # to somebody else says where it came from.
    public-url: ${ZANSHIN_PUBLIC_URL:}
    vex-author: ${ZANSHIN_VEX_AUTHOR:Zanshin}
    tool-version: ${ZANSHIN_VERSION:1.0.0}

  bootstrap:
    # Read once, on an empty users table, and ignored ever after: without that condition they
    # would be a permanent back door, re-armable by restarting with the right variable set.
    username: ${ZANSHIN_BOOTSTRAP_USERNAME:}
    password: ${ZANSHIN_BOOTSTRAP_PASSWORD:}

  session:
    # The absolute lifetime bounds a stolen token's usefulness and no activity may extend it;
    # the idle one protects an unlocked screen and is deliberately much shorter.
    absolute-lifetime: ${ZANSHIN_SESSION_LIFETIME:12h}
    idle-lifetime: ${ZANSHIN_SESSION_IDLE:60m}

  oidc:
    # **Whether a password may still be exchanged for a session.** False delegates
    # authentication entirely to the identity provider — which is how Zanshin gets a second
    # factor without implementing enrolment, recovery codes and a reset path of its own.
    #
    # Honoured only when `ZANSHIN_OIDC_ISSUER` is set. Asked for without a provider, password
    # sign-in stays on and says so in the log: closing the only door that works locks everybody
    # out of a tool that holds every watched repository's deployment key. The way back from a
    # realm that has become unreachable is this variable and a restart, by whoever can reach the
    # process — not a button in the interface, which the attacker this protects against would
    # also be able to press.
    password-login: ${ZANSHIN_PASSWORD_LOGIN:true}

  audit:
    # **A second copy of the audit log, outside the database it watches.** Empty means off, and
    # `/audit-log/verify` says so rather than leaving the operator to assume otherwise. Off is
    # the default because writing to a path unasked fails on a read-only container filesystem,
    # and a control that warns on every start is one people learn to ignore.
    #
    # Point it at a path a log collector already ships: the mirror's worth is not that a file is
    # unforgeable — it is not — but that erasing an entry then takes two edits in two media, and
    # the second copy is usually off the host within seconds.
    mirror-path: ${ZANSHIN_AUDIT_MIRROR:}

  encryption:
    # The environment variable names are kept short and unprefixed on purpose: this is the one
    # value an operator has to set before the application is useful, and it is the first line
    # of every install guide.
    key: ${ENCRYPTION_KEY:}
    # Comma-separated. Keys kept only for reading, so a rotation does not have to rewrite
    # every row before the new key takes effect.
    previous-keys: ${ZANSHIN_PREVIOUS_ENCRYPTION_KEYS:}

  worker:
    # Empty labels on purpose: the built-in worker takes only work with no requirement. The
    # opposite would make targeting useless on any single-instance install, which is most.
    enabled: ${ZANSHIN_EMBEDDED_WORKER:true}
    max-concurrent: ${ZANSHIN_SCAN_MAX_CONCURRENT:2}
    labels: ${ZANSHIN_WORKER_LABELS:}
    interval: ${ZANSHIN_WORKER_INTERVAL:15s}

  jobs:
    # One minute is the backoff policy's shortest retry: slower makes a due message wait longer
    # than intended, faster finds nothing to do.
    relay-interval: ${ZANSHIN_RELAY_INTERVAL:60s}
    scheduler-interval: ${ZANSHIN_SCHEDULER_INTERVAL:60s}
    maintenance-interval: ${ZANSHIN_MAINTENANCE_INTERVAL:1h}
