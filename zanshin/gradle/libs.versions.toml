# Versions in one place, so that "which Spring Boot is this?" has exactly one answer.
[versions]
springBoot = "4.1.0"
testcontainers = "1.22.0"
archunit = "1.4.1"
junit = "6.0.1"
assertj = "3.27.6"
postgresql = "42.7.9"
mariadb = "3.5.7"
mysql = "9.5.0"
sqlite = "3.51.0.0"
bouncycastle = "1.85"
dockerJava = "3.7.1"
jgit = "7.7.1.202607240634-r"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
# Version managed by the Spring Boot BOM: pinning it here split it from what the
# autoconfiguration module expects, which is the kind of mismatch that surfaces as a
# ClassNotFoundError at startup rather than as a dependency conflict.
liquibase-core = { module = "org.liquibase:liquibase-core" }
spring-boot-liquibase = { module = "org.springframework.boot:spring-boot-liquibase" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
docker-java-core = { module = "com.github.docker-java:docker-java-core", version.ref = "dockerJava" }
docker-java-transport = { module = "com.github.docker-java:docker-java-transport-httpclient5", version.ref = "dockerJava" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
hibernate-community-dialects = { module = "org.hibernate.orm:hibernate-community-dialects" }
jgit-ssh = { module = "org.eclipse.jgit:org.eclipse.jgit.ssh.apache", version.ref = "jgit" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
