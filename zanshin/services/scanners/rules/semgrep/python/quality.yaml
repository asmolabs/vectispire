# Zanshin's own Semgrep rules — Python, code quality.
#
# `category` is what routes a rule: anything other than `security` becomes a `quality`
# finding, which is visible in the backlog and can never fail a CI gate. That is the
# whole reason these live in a separate file — so it stays obvious which side a rule is
# on when someone edits it.
rules:
  - id: zanshin-python-bare-except
    message: >-
      `except:` attrape aussi `KeyboardInterrupt` et `SystemExit`, donc empêche
      d'interrompre le programme, et masque les erreurs de programmation. Attrapez
      `Exception`, ou mieux, le type attendu.
    languages: [python]
    severity: WARNING
    metadata:
      category: best-practice
      confidence: HIGH
      references: ["https://docs.python.org/3/tutorial/errors.html"]
    pattern: |
      try:
          ...
      except:
          ...

  - id: zanshin-python-except-pass
    message: >-
      Exception avalée sans trace : quand ce chemin se déclenchera en production, il n'y
      aura rien à lire. Journalisez-la, ou commentez pourquoi elle est ignorable.
    languages: [python]
    severity: WARNING
    metadata:
      category: correctness
      confidence: MEDIUM
    pattern-either:
      - pattern: |
          try:
              ...
          except $E:
              pass
      - pattern: |
          try:
              ...
          except:
              pass

  - id: zanshin-python-mutable-default-argument
    message: >-
      La valeur par défaut est évaluée une seule fois, à la définition : cette liste (ou
      ce dictionnaire) est partagée par tous les appels et conserve ce qu'y ont laissé
      les précédents. Utilisez `None` et construisez la valeur dans le corps.
    languages: [python]
    severity: WARNING
    metadata:
      category: correctness
      confidence: HIGH
      references: ["https://docs.python.org/3/faq/programming.html"]
    pattern-either:
      - pattern: |
          def $F(..., $ARG=[], ...):
              ...
      - pattern: |
          def $F(..., $ARG={}, ...):
              ...
      - pattern: |
          def $F(..., $ARG=set(), ...):
              ...

  - id: zanshin-python-open-without-context-manager
    message: >-
      Fichier ouvert hors d'un `with` : il reste ouvert jusqu'au passage du ramasse-miettes,
      et pas du tout si une exception survient avant le `close()`.
    languages: [python]
    severity: INFO
    metadata:
      category: best-practice
      confidence: MEDIUM
    patterns:
      - pattern: $F = open(...)
      - pattern-not-inside: |
          with open(...) as $F:
              ...

  - id: zanshin-python-comparison-to-singleton
    message: >-
      `== None` compare les valeurs alors qu'il n'existe qu'un seul `None` : utilisez
      `is None`, qui dit ce qu'on veut dire et ne peut pas être détourné par un
      `__eq__` surchargé.
    languages: [python]
    severity: INFO
    metadata:
      category: best-practice
      confidence: HIGH
    pattern-either:
      - pattern: $X == None
      - pattern: $X != None
      - pattern: $X == True
      - pattern: $X == False

  - id: zanshin-python-assert-outside-tests
    message: >-
      `assert` disparaît quand Python tourne avec `-O` : une validation écrite ainsi peut
      ne jamais s'exécuter en production. Levez une exception explicite.
    languages: [python]
    severity: WARNING
    metadata:
      category: correctness
      confidence: LOW
      cwe: ["CWE-617: Reachable Assertion"]
    patterns:
      - pattern: assert $COND, ...
      # Only inside a function whose name does not start with `test_`. Semgrep cannot
      # put a metavariable in a `def` name, so the exclusion goes through the regex —
      # and it is needed even though the default ignore list skips `tests/`, because a
      # `test_*.py` sitting at the root of a package is not covered by that list.
      - pattern-inside: |
          def $FUNC(...):
              ...
      - metavariable-regex:
          metavariable: $FUNC
          regex: ^(?!test_)
