# Zanshin's own Semgrep rules — Java, security.
#
# Kotlin is not covered by these patterns: the syntax differs enough that a Java pattern
# does not match Kotlin source, and writing the Kotlin half properly is a separate piece
# of work rather than a `languages:` line. Said plainly here so nobody assumes coverage
# that does not exist.
rules:
  - id: zanshin-java-runtime-exec-concatenation
    message: >-
      Commande système construite par concaténation : tout ce qui entre dans la chaîne
      devient exécutable. Passez un tableau d'arguments à `ProcessBuilder`.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      cwe: ["CWE-78: OS Command Injection"]
      owasp: ["A03:2021 - Injection"]
    patterns:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec($CMD, ...)
          - pattern: new ProcessBuilder($CMD, ...)
      - pattern-not: Runtime.getRuntime().exec("...", ...)
      - pattern-not: new ProcessBuilder("...", ...)

  - id: zanshin-java-sql-string-concatenation
    message: >-
      Requête SQL assemblée par concaténation : c'est une injection SQL dès qu'une des
      parties vient de l'extérieur. Utilisez `PreparedStatement` avec des paramètres.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      confidence: MEDIUM
      impact: HIGH
      likelihood: HIGH
      cwe: ["CWE-89: SQL Injection"]
      owasp: ["A03:2021 - Injection"]
    pattern-either:
      - pattern: $STMT.executeQuery("..." + $VAR)
      - pattern: $STMT.executeUpdate("..." + $VAR)
      - pattern: $STMT.execute("..." + $VAR)
      - pattern: $CONN.prepareStatement("..." + $VAR)

  - id: zanshin-java-weak-hash
    message: >-
      MD5 et SHA-1 sont cassés pour tout usage de sécurité. Utilisez SHA-256, ou un
      algorithme dédié aux mots de passe (bcrypt, argon2, PBKDF2).
    languages: [java]
    severity: WARNING
    metadata:
      category: security
      confidence: HIGH
      impact: MEDIUM
      likelihood: MEDIUM
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      owasp: ["A02:2021 - Cryptographic Failures"]
    pattern-either:
      - pattern: MessageDigest.getInstance("MD5", ...)
      - pattern: MessageDigest.getInstance("SHA-1", ...)
      - pattern: MessageDigest.getInstance("SHA1", ...)

  - id: zanshin-java-weak-cipher
    message: >-
      DES, RC4 et le mode ECB ne protègent plus rien : ECB laisse voir la structure du
      clair, DES et RC4 sont cassés. Utilisez AES en mode GCM.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      owasp: ["A02:2021 - Cryptographic Failures"]
    patterns:
      - pattern: Cipher.getInstance($ALGO, ...)
      - metavariable-regex:
          metavariable: $ALGO
          regex: (?i)"(des|desede|rc2|rc4|blowfish)[/"]|.*\/ecb\/.*

  - id: zanshin-java-insecure-random-secret
    message: >-
      `java.util.Random` est prédictible à partir de quelques valeurs observées. Pour un
      secret, un jeton ou un sel, utilisez `SecureRandom`.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      confidence: MEDIUM
      impact: HIGH
      likelihood: MEDIUM
      cwe: ["CWE-338: Use of Cryptographically Weak PRNG"]
      owasp: ["A02:2021 - Cryptographic Failures"]
    patterns:
      - pattern-either:
          - pattern: $T $NAME = new Random(...);
          - pattern: $T $NAME = <... new Random(...) ...>;
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|token|password|nonce|salt|key|session).*

  - id: zanshin-java-xxe-document-builder
    message: >-
      Analyseur XML laissé avec ses réglages par défaut : il résout les entités externes,
      ce qui permet de lire des fichiers de l'hôte et d'atteindre le réseau interne
      (XXE). Désactivez `doctype-decl` via `setFeature`.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      confidence: LOW
      impact: HIGH
      likelihood: MEDIUM
      cwe: ["CWE-611: XML External Entity Reference"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/XML_External_Entity_Prevention_Cheat_Sheet.html
    patterns:
      - pattern: $F = DocumentBuilderFactory.newInstance();
      - pattern-not-inside: |
          $F = DocumentBuilderFactory.newInstance();
          ...
          $F.setFeature("http://apache.org/xml/features/disallow-doctype-decl", true);

  - id: zanshin-java-trust-all-certificates
    message: >-
      Ce gestionnaire de confiance accepte n'importe quel certificat : la connexion TLS
      devient usurpable par quiconque est sur le chemin. Faites confiance à une autorité
      précise plutôt qu'à toutes.
    languages: [java]
    severity: ERROR
    metadata:
      category: security
      confidence: MEDIUM
      impact: HIGH
      likelihood: MEDIUM
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
    pattern-either:
      - pattern: |
          public void checkServerTrusted(...) { }
      - pattern: |
          public void checkClientTrusted(...) { }
      - pattern: |
          public boolean verify(...) { return true; }
