# Zanshin's own Semgrep rules — JavaScript and TypeScript, security.
#
# Both languages on every rule: the patterns are on the JS syntax TypeScript compiles
# down to, and a rule that only fired on `.js` would silently skip most modern codebases.
rules:
  - id: zanshin-js-eval
    message: >-
      `eval` (ou `new Function`) sur une valeur non littérale exécute du code arbitraire
      dès que cette valeur peut être influencée. Pour lire une donnée structurée,
      `JSON.parse`.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      cwe: ["CWE-95: Eval Injection"]
      owasp: ["A03:2021 - Injection"]
    patterns:
      - pattern-either:
          - pattern: eval($CODE)
          - pattern: new Function($CODE)
      - pattern-not: eval("...")
      - pattern-not: new Function("...")

  - id: zanshin-js-child-process-exec
    message: >-
      `exec`/`execSync` passent la commande à un shell. Avec une valeur construite
      dynamiquement, c'est une injection de commande. Utilisez `execFile` en séparant les
      arguments.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      cwe: ["CWE-78: OS Command Injection"]
      owasp: ["A03:2021 - Injection"]
    patterns:
      - pattern-either:
          - pattern: $CP.exec($CMD, ...)
          - pattern: $CP.execSync($CMD, ...)
          - pattern: exec($CMD, ...)
          - pattern: execSync($CMD, ...)
      - pattern-not: $CP.exec("...", ...)
      - pattern-not: $CP.execSync("...", ...)
      - pattern-not: exec("...", ...)
      - pattern-not: execSync("...", ...)

  - id: zanshin-js-inner-html
    message: >-
      Affecter `innerHTML` (ou `outerHTML`) avec une valeur non littérale interprète le
      HTML qu'elle contient : c'est du XSS. Utilisez `textContent`, ou assainissez avec
      DOMPurify.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      confidence: MEDIUM
      impact: MEDIUM
      likelihood: HIGH
      cwe: ["CWE-79: Cross-site Scripting"]
      owasp: ["A03:2021 - Injection"]
    patterns:
      - pattern-either:
          - pattern: $EL.innerHTML = $VALUE
          - pattern: $EL.outerHTML = $VALUE
      - pattern-not: $EL.innerHTML = "..."
      - pattern-not: $EL.outerHTML = "..."

  - id: zanshin-js-document-write
    message: >-
      `document.write` interprète le HTML écrit et s'exécute au moment de l'analyse du
      document. Construisez les nœuds avec l'API DOM.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      confidence: MEDIUM
      impact: MEDIUM
      likelihood: MEDIUM
      cwe: ["CWE-79: Cross-site Scripting"]
    patterns:
      - pattern: document.write($VALUE)
      - pattern-not: document.write("...")

  - id: zanshin-js-open-redirect
    message: >-
      Redirection vers une destination venue de la requête : un attaquant choisit où
      atterrit votre utilisateur, tout en partant d'un lien à votre nom. Validez la
      destination contre une liste connue.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      confidence: MEDIUM
      impact: MEDIUM
      likelihood: MEDIUM
      cwe: ["CWE-601: Open Redirect"]
      owasp: ["A01:2021 - Broken Access Control"]
    pattern-either:
      - pattern: $RES.redirect($REQ.query.$P, ...)
      - pattern: $RES.redirect($REQ.params.$P, ...)
      - pattern: $RES.redirect($REQ.body.$P, ...)

  - id: zanshin-js-tls-reject-unauthorized
    message: >-
      Désactiver la vérification du certificat TLS rend la connexion usurpable par
      n'importe qui sur le chemin. Pour une autorité interne, fournissez son certificat
      via l'option `ca`.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      cwe: ["CWE-295: Improper Certificate Validation"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
    pattern-either:
      - pattern: "rejectUnauthorized: false"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"

  - id: zanshin-js-weak-hash
    message: >-
      MD5 et SHA-1 sont cassés pour tout usage de sécurité. Utilisez SHA-256, ou un
      algorithme dédié aux mots de passe (bcrypt, argon2).
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: security
      confidence: MEDIUM
      impact: MEDIUM
      likelihood: MEDIUM
      cwe: ["CWE-327: Use of a Broken or Risky Cryptographic Algorithm"]
      owasp: ["A02:2021 - Cryptographic Failures"]
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")

  - id: zanshin-js-jwt-decode-without-verify
    message: >-
      `jwt.decode` lit le jeton **sans vérifier sa signature** : son contenu est ce que
      l'appelant a bien voulu écrire. Pour authentifier, `jwt.verify`.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      confidence: MEDIUM
      impact: HIGH
      likelihood: MEDIUM
      cwe: ["CWE-347: Improper Verification of Cryptographic Signature"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
    pattern: jwt.decode(...)

  - id: zanshin-js-insecure-random-secret
    message: >-
      `Math.random()` est prédictible. Pour un secret, un jeton ou un identifiant de
      session, utilisez `crypto.randomBytes` ou `crypto.randomUUID`.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      category: security
      confidence: MEDIUM
      impact: HIGH
      likelihood: MEDIUM
      cwe: ["CWE-338: Use of Cryptographically Weak PRNG"]
      owasp: ["A02:2021 - Cryptographic Failures"]
    patterns:
      - pattern-either:
          - pattern: var $NAME = <... Math.random() ...>
          - pattern: let $NAME = <... Math.random() ...>
          - pattern: const $NAME = <... Math.random() ...>
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(secret|token|password|nonce|salt|apikey|api_key|sessionid|session_id).*
