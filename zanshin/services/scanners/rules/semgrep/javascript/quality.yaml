# Zanshin's own Semgrep rules — JavaScript and TypeScript, code quality.
rules:
  - id: zanshin-js-empty-catch
    message: >-
      Exception avalée sans trace : quand ce chemin se déclenchera en production, il n'y
      aura rien à lire. Journalisez-la, ou commentez pourquoi elle est ignorable.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: correctness
      confidence: HIGH
    pattern: |
      try { ... } catch($E) { }

  - id: zanshin-js-loose-equality
    message: >-
      `==` convertit les types avant de comparer (`0 == "0"` est vrai, `[] == false`
      aussi). Utilisez `===`. `== null`, qui teste `null` et `undefined` d'un coup, est
      l'exception admise et n'est pas signalée.
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      category: best-practice
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $A == $B
          - pattern: $A != $B
      - pattern-not: $A == null
      - pattern-not: $A != null
      - pattern-not: null == $B
      - pattern-not: null != $B

  - id: zanshin-js-console-log-left-behind
    message: >-
      Appel de journalisation de débogage laissé dans le code. En production il pollue la
      sortie, et il finit régulièrement par écrire une donnée qui n'aurait pas dû l'être.
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      category: maintainability
      confidence: MEDIUM
    pattern-either:
      - pattern: console.log(...)
      - pattern: console.debug(...)

  - id: zanshin-js-debugger-statement
    message: >-
      Instruction `debugger` laissée dans le code : elle interrompt l'exécution dès qu'un
      outil de développement est ouvert.
    languages: [javascript, typescript]
    severity: WARNING
    metadata:
      category: maintainability
      confidence: HIGH
    pattern: debugger

  - id: zanshin-js-await-in-loop
    message: >-
      `await` dans une boucle sérialise les itérations : N appels prennent N fois le
      temps d'un seul. Si elles sont indépendantes, `Promise.all`.
    languages: [javascript, typescript]
    severity: INFO
    metadata:
      category: performance
      confidence: LOW
    patterns:
      - pattern: await $P
      - pattern-either:
          - pattern-inside: |
              for (...) { ... }
          - pattern-inside: |
              while (...) { ... }
