# The schema, in one changelog for four engines.
#
# **One baseline rather than a migration history.** The NestJS implementation carried five
# migrations per dialect because it had a schema in production to evolve. Nothing is deployed
# yet, so replaying that history would be replaying somebody else's afternoon; the baseline
# below is the schema those five arrive at. The next change to this file is a real changeset,
# appended, never an edit to the baseline.
#
# **Where the engines disagree is a property, not a type.** Liquibase's abstract types cover
# most of it; the four below are where they do not, and each is a divergence that has already
# produced a defect somewhere:
#
#   json       — see the note on the property: text everywhere, deliberately.
#   uuid       — see the note on the property itself: 36 characters everywhere, deliberately.
#   timestamp  — `timestamptz` only on PostgreSQL. The others store no offset, which is why
#                every instant is written in UTC before it reaches the driver.
#   bool       — `boolean` everywhere except MySQL and MariaDB, where it is `tinyint(1)` and
#                `tinyint`. They disagree with *each other*, which is the whole argument for
#                running the parity check on all four rather than on a representative one.
databaseChangeLog:
  # Text on all four, and no native JSON type anywhere. These payloads are opaque: stored
  # verbatim, re-exported verbatim, never queried with a JSON operator. PostgreSQL's `json`
  # would buy validation and operators nothing uses, at the price of a fourth truth to keep in
  # step with the entities — and MariaDB's `json` is already an alias for `longtext`, which is
  # how the two engines that both call it `json` end up disagreeing about what it is.
  - property: { name: json.type, value: clob }

  # `char(36)` on all four, PostgreSQL included, and that is a decision rather than a
  # simplification. PostgreSQL's native `uuid` is a better column — sixteen bytes, validated by
  # the engine — but Hibernate's default mapping for a `UUID` field is `binary(16)` on the other
  # three, so a native type here means the entities agree with the schema on one engine and
  # disagree on three. The choice is one representation everywhere against four truths to keep
  # in step; the entities carry `@JdbcTypeCode(SqlTypes.CHAR)` to match, and the parity check is
  # what would have had to encode the difference otherwise.
  #
  # It also makes `select * from t_agent` readable in a shell on every engine, which
  # `binary(16)` does not.
  - property: { name: uuid.type, value: char(36) }

  - property: { name: timestamp.type, value: "timestamp with time zone", dbms: postgresql }
  - property: { name: timestamp.type, value: "datetime(6)", dbms: "mysql,mariadb" }
  - property: { name: timestamp.type, value: "datetime", dbms: sqlite }

  - include: { file: db/changelog/001-baseline.yaml }
  - include: { file: db/changelog/002-indexes.yaml }
