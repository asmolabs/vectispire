# Defaults for a single-instance deployment. Everything here is overridable, and the two
# settings that must never be is stated below rather than left to a reviewer's memory.
spring:
  application:
    name: zanshin

  datasource:
    url: ${ZANSHIN_DB_URL:jdbc:postgresql://localhost:5432/zanshin}
    username: ${ZANSHIN_DB_USER:zanshin}
    password: ${ZANSHIN_DB_PASSWORD:}

  jpa:
    hibernate:
      # **`validate`, never `update`, and never `create`.** The schema belongs to the changelog.
      # Letting Hibernate reconcile it would mean two authorities for one schema, and the one
      # that runs second wins silently — on whichever engine happens to boot first.
      ddl-auto: validate
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  # The API and the agent protocol share it. Long polling holds a request open, which is why
  # the read timeout below is generous and the connection count is not.
  port: ${ZANSHIN_PORT:8000}

zanshin:
  scanning:
    # Empty lets the daemon pick, which means the host's architecture — an arm64 development
    # machine would then audit a variant nobody deploys.
    image-platform: ${ZANSHIN_IMAGE_SCAN_PLATFORM:}

  session:
    # The absolute lifetime bounds a stolen token's usefulness and no activity may extend it;
    # the idle one protects an unlocked screen and is deliberately much shorter.
    absolute-lifetime: ${ZANSHIN_SESSION_LIFETIME:12h}
    idle-lifetime: ${ZANSHIN_SESSION_IDLE:60m}

  encryption:
    # The environment variable names are kept short and unprefixed on purpose: this is the one
    # value an operator has to set before the application is useful, and it is the first line
    # of every install guide.
    key: ${ENCRYPTION_KEY:}
    # Comma-separated. Keys kept only for reading, so a rotation does not have to rewrite
    # every row before the new key takes effect.
    previous-keys: ${ZANSHIN_PREVIOUS_ENCRYPTION_KEYS:}

  worker:
    # Empty labels on purpose: the built-in worker takes only work with no requirement. The
    # opposite would make targeting useless on any single-instance install, which is most.
    enabled: ${ZANSHIN_EMBEDDED_WORKER:true}
    max-concurrent: ${ZANSHIN_SCAN_MAX_CONCURRENT:2}
    labels: ${ZANSHIN_WORKER_LABELS:}
    interval: ${ZANSHIN_WORKER_INTERVAL:15s}

  jobs:
    # One minute is the backoff policy's shortest retry: slower makes a due message wait longer
    # than intended, faster finds nothing to do.
    relay-interval: ${ZANSHIN_RELAY_INTERVAL:60s}
    scheduler-interval: ${ZANSHIN_SCHEDULER_INTERVAL:60s}
    maintenance-interval: ${ZANSHIN_MAINTENANCE_INTERVAL:1h}
