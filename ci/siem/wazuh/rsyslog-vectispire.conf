# rsyslog relay between Vectispire and Wazuh (for /etc/rsyslog.d/vectispire.conf on the Wazuh host).
#
# Why a relay: Vectispire's syslog over TCP and TLS is RFC 5424 octet-counted (RFC 6587), and Wazuh's own
# syslog listener reads neither TLS nor that framing. rsyslog's imtcp reads both; it writes one line per
# event to a file Wazuh's logcollector follows (ossec-localfile.xml). UDP needs no relay, but delivers
# without a guarantee and without encryption.
#
# Needs the rsyslog GnuTLS driver (Debian/Ubuntu: rsyslog-gnutls; RHEL: rsyslog-gnutls; Alpine:
# rsyslog-tls). Replace the three certificate paths; the relay's certificate must name the host
# Vectispire is configured with (hostname verification is on), and its CA is what Vectispire pins.

global(
  DefaultNetstreamDriver="gtls"
  DefaultNetstreamDriverCAFile="/etc/rsyslog-vectispire/ca.pem"
  DefaultNetstreamDriverCertFile="/etc/rsyslog-vectispire/relay.pem"
  DefaultNetstreamDriverKeyFile="/etc/rsyslog-vectispire/relay.key"
)

module(load="imtcp" StreamDriver.Name="gtls" StreamDriver.Mode="1" StreamDriver.AuthMode="anon")
input(type="imtcp" port="6514" ruleset="vectispire")

# "<date> <host> vectispire: CEF:0|…": the line Wazuh's syslog pre-decoder splits into program_name and log.
template(name="vectispire-line" type="string"
         string="%timereported:::date-rfc3164% %hostname% %app-name%: %msg%\n")

ruleset(name="vectispire") {
  if $app-name == "vectispire" then {
    action(type="omfile" file="/var/log/vectispire/vectispire.log" template="vectispire-line"
           fileCreateMode="0640")
  }
  stop
}
