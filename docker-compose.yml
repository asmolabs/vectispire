services:
  # --- Database (PostgreSQL) -----------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: vectispire-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vectispire}
      POSTGRES_USER: ${POSTGRES_USER:-vectispire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vectispire_secure_db_pass}
    volumes:
      - vectispire_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vectispire} -d ${POSTGRES_DB:-vectispire}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vectispire-net

  # --- Vectispire Control Plane (Spring Boot Backend + Angular UI) ---------------------------
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    image: vectispire:latest
    container_name: vectispire-control-plane
    ports:
      - "${VECTISPIRE_PORT:-3180}:3180"
    environment:
      VECTISPIRE_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-vectispire}
      VECTISPIRE_DB_USER: ${POSTGRES_USER:-vectispire}
      VECTISPIRE_DB_PASSWORD: ${POSTGRES_PASSWORD:-vectispire_secure_db_pass}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyEh}
      VECTISPIRE_BOOTSTRAP_USERNAME: ${VECTISPIRE_BOOTSTRAP_USERNAME:-admin}
      VECTISPIRE_BOOTSTRAP_PASSWORD: ${VECTISPIRE_BOOTSTRAP_PASSWORD:-AdminVectispire2026!}
      VECTISPIRE_EMBEDDED_WORKER: ${VECTISPIRE_EMBEDDED_WORKER:-true}
    volumes:
      # Sibling container scanner execution (Syft, Grype, Semgrep, Gitleaks)
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vectispire-net

  # --- Optional: Remote Agent (for isolated container worker nodes) --------------------------
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: vectispire-agent:latest
    container_name: vectispire-agent
    profiles:
      - with-agent
    environment:
      VECTISPIRE_URL: http://control-plane:3180
      VECTISPIRE_AGENT_TOKEN: ${VECTISPIRE_AGENT_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vectispire-net

volumes:
  vectispire_data:
    name: vectispire_data

networks:
  vectispire-net:
    name: vectispire-net
    driver: bridge
