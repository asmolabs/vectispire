# **No default is a working secret.** Every value below that guards something is required and
# unset: `docker compose up` without a `.env` now stops with "variable is not set" instead of
# starting an instance whose encryption key, admin password and database password are the ones
# printed in a public repository. The three that matter are marked `:?` — Compose refuses to
# render the file at all when they are missing, which is the right moment to find out.
#
# Copy `.env.example` and fill it in, or export them:
#
#   ENCRYPTION_KEY=$(openssl rand -base64 32)
#   MYSQL_PASSWORD=$(openssl rand -base64 24)
#   VECTISPIRE_BOOTSTRAP_PASSWORD=$(openssl rand -base64 24)

services:
  # --- Database (MySQL) -----------------------------------------------------------------
  db:
    image: mysql:8
    container_name: vectispire-db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vectispire}
      MYSQL_USER: ${MYSQL_USER:-vectispire}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD — no default is provided on purpose}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD — no default is provided on purpose}
    volumes:
      - vectispire_mysql_data:/var/lib/mysql
    ports:
      # **Loopback, not every interface.** `"3306:3306"` publishes the database to the whole
      # network the host sits on; the control plane reaches it over the compose network and
      # needs no published port at all. This one is kept for the operator holding a SQL client,
      # bound where only that operator can reach it.
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD:-root_secure_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vectispire-net

  # --- Vectispire Control Plane (Spring Boot Backend + Angular UI) ---------------------------
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    image: vectispire:latest
    container_name: vectispire-control-plane
    ports:
      - "${VECTISPIRE_PORT:-3180}:3180"
    # **Les variables OIDC arrivent par un fichier, jamais par une valeur vide.**
    # `@ConditionalOnProperty("vectispire.oidc.issuer")` s'active dès que la propriété *existe* —
    # une chaîne vide comprise — et la découverte échouerait alors sur un issuer vide, au
    # démarrage, sur une installation qui n'a jamais demandé de SSO. Un `env_file` optionnel n'a
    # pas ce défaut : absent, aucune variable n'est posée et la fonctionnalité reste absente
    # plutôt que présente et refusant. Copiez `.env.oidc.example` pour l'activer.
    env_file:
      - path: .env.oidc
        required: false
    environment:
      VECTISPIRE_DB_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-vectispire}
      VECTISPIRE_DB_USER: ${MYSQL_USER:-vectispire}
      VECTISPIRE_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD — no default is provided on purpose}
      # Decrypts every deployment SSH key and integration token this instance holds. A shared
      # default here would mean anyone with a copy of this repository can read them.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?generate one with `openssl rand -base64 32`}
      VECTISPIRE_BOOTSTRAP_USERNAME: ${VECTISPIRE_BOOTSTRAP_USERNAME:-admin}
      VECTISPIRE_BOOTSTRAP_PASSWORD: ${VECTISPIRE_BOOTSTRAP_PASSWORD:?set the first administrator password}
      VECTISPIRE_EMBEDDED_WORKER: ${VECTISPIRE_EMBEDDED_WORKER:-true}
      # Empty means "nothing in front of us", so X-Forwarded-For is ignored and the peer address
      # is the rate-limit key. Set it to the balancer's address or CIDR when there is one.
      VECTISPIRE_TRUSTED_PROXIES: ${VECTISPIRE_TRUSTED_PROXIES:-}
      # **The audit mirror, on by default here and only here.** The application ships with it
      # off, because writing to a path by default fails on a read-only filesystem. A compose
      # deployment has a writable volume, so this is the one place the default can be "on".
      #
      # It is what closes the case the hash chain cannot see: deleting an entry nobody descends
      # from — the last one written — leaves a chain that verifies perfectly. The mirror makes
      # that deletion require a second edit, in a second medium, and a log collector normally
      # ships the file off the host within seconds. Point a collector at this volume.
      VECTISPIRE_AUDIT_MIRROR: ${VECTISPIRE_AUDIT_MIRROR:-/var/lib/vectispire/audit/audit-mirror.ndjson}
      # Blank keeps the pinned digests. Set to pull scanners from an internal registry.
      VECTISPIRE_IMAGE_SYFT: ${VECTISPIRE_IMAGE_SYFT:-}
      VECTISPIRE_IMAGE_GRYPE: ${VECTISPIRE_IMAGE_GRYPE:-}
      VECTISPIRE_IMAGE_GITLEAKS: ${VECTISPIRE_IMAGE_GITLEAKS:-}
      VECTISPIRE_IMAGE_CHECKOV: ${VECTISPIRE_IMAGE_CHECKOV:-}
      VECTISPIRE_IMAGE_SEMGREP: ${VECTISPIRE_IMAGE_SEMGREP:-}
      # Lets the control plane clone over SSH with the host operator's keys (mounted below).
      VECTISPIRE_HOST_SSH: ${VECTISPIRE_HOST_SSH:-true}
    volumes:
      # Sibling container scanner execution (Syft, Grype, Semgrep, Gitleaks)
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only, and only what git needs: the deploy keys the operator already uses.
      - ${HOME}/.ssh:/home/vectispire/.ssh:ro
      # The audit mirror's home. A named volume rather than a bind mount: it holds audit
      # entries, and the image creates the directory owned by its unprivileged user so the
      # volume inherits that owner instead of arriving root-owned.
      - vectispire_audit:/var/lib/vectispire/audit
    # **The socket is mounted, but the image runs as an unprivileged user.** Without this the
    # control plane starts, looks healthy, and fails every scan with "permission denied" on the
    # daemon — the Dockerfile says `--group-add` is required and this is compose's spelling of
    # it. `docker` is the group name on most hosts; on some it is a numeric GID, which is what
    # `stat -c '%g' /var/run/docker.sock` prints.
    group_add:
      - ${DOCKER_SOCKET_GROUP:-docker}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vectispire-net

  # --- Optional: Remote Agent (for isolated container worker nodes) --------------------------
  # **Keycloak, en profil et pour l'évaluation.** `docker compose --profile sso up`.
  #
  # Il n'est pas dans la composition par défaut, et ce n'est pas de la timidité : embarquer un
  # fournisseur d'identité, c'est en hériter les montées de version et les CVE. Ce que ce service
  # livre est un exemple qui marche — un realm avec le client déjà réglé et le mapper de groupes
  # correctement configuré, ce qui est précisément ce que l'on rate en le faisant à la main. Un
  # déploiement réel pointe `VECTISPIRE_OIDC_ISSUER` vers le Keycloak de l'organisation.
  #
  # `start-dev` le dit lui-même au démarrage : stockage en mémoire, pas de HTTPS, pas pour la
  # production. Le secret client et le mot de passe du realm sont dans
  # `ci/keycloak/vectispire-realm.json`, en clair et nommés pour ce qu'ils sont — **l'import de
  # realm ne substitue pas `${env.…}`**, vérifié : le marqueur ressort littéral. Un realm de
  # production porte donc ses propres secrets, posés autrement.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: vectispire-keycloak
    profiles:
      - sso
    command: ["start-dev", "--import-realm"]
    environment:
      # Pas `:?` — Compose interpole tout le fichier même pour un profil inactif, comme le dit
      # déjà le service `agent` plus bas.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./ci/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8081}:8080"
    restart: unless-stopped
    networks:
      - vectispire-net

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: vectispire-agent:latest
    container_name: vectispire-agent
    profiles:
      - with-agent
    environment:
      VECTISPIRE_URL: http://control-plane:3180
      # Not `:?` — Compose interpolates the whole file even for an inactive profile, so a
      # required variable here would stop a plain `docker compose up` for everyone who never
      # runs an agent. An empty token is not a weak secret, it is an agent that fails to enrol
      # and says so.
      VECTISPIRE_AGENT_TOKEN: ${VECTISPIRE_AGENT_TOKEN:-}
      # Blank keeps the pinned digests. Set to pull scanners from an internal registry.
      VECTISPIRE_IMAGE_SYFT: ${VECTISPIRE_IMAGE_SYFT:-}
      VECTISPIRE_IMAGE_GRYPE: ${VECTISPIRE_IMAGE_GRYPE:-}
      VECTISPIRE_IMAGE_GITLEAKS: ${VECTISPIRE_IMAGE_GITLEAKS:-}
      VECTISPIRE_IMAGE_CHECKOV: ${VECTISPIRE_IMAGE_CHECKOV:-}
      VECTISPIRE_IMAGE_SEMGREP: ${VECTISPIRE_IMAGE_SEMGREP:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.ssh:/home/vectispire/.ssh:ro
    group_add:
      - ${DOCKER_SOCKET_GROUP:-docker}
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vectispire-net

volumes:
  vectispire_mysql_data:
    name: vectispire_mysql_data
  vectispire_audit:
    name: vectispire_audit

networks:
  vectispire-net:
    name: vectispire-net
    driver: bridge
