spring:
  application:
    name: zanshin
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:../backend/database.sqlite
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    com.asmolabs.zanshin: DEBUG

zanshin:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 3600000 # 1 hour
  encryption:
    key: ${ENCRYPTION_KEY}
  frontend:
    url: ${FRONTEND_URL:http://localhost:4200}
