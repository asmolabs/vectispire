# Rendered in CI: one namespace you were given, and nothing outside it — the agents beside the control
# plane, no Namespace created. Its privileged sidecar is admitted only if that namespace's Pod Security
# level allows it, which whoever owns the namespace sets, not this chart.
database:
  url: jdbc:mysql://db.example.org:3306/vectispire
  password:
    secretName: vectispire-database
secrets:
  encryptionKey:
    secretName: vectispire-keys
trustedProxies: 10.0.0.0/8
ingress:
  className: nginx
  tls:
    secretName: vectispire-tls
agents:
  enabled: true
  namespace: ""
  createNamespace: false
  controlPlaneUrl: https://vectispire.example.org
  token:
    secretName: vectispire-agent
  signingKey:
    secretName: vectispire-agent
  knownHosts: |
    gitlab.example.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleOnlyNotARealHostKeyxxxxxxxxxxxxxxxx
  nodeSelector:
    vectispire.dev/agents: "true"
  tolerations:
    - key: vectispire.dev/agents
      operator: Exists
      effect: NoSchedule
  dind:
    imageCache:
      enabled: true
  networkPolicy:
    excludeCidrs:
      - 10.244.0.0/16
      - 10.96.0.0/12
