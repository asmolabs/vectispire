# The documentation site, published at https://asmolabs.github.io/vectispire/
#
# **Separate from `verify` on purpose.** The verification pipeline runs on every push and every
# merge request; publishing from it would mean either publishing from a branch, or adding a branch
# condition to a job that does not need one. A workflow that fires only on `main`, and only when
# the site's source has changed, says what it does in its `on:`.
#
# Every `uses:` is pinned to a commit SHA, with the version in a trailing comment, as in `ci.yml`.
# A tag is mutable: `actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0` means whatever its owner decides today, and this
# workflow holds `pages: write` and an OIDC token.

# **This workflow is the only one that deploys to Pages, and there is a reason to say so here.**
# On 30 August, `static.yml` — GitHub's "Deploy static content to Pages" template — was added in
# order to switch the site on. It uploads `path: '.'`, that is *the whole repository*, without
# building mkdocs. Three consequences, in order of severity:
#
#   1. `docs/` got published: 30 dated audit reports, two STRIDE threat models, the list of known
#      weaknesses and the state of their remediation. `mkdocs.yml`'s header explains that
#      `docs_dir` does not see `docs/` precisely so that this cannot happen, "not even by guessing
#      the URL". Uploading the root works around the protection in one `path:`.
#   2. The site did not work: without `mkdocs build`, the root has no `index.html`, so
#      `/vectispire/` answered 404 while `/vectispire/README.md` answered 200.
#   3. Two workflows targeted the `github-pages` environment with the same `pages` concurrency
#      group: the last to arrive overwrites the other.
#
# To switch Pages on, the source must be **GitHub Actions** in the repository settings; that was
# all that was missing. No second workflow is needed, and a second workflow is exactly what breaks
# this one.

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'mkdocs.yml'
      - 'ci/docs/requirements.txt'
      - '.github/workflows/docs.yml'
  # To republish without a commit — after switching Pages on, for instance.
  workflow_dispatch:

# Read the repository, write to Pages, and an OIDC token because `deploy-pages` authenticates with
# one, with no secret to hold.
permissions:
  contents: read
  pages: write
  id-token: write

# A publication in flight is not cancelled: the half-deployed page would be served.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/docs/requirements.txt
      - run: pip install -r ci/docs/requirements.txt
      # `--strict` turns warnings into failure: a dead link or a page missing from the navigation
      # stops the publication instead of going live with nobody reading the log.
      - run: mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
