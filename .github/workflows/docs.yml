# Le site de documentation, publié sur https://asmolabs.github.io/vectispire/
#
# **Séparé de `verify` exprès.** La pipeline de vérification tourne sur chaque push et chaque
# merge request ; publier depuis elle voudrait dire soit publier depuis une branche, soit ajouter
# une condition de branche à un job qui n'en a pas besoin. Un workflow qui ne se déclenche que
# sur `main` et seulement quand la source du site a changé dit ce qu'il fait dans son `on:`.
#
# Chaque `uses:` est épinglé à un SHA de commit, la version en commentaire de fin, comme dans
# `ci.yml`. Un tag est mutable : `actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0` désigne ce que son propriétaire décide
# aujourd'hui, et ce workflow détient `pages: write` et un jeton OIDC.

# **Ce workflow est le seul à déployer sur Pages, et il y a une raison de le dire ici.**
# Le 30 août, `static.yml` — le modèle « Deploy static content to Pages » proposé par GitHub — a
# été ajouté pour activer le site. Il téléverse `path: '.'`, c'est-à-dire *le dépôt entier*, sans
# construire mkdocs. Trois conséquences, dans l'ordre de gravité :
#
#   1. `docs/` s'est retrouvé publié : 30 rapports d'audit datés, deux modèles de menaces STRIDE,
#      la liste des faiblesses connues et l'état de leur remédiation. L'en-tête de `mkdocs.yml`
#      explique que `docs_dir` ne voit pas `docs/` précisément pour que cela ne puisse pas
#      arriver « pas même en devinant son URL ». Téléverser la racine contourne la protection en
#      un `path:`.
#   2. Le site ne fonctionnait pas : sans `mkdocs build`, la racine n'a pas d'`index.html`, donc
#      `/vectispire/` répondait 404 pendant que `/vectispire/README.md` répondait 200.
#   3. Deux workflows visaient l'environnement `github-pages` avec le même groupe de concurrence
#      `pages` : le dernier arrivé écrase l'autre.
#
# Pour activer Pages, la source doit être **GitHub Actions** dans les réglages du dépôt ; c'est
# tout ce qui manquait. Aucun second workflow n'est nécessaire, et un second workflow est
# exactement ce qui casse celui-ci.

name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'mkdocs.yml'
      - 'ci/docs/requirements.txt'
      - '.github/workflows/docs.yml'
  # Pour republier sans commit — après avoir activé Pages, par exemple.
  workflow_dispatch:

# Lecture du dépôt, écriture sur Pages, et un jeton OIDC parce que `deploy-pages` s'authentifie
# avec, sans secret à détenir.
permissions:
  contents: read
  pages: write
  id-token: write

# Une publication en cours n'est pas annulée : la page à moitié déployée serait servie.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/docs/requirements.txt
      - run: pip install -r ci/docs/requirements.txt
      # `--strict` transforme les avertissements en échec : un lien mort ou une page absente de
      # la navigation arrête la publication au lieu de partir en ligne sans que personne ne lise
      # le log.
      - run: mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
