# A tagged release: built, signed, and verified before anything is published.
#
# **The signing identity changes with the forge, and every instruction that names it has to
# follow.** This project has already shipped documentation telling users to verify against an
# issuer that was not the one signing — an instruction that cannot succeed, which is worse than
# none: it teaches its reader that the check passed the day they mistype it into passing.
#
#   GitLab   issuer https://gitlab.com
#            identity ${CI_PROJECT_URL}//.gitlab-ci.yml@refs/tags/<tag>
#   GitHub   issuer https://token.actions.githubusercontent.com
#            identity https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/<tag>
#
# **Renaming this file invalidates the identity of every signature made by it.** That is not a
# reason to never rename it; it is a reason to know, and to say so in the release notes when it
# happens.
#
# ⚠️ Pin every `uses:` to a commit SHA before this signs anything anyone relies on.

name: release

on:
  push:
    tags: ['v*']
  # Exercises the whole path and publishes nothing — the rehearsal that catches a broken
  # `id-token` permission before it breaks a real release.
  workflow_dispatch:

permissions:
  contents: read
  # Sigstore keyless signing needs the workflow's OIDC token. Granted here and nowhere else:
  # every other workflow in this repository is read-only.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: the suites, on the tagged tree
        run: cd vectispire-java && ./gradlew build :vectispire-core:bootJar

      - name: name the artifact after the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          JAR="vectispire-${TAG#v}.jar"
          cp vectispire-java/vectispire-core/build/libs/vectispire-core.jar "$JAR"
          echo "JAR=$JAR" >> "$GITHUB_ENV"

      - name: install cosign
        run: |
          curl -fsSL -o /usr/local/bin/cosign \
            https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x /usr/local/bin/cosign

      - name: sign
        run: cosign sign-blob --yes --bundle "${JAR}.cosign.bundle" "$JAR"

      # **Verified immediately, with the command a user will run.** A signature nobody has ever
      # verified is a signature nobody knows the shape of — and this step is what makes the
      # instruction in GETTING_STARTED a tested claim rather than a hopeful one.
      - name: verify, before anything is published
        run: |
          cosign verify-blob \
            --bundle "${JAR}.cosign.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$JAR"

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ env.JAR }}
            ${{ env.JAR }}.cosign.bundle
          retention-days: 90
