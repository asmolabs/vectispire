# The campaigns too slow to pay for on every push.
#
# **Scheduled, not per-push, and the trade is deliberate.** Forty minutes on every push would be
# paid on every push and would teach people to skip CI; paid once a night it catches the same
# regression within a day of it landing. What that concedes is real and worth naming: a
# portability defect can be merged and sit on `develop` until the small hours.
#
# **The schedule lives here, and that is the improvement the move buys.** On GitLab it was a
# pipeline schedule in the project's settings — declared in one place, configured in another, and
# invisible in review. Two of these three jobs sat unrun for days because nobody had created it.
# A `cron:` in the file cannot be forgotten, and it shows up in a diff when it changes.

name: nightly

on:
  schedule:
    # 02:30 UTC. Late enough that the day's work has landed, early enough to read at breakfast.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Portability, against real servers.
  #
  # **The GitLab version needed `TESTCONTAINERS_HOST_OVERRIDE` and Ryuk switched off**, because
  # Testcontainers spoke to a daemon in another container and the reaper could not see across that
  # boundary. Here the daemon is the runner's own: Testcontainers finds it, publishes ports on
  # localhost, and Ryuk works. Both variables are gone rather than carried over — a setting kept
  # "just in case" is a setting nobody can explain later.
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: cd vectispire-java && ./gradlew integrationTestAll
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: engine-campaign-reports
          path: vectispire-java/vectispire-core/build/reports/tests/
          retention-days: 7

  # The `Dockerfile` route is the one that ships — it can chown the audit mirror's directory where
  # Jib can only set a mode — so it is built here even though `images` already built with Jib.
  dockerfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f Dockerfile -t vectispire:nightly .
      - run: docker build -f Dockerfile.agent -t vectispire-agent:nightly .
      # Built by nothing until 2026-10-05, while the CI/CD guide tells people to build it.
      - run: docker build -f Dockerfile.cli -t vectispire-cli:nightly .
      - run: docker run --rm vectispire-cli:nightly --help
      - run: docker run --rm --entrypoint sh vectispire:nightly -c 'ls -l /app/app.jar /app/LICENSE /app/NOTICE'
      - run: docker run --rm --entrypoint sh vectispire-agent:nightly -c 'ls -l /app/app.jar /app/LICENSE /app/NOTICE'
      # The audit mirror's directory must exist and belong to the user the image runs as, which is
      # the difference between this route and Jib's.
      - run: docker run --rm --entrypoint sh vectispire:nightly -c 'ls -ld /var/lib/vectispire/audit'
      # The composition's scan check on this route's images, and through the `with-agent` profile:
      # `docker compose build` produces these, and the push pipeline only runs the Jib ones with the
      # built-in worker. Both images run as 1000:1000, which is who `work-dir` hands the directory to.
      # Every scanner runs on the agent here, the matcher against the fixture database published in
      # the agent's own cache: the agent's `VulnerabilityDatabase` is another directory than the
      # built-in worker's, and a scanner that could read one and not the other would pass `images`.
      - name: the composition scans, through its agent, on the Dockerfile images
        env:
          MODE: agent
          CONTROL_PLANE_IMAGE: vectispire:nightly
          AGENT_IMAGE: vectispire-agent:nightly
        run: ./scripts/composition-scan-check.sh

  # The interface, driven the way an analyst drives it: sign-in including MFA, four-eyes approval,
  # the settings audit trail, and VEX triage.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # **Must match `@playwright/test` in `package-lock.json`** — currently 1.62.1. Playwright
      # ships its browsers in this image and refuses to launch one it did not build; the tag
      # inherited from an earlier workflow had drifted thirteen minor versions, which nobody could
      # know because that workflow never ran.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # **On MySQL, the production default, with the schema validated (decision 0034).** A job service
    # beside the Playwright container shares its network, so the control plane and the suite's
    # helpers (`e2e/support/fixture.ts`, through `mysql2`) both reach `mysql:3306` with the variables
    # below — one address for both, read by both. The image is `TestDatabase.IMAGE`'s and the
    # campaign's `Engine.MYSQL`: one pin in several places, and a difference is a suite running on
    # an engine the campaign does not.
    services:
      mysql:
        image: mysql:9.4
        env:
          MYSQL_ROOT_PASSWORD: vectispire-ci
          MYSQL_DATABASE: vectispire
          MYSQL_USER: vectispire
          MYSQL_PASSWORD: vectispire-ci
        # Healthy only once the real server listens on TCP: the image's first-start server runs with
        # networking off, so a ping over 127.0.0.1 does not answer before the control plane could
        # connect — and Hikari fails fast rather than retrying.
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pvectispire-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      VECTISPIRE_DB_URL: jdbc:mysql://mysql:3306/vectispire
      VECTISPIRE_DB_USER: vectispire
      VECTISPIRE_DB_PASSWORD: vectispire-ci
      ENCRYPTION_KEY: ZTJlLXRlc3Qta2V5LW5vdC1hLXNlY3JldC0zMmI=
      VECTISPIRE_BOOTSTRAP_USERNAME: admin
      VECTISPIRE_BOOTSTRAP_PASSWORD: AdminVectispire2026!
      VECTISPIRE_EMBEDDED_WORKER: 'false'
      # **Thirteen browser sign-ins inside a minute is a burst by the only definition the server
      # has**, and every test in a run comes from one address. Raised here, on a runner destroyed
      # at the end of the job; the shipped default of ten is untouched.
      #
      # **What this variable does not raise.** It reaches `LoginRateLimitFilter`'s per-address
      # bucket, and nothing else. `LoginThrottle` counts separately, per account — five failures
      # over a fifteen-minute sliding window — and those thresholds are compile-time constants no
      # setting reaches. It is that second counter that made cases fail unrelated to the one that
      # had spent it, since the refusal lands on the next: the suites therefore reset it themselves
      # before each case, and the sign-in helpers remember the accepted password instead of trying
      # them all.
      VECTISPIRE_SECURITY_LOGIN_ATTEMPTS_PER_WINDOW: '200'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: cd vectispire-java && ./gradlew :vectispire-core:bootJar -x test
      - run: npm ci
      - name: start the control plane and wait for it to be able to answer
        run: |
          java -jar vectispire-java/vectispire-core/build/libs/vectispire-core.jar \
            > control-plane.log 2>&1 &
          echo $! > control-plane.pid
          # Actuator's health endpoint, not the port: the process accepts connections before it
          # can answer anything useful, and a suite that starts in that window fails on timing
          # rather than on behaviour.
          for attempt in $(seq 1 90); do
            if curl -sf http://localhost:3180/actuator/health > /dev/null; then
              echo "control plane up after ${attempt}s"; break
            fi
            if [ "$attempt" = "90" ]; then
              echo "control plane did not become healthy — last 100 lines:"
              tail -n 100 control-plane.log
              exit 1
            fi
            sleep 1
          done
      # Checked before the browsers are needed: the mismatch is otherwise discovered after
      # `npm ci` and a full Angular build, and reported against the image rather than this line.
      - name: the Playwright image matches the installed Playwright
        run: |
          want="v$(node -p "require('@playwright/test/package.json').version")-noble"
          have="v1.63.0-noble"
          if [ "$want" != "$have" ]; then
            echo "playwright image $have does not match the installed $want"
            echo "fix: set the e2e job's image to mcr.microsoft.com/playwright:$want"
            exit 1
          fi
      - run: cd vectispire-angular && npx playwright test
      - if: always()
        run: kill "$(cat control-plane.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: |
            control-plane.log
            vectispire-angular/playwright-report/
            vectispire-angular/test-results/
          retention-days: 7

  # **The restore, executed.** A backup procedure nobody has run is a belief, and the one that
  # matters here is not "does the dump load" — it is whether the audit mirror still witnesses what
  # a restore lost. The drill takes a dump from a live control plane, performs audited actions
  # after it, restores into an empty engine keeping the live mirror, and asserts the arithmetic;
  # then it repeats the restore with the mirror thrown away and asserts that the loss has become
  # invisible. If that second assertion ever stops holding, `docs/en/BACKUP_AND_RESTORE.md` is
  # describing a hazard that no longer has that shape.
  #
  # Built through the Dockerfile rather than Jib: the drill drives the API and never loads a page,
  # so the interface bundle Jib wants would be twenty minutes bought for nothing.
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f Dockerfile -t vectispire:latest .
      - run: ./scripts/restore-drill.sh
      - if: failure()
        name: what the containers had to say
        run: |
          for c in drill-app-origin drill-app-restored drill-app-blind drill-db-origin drill-db-restored; do
            echo "═══ $c"; docker logs --tail 80 "$c" 2>&1 || echo "  (absent)"
          done
