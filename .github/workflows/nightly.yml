# The campaigns too slow to pay for on every push.
#
# **Scheduled, not per-push, and the trade is deliberate.** Forty minutes on every push would be
# paid on every push and would teach people to skip CI; paid once a night it catches the same
# regression within a day of it landing. What that concedes is real and worth naming: a
# portability defect can be merged and sit on `develop` until the small hours.
#
# **The schedule lives here, and that is the improvement the move buys.** On GitLab it was a
# pipeline schedule in the project's settings — declared in one place, configured in another, and
# invisible in review. Two of these three jobs sat unrun for days because nobody had created it.
# A `cron:` in the file cannot be forgotten, and it shows up in a diff when it changes.

name: nightly

on:
  schedule:
    # 02:30 UTC. Late enough that the day's work has landed, early enough to read at breakfast.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Portability, against real servers.
  #
  # **The GitLab version needed `TESTCONTAINERS_HOST_OVERRIDE` and Ryuk switched off**, because
  # Testcontainers spoke to a daemon in another container and the reaper could not see across that
  # boundary. Here the daemon is the runner's own: Testcontainers finds it, publishes ports on
  # localhost, and Ryuk works. Both variables are gone rather than carried over — a setting kept
  # "just in case" is a setting nobody can explain later.
  databases:
    # **Pinned, not `ubuntu-latest`**: the label moves to Ubuntu 26 from 2026-10-19, in the middle of
    # 0.11.0's acceptance; a release candidate and the release it becomes are built and checked on one
    # image. Moving to the next one is a change of its own, reviewed, with the suites green on it.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: cd vectispire-java && ./gradlew integrationTestAll
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: engine-campaign-reports
          path: vectispire-java/vectispire-core/build/reports/tests/
          retention-days: 7

  # The `Dockerfile` route is the one that ships — it can chown the audit mirror's directory where
  # Jib can only set a mode — so it is built here even though `images` already built with Jib.
  dockerfiles:
    runs-on: ubuntu-24.04
    # The composition check and the Kubernetes one, each pulling the scanner images: 30 was the first's.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f Dockerfile -t vectispire:nightly .
      - run: docker build -f Dockerfile.agent -t vectispire-agent:nightly .
      # Built by nothing until 2026-10-05, while the CI/CD guide tells people to build it.
      - run: docker build -f Dockerfile.cli -t vectispire-cli:nightly .
      - run: docker run --rm vectispire-cli:nightly --help
      - run: docker run --rm --entrypoint sh vectispire:nightly -c 'ls -l /app/app.jar /app/LICENSE /app/NOTICE'
      - run: docker run --rm --entrypoint sh vectispire-agent:nightly -c 'ls -l /app/app.jar /app/LICENSE /app/NOTICE'
      # The audit mirror's directory must exist and belong to the user the image runs as, which is
      # the difference between this route and Jib's.
      - run: docker run --rm --entrypoint sh vectispire:nightly -c 'ls -ld /var/lib/vectispire/audit'
      # The composition's scan check on this route's images, and through the `with-agent` profile:
      # `docker compose build` produces these, and the push pipeline only runs the Jib ones with the
      # built-in worker. Both images run as 1000:1000, which is who `work-dir` hands the directory to.
      # Every scanner runs on the agent here, the matcher against the fixture database published in
      # the agent's own cache: the agent's `VulnerabilityDatabase` is another directory than the
      # built-in worker's, and a scanner that could read one and not the other would pass `images`.
      - name: the composition scans, through its agent, on the Dockerfile images
        env:
          MODE: agent
          CONTROL_PLANE_IMAGE: vectispire:nightly
          AGENT_IMAGE: vectispire-agent:nightly
        run: ./scripts/composition-scan-check.sh
      # **The same scan through the chart's Kubernetes shape** (decision 0045), on the same images: a k3s
      # server and an agents' node in containers, the chart installed with `agents.executor: kubernetes`,
      # the agent proving its scan pods cut off before it scans, every scanner run as a pod and each
      # finding what was planted for it. The only run that starts the agent's image from the chart: on
      # its first one it found the agent's secrets mounted where the service account's token had to go.
      - name: the chart's Kubernetes shape scans, every scanner as a pod
        env:
          CONTROL_PLANE_IMAGE: vectispire:nightly
          AGENT_IMAGE: vectispire-agent:nightly
        run: ./scripts/kubernetes-scan-check.sh

  # The interface, driven the way an analyst drives it: sign-in including MFA, four-eyes approval,
  # the settings audit trail, and VEX triage.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # **Must match `@playwright/test` in `package-lock.json`** — currently 1.63.0. Playwright
      # ships its browsers in this image and refuses to launch one it did not build; the tag
      # inherited from an earlier workflow had drifted thirteen minor versions, which nobody could
      # know because that workflow never ran.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # **On MySQL, the production default, with the schema validated (decision 0034).** A job service
    # beside the Playwright container shares its network, so the control plane and the suite's
    # helpers (`e2e/support/fixture.ts`, through `mysql2`) both reach `mysql:3306` with the variables
    # below — one address for both, read by both. The image is `TestDatabase.IMAGE`'s and the
    # campaign's `Engine.MYSQL`: one pin in several places, and a difference is a suite running on
    # an engine the campaign does not. Here by patch and index digest, as `scripts/upgrade-drill.sh`
    # explains — moved by hand with `Engine.java`, since Dependabot does not read `services:`, and
    # held to it by `scripts/check-db-pins.py`.
    services:
      mysql:
        image: mysql:9.4.0@sha256:135bc87cce147c3d28cecb9ad270b814cb52805af7ddeea83bfcaf157d05a6b2
        env:
          MYSQL_ROOT_PASSWORD: vectispire-ci
          MYSQL_DATABASE: vectispire
          MYSQL_USER: vectispire
          MYSQL_PASSWORD: vectispire-ci
        # Healthy only once the real server listens on TCP: the image's first-start server runs with
        # networking off, so a ping over 127.0.0.1 does not answer before the control plane could
        # connect — and Hikari fails fast rather than retrying. No credential: `mysqladmin ping`
        # exits 0 for a server that answers, "Access denied" included, and `-p…` would put the
        # password in the arguments `ps` shows (release notes, 0.11.0 — the composition's healthcheck).
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      VECTISPIRE_DB_URL: jdbc:mysql://mysql:3306/vectispire
      VECTISPIRE_DB_USER: vectispire
      VECTISPIRE_DB_PASSWORD: vectispire-ci
      ENCRYPTION_KEY: ZTJlLXRlc3Qta2V5LW5vdC1hLXNlY3JldC0zMmI=
      VECTISPIRE_BOOTSTRAP_USERNAME: admin
      VECTISPIRE_BOOTSTRAP_PASSWORD: AdminVectispire2026!
      VECTISPIRE_EMBEDDED_WORKER: 'false'
      # **Thirteen browser sign-ins inside a minute is a burst by the only definition the server
      # has**, and every test in a run comes from one address. Raised here, on a runner destroyed
      # at the end of the job; the shipped default of ten is untouched.
      #
      # **What this variable does not raise.** It reaches `LoginRateLimitFilter`'s per-address
      # bucket, and nothing else. `LoginThrottle` counts separately, per account — five failures
      # over a fifteen-minute sliding window — and those thresholds are compile-time constants no
      # setting reaches. It is that second counter that made cases fail unrelated to the one that
      # had spent it, since the refusal lands on the next: the suites therefore reset it themselves
      # before each case, and the sign-in helpers remember the accepted password instead of trying
      # them all.
      VECTISPIRE_SECURITY_LOGIN_ATTEMPTS_PER_WINDOW: '200'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: cd vectispire-java && ./gradlew :vectispire-core:bootJar -x test
      - run: npm ci
      - name: start the control plane and wait for it to be able to answer
        run: |
          java -jar vectispire-java/vectispire-core/build/libs/vectispire-core.jar \
            > control-plane.log 2>&1 &
          echo $! > control-plane.pid
          # Actuator's health endpoint, not the port: the process accepts connections before it
          # can answer anything useful, and a suite that starts in that window fails on timing
          # rather than on behaviour.
          for attempt in $(seq 1 90); do
            if curl -sf http://localhost:3180/actuator/health > /dev/null; then
              echo "control plane up after ${attempt}s"; break
            fi
            if [ "$attempt" = "90" ]; then
              echo "control plane did not become healthy — last 100 lines:"
              tail -n 100 control-plane.log
              exit 1
            fi
            sleep 1
          done
      # Checked before the browsers are needed: the mismatch is otherwise discovered after
      # `npm ci` and a full Angular build, and reported against the image rather than this line.
      - name: the Playwright image matches the installed Playwright
        run: |
          want="v$(node -p "require('@playwright/test/package.json').version")-noble"
          have="v1.63.0-noble"
          if [ "$want" != "$have" ]; then
            echo "playwright image $have does not match the installed $want"
            echo "fix: set the e2e job's image to mcr.microsoft.com/playwright:$want"
            exit 1
          fi
      - run: cd vectispire-angular && npx playwright test
      - if: always()
        run: kill "$(cat control-plane.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report
          path: |
            control-plane.log
            vectispire-angular/playwright-report/
            vectispire-angular/test-results/
          retention-days: 7

  # **The upgrade an installation takes next, executed on MySQL** (decision 0043 §3, §6). PostgreSQL
  # left the matrix when §3 was amended to MySQL only (2026-10-29): `scripts/upgrade-drill.sh` still
  # takes `ENGINE=postgresql`, and nothing runs it.
  # `databases` migrates an empty schema; no job had ever started a new control plane on a database
  # the previous release had been living in, which is the only way an operator ever runs a
  # migration. A NOT NULL column without a default, or a backfill that is wrong, passes on zero rows
  # and fails at the first installation with one. The drill resolves the newest `v*` release to the
  # digest the registry serves for its tag, verifies that digest with cosign against the release
  # workflow's identity at that tag — refusing to run it otherwise — writes accounts, a repository,
  # settings, a secret and an API key through its API, stops it, starts this commit's image on the
  # same database, and fails unless it becomes healthy — Flyway and `ddl-auto: validate` both run
  # before health answers — and reads every one of those fields back unchanged.
  #
  # Built through the Dockerfile, as `restore` is: the drill never loads a page. Public images
  # only, so the job needs no permission beyond reading the repository; `fetch-depth: 0` brings the
  # tags the release is resolved from. The verification needs none either — no `id-token`, which
  # signing needs and verifying does not: the signature, the certificate and the transparency-log
  # proof are public, read from ghcr.io, and Sigstore's trust root from its TUF repository, both
  # over the runner's ordinary network.
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      # A matrix of one, kept as one: bringing an engine back is a line here, not a new job.
      fail-fast: false
      matrix:
        engine: [mysql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: docker build -f Dockerfile -t vectispire:latest .
      - run: ./scripts/upgrade-drill.sh
        env:
          ENGINE: ${{ matrix.engine }}

  # **The restore, executed.** A backup procedure nobody has run is a belief, and the one that
  # matters here is not "does the dump load" — it is whether the audit mirror still witnesses what
  # a restore lost. The drill takes a dump from a live control plane, performs audited actions
  # after it, restores into an empty engine keeping the live mirror, and asserts the arithmetic;
  # then it repeats the restore with the mirror thrown away and asserts that the loss has become
  # invisible. If that second assertion ever stops holding, `docs/en/BACKUP_AND_RESTORE.md` is
  # describing a hazard that no longer has that shape.
  #
  # Built through the Dockerfile rather than Jib: the drill drives the API and never loads a page,
  # so the interface bundle Jib wants would be twenty minutes bought for nothing.
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f Dockerfile -t vectispire:latest .
      - run: ./scripts/restore-drill.sh
      - if: failure()
        name: what the containers had to say
        run: |
          for c in drill-app-origin drill-app-restored drill-app-blind drill-db-origin drill-db-restored; do
            echo "═══ $c"; docker logs --tail 80 "$c" 2>&1 || echo "  (absent)"
          done

  # **The Rust agent's parsers, fuzzed** (vectispire-rust/fuzz/): every reader of something the agent
  # does not control — a repository URL, a scanner's report, a sealed credential, a signature, a
  # known-hosts file — for two minutes each, from a corpus seeded with the reference sets. A crash, a
  # failed assertion, a timeout or a leak is a red job, and the input that did it is kept as an artifact
  # (`cargo fuzz run <target> <file>` replays it). Then Miri over the crates that call no C library,
  # which finds undefined behaviour the compiler accepted, in the dependencies' `unsafe` too.
  #
  # Nightly only: libFuzzer needs a nightly compiler, pinned in fuzz/rust-toolchain.toml, and ten
  # minutes of fuzzing on every push is the cost that teaches people to route around CI.
  rust-fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: vectispire-rust/fuzz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the pinned nightly, and cargo-fuzz at its version
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          ../security/install-tools.sh cargo-fuzz
          ../security/install-tools.sh --bin >> "$GITHUB_PATH"
      - name: every target, 120 seconds each
        run: ./run.sh 120
      - name: Miri on the crates without C (domain, crypto, scanners)
        working-directory: vectispire-rust
        run: |
          rustup component add miri --toolchain "$(sed -n 's/^channel = "\(.*\)"/\1/p' fuzz/rust-toolchain.toml)"
          toolchain="+$(sed -n 's/^channel = "\(.*\)"/\1/p' fuzz/rust-toolchain.toml)"
          for crate in vectispire-domain vectispire-crypto vectispire-scanners; do
            cargo "$toolchain" miri test -p "$crate" --lib
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: rust-fuzz-artifacts
          path: vectispire-rust/fuzz/artifacts/
          retention-days: 30

  # **The Rust port on PostgreSQL, which pull requests no longer check** (decided 2026-10-29). CI's `rust` and
  # `rust-replay` run every suite on a database with `VECTISPIRE_TEST_ENGINES=mysql`: a PostgreSQL server per job,
  # and the replay's second engine, cost a large share of those jobs' time on every push of a port in progress, for
  # an engine whose code is written beside MySQL's and seldom breaks on its own. They are paid here once a night
  # instead — the tests, the Flyway oracle and the queries' caches on both engines, then the recorded traffic replayed
  # on both — the trade `databases` makes for the Java campaign: a PostgreSQL break can sit on `develop` until the
  # small hours, and is red by breakfast. The code is still written for both engines; only where PostgreSQL is
  # checked moved. Like every job here it runs from `main`: a schedule fires on the default branch only.
  #
  # The steps are `ci.yml`'s `rust` job's that touch a database, on one server of each engine for the whole job.
  rust-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: vectispire-rust
    services:
      mysql:
        image: mysql:9.4.0@sha256:135bc87cce147c3d28cecb9ad270b814cb52805af7ddeea83bfcaf157d05a6b2
        env:
          MYSQL_ROOT_PASSWORD: vectispire-ci
        ports:
          - 3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_PASSWORD: vectispire-ci
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      CARGO_TERM_COLOR: never
      # Both, named rather than left unset, so that the log says which engines this job is for.
      VECTISPIRE_TEST_ENGINES: mysql,postgresql
      VECTISPIRE_TEST_MYSQL_USER: root
      VECTISPIRE_TEST_MYSQL_PASSWORD: vectispire-ci
      VECTISPIRE_TEST_POSTGRES_USER: postgres
      VECTISPIRE_TEST_POSTGRES_PASSWORD: vectispire-ci
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: the job's database servers, for every step after this one
        working-directory: .
        env:
          MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: |
          if [ -z "$MYSQL_PORT" ] || [ -z "$POSTGRES_PORT" ]; then
            echo "::error::a database service published no port"; exit 1
          fi
          echo "VECTISPIRE_TEST_MYSQL_URL=jdbc:mysql://127.0.0.1:$MYSQL_PORT" >> "$GITHUB_ENV"
          echo "VECTISPIRE_TEST_POSTGRES_URL=jdbc:postgresql://127.0.0.1:$POSTGRES_PORT" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Flyway oracle reads the 0.11.1 line's migrations by commit (`git ls-tree`).
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('vectispire-java/gradle/libs.versions.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vectispire/rust-tools
          key: rust-tools-${{ hashFiles('vectispire-rust/security/tools.txt') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            vectispire-rust/target
          key: rust-target-${{ runner.os }}-${{ hashFiles('vectispire-rust/Cargo.lock', 'vectispire-rust/rust-toolchain.toml') }}
          restore-keys: |
            rust-target-${{ runner.os }}-
      - name: the pinned toolchain, and nextest at its version
        run: |
          rustup show active-toolchain || rustup toolchain install
          grep -q "^channel = \"$(rustc --version | cut -d' ' -f2)\"" rust-toolchain.toml \
            || { echo "::error::rustc is not the version rust-toolchain.toml pins"; exit 1; }
          ./security/install-tools.sh cargo-nextest
          ./security/install-tools.sh --bin >> "$GITHUB_PATH"
      - name: tests, with Docker, on both engines
        run: cargo nextest run --workspace --locked --profile ci
      - name: the migration runner, held to Flyway, on both engines
        run: ./crates/migrate/oracle/check-oracle.sh
      - name: the queries' caches are current, on both engines
        run: ./crates/cp-db/scripts/sqlx-prepare.sh check
      - if: failure()
        name: containers left by the suites
        run: docker ps -a --filter name=vs-rs- --format '{{.Names}} {{.Status}}' || true

  # **The recorded traffic replayed on both engines**, which CI's `rust-replay` does on MySQL only since 2026-10-29
  # (`rust-engines` above says why). Recorded afresh at the night's commit rather than taken from a cache: one
  # recording a night is the price of a replay that cannot be of a stale Java tree.
  rust-replay:
    runs-on: ubuntu-24.04
    # Recording (16 min), the build, and the replay on two engines (34 min), measured on develop on 2026-10-28.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('vectispire-java/gradle/libs.versions.toml') }}
      # Two tests are expected to fail under the recorder, and no others (reference/recording-known-failures.txt).
      - name: the suite, recorded
        run: vectispire-rust/crates/cp-contract/scripts/record-goldens.sh "$RUNNER_TEMP/goldens"
      - name: the recordings hold no credential but the one invented value
        run: |
          set -eu
          cp vectispire-rust/security/recordings.gitleaks.toml "$RUNNER_TEMP/recordings.gitleaks.toml"
          gitleaks=zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          ./scripts/pull-pinned-image.sh "$gitleaks"
          status=0
          docker run --rm -v "$RUNNER_TEMP/goldens:/recordings:ro" -v "$RUNNER_TEMP/recordings.gitleaks.toml:/gitleaks.toml:ro" \
            "$gitleaks" \
            detect --no-git --source=/recordings --config /gitleaks.toml --redact > gitleaks.log 2>&1 || status=$?
          cat gitleaks.log
          if grep -q ' ERR ' gitleaks.log; then echo "::error::gitleaks logged an error: the scan cannot be trusted"; exit 1; fi
          if ! grep -Eq 'scanned ~[0-9]+ bytes' gitleaks.log; then echo "::error::gitleaks scanned nothing"; exit 1; fi
          [ "$status" -eq 0 ] || { echo "::error::a recording holds a credential the recorder let through"; exit 1; }
      - name: the pinned toolchain
        working-directory: vectispire-rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          grep -q "^channel = \"$(rustc --version | cut -d' ' -f2)\"" rust-toolchain.toml \
            || { echo "::error::rustc is not the version rust-toolchain.toml pins"; exit 1; }
      - name: the recordings replayed against the served routes, on both engines
        working-directory: vectispire-rust
        env:
          VECTISPIRE_TEST_ENGINES: mysql,postgresql
        run: crates/cp-contract/scripts/replay-goldens.sh "$RUNNER_TEMP/goldens"
