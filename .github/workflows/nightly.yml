name: Nightly

# **The two campaigns CI cannot afford per-pull-request, run every night instead.**
#
# `ci.yml` says plainly that engine portability is not covered there: `integrationTestAll`
# needs Docker and takes about ten minutes, so it was run by hand before a release. It caught
# five engine divergences during the port — which is the argument for running it, and running
# it by hand is the argument for it eventually not being run at all.
#
# The Playwright suites had the same shape of problem, one degree worse: four suites existed,
# `test:e2e` was defined, and nothing anywhere ran them. A suite nobody runs documents an
# intention; it does not defend anything.
#
# Nightly rather than per-PR, deliberately. Twenty minutes on every push would be paid on every
# push and would teach people to skip CI; paid once a night it catches the same regression
# within a day of it landing. What that concedes is real and worth naming: a portability defect
# can be merged and sit on `main` until the small hours. That is the trade, not an oversight.
#
# `workflow_dispatch` is here so the release checklist can run it on demand rather than
# reproducing the commands from memory.

on:
  schedule:
    # 02:30 UTC — after the working day in Europe, before the next one starts.
    - cron: "30 2 * * *"
  workflow_dispatch:

jobs:
  # The schema and the entities agree on four real engines, or they do not agree at all.
  # SQLite runs in the unit suite already; the other three need a container each, which is
  # the whole reason this is not in `ci.yml`.
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: All four engines
        working-directory: vectispire-java
        run: ./gradlew integrationTestAll

      # Each engine writes its own results directory precisely so "which engine failed" stays
      # answerable; uploading them keeps that true after the runner is gone.
      - name: Keep the per-engine results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            vectispire-java/vectispire-core/build/test-results/integrationTest-*/
            vectispire-java/vectispire-core/build/reports/tests/integrationTest-*/
          if-no-files-found: warn

  # The interface, driven the way an analyst drives it: sign-in including MFA, the four-eyes
  # approval, the settings audit trail, and VEX triage.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The browsers, and only the browsers the config asks for. `--with-deps` installs the
      # system libraries Chromium needs on a bare runner, which is the failure that otherwise
      # shows up as a launch error rather than as a missing package.
      - name: Install Playwright browsers
        working-directory: vectispire-angular
        run: npx playwright install --with-deps

      - name: Build the control plane
        working-directory: vectispire-java
        run: ./gradlew :vectispire-core:bootJar -x test

      # **Playwright starts the interface, not the API.** Its `webServer` block runs `ng serve`,
      # whose proxy sends `/api` to `localhost:3180` — so without this step every suite fails on
      # a connection refused that looks like a UI defect. SQLite because a browser test has no
      # opinion about the engine and this needs no container; the engines have their own job
      # above.
      #
      # The bootstrap password is the one the suites type. It is a throwaway credential on a
      # throwaway database inside a runner that is destroyed at the end of the job — which is
      # the only context where a hard-coded password is not a finding.
      - name: Start the control plane
        env:
          VECTISPIRE_DB_URL: jdbc:sqlite:${{ runner.temp }}/vectispire-e2e.db
          ENCRYPTION_KEY: ZTJlLXRlc3Qta2V5LW5vdC1hLXNlY3JldC0zMmI=
          VECTISPIRE_BOOTSTRAP_USERNAME: admin
          VECTISPIRE_BOOTSTRAP_PASSWORD: AdminVectispire2026!
          # No scanners are launched here, and the runner's Docker socket is not this job's
          # business: the suites drive triage and settings, not a scan.
          VECTISPIRE_EMBEDDED_WORKER: "false"
        run: |
          java -jar vectispire-java/vectispire-core/build/libs/vectispire-core.jar \
            > "${{ runner.temp }}/control-plane.log" 2>&1 &
          echo "$!" > "${{ runner.temp }}/control-plane.pid"

          # Actuator's health endpoint, not the port: the process accepts connections before it
          # can answer anything useful, and a suite that starts in that window fails on timing
          # rather than on behaviour.
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:3180/actuator/health > /dev/null; then
              echo "control plane up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          echo "control plane did not become healthy — last 100 lines:"
          tail -n 100 "${{ runner.temp }}/control-plane.log"
          exit 1

      - name: End-to-end suites
        working-directory: vectispire-angular
        run: npm run test:e2e

      - name: Stop the control plane
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/control-plane.pid" ]; then
            kill "$(cat "${{ runner.temp }}/control-plane.pid")" 2>/dev/null || true
          fi

      # The server's own log is where a failure that is not the interface's fault shows up.
      - name: Keep the control plane log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-log
          path: ${{ runner.temp }}/control-plane.log
          if-no-files-found: warn

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            vectispire-angular/playwright-report/
            vectispire-angular/test-results/
          if-no-files-found: warn
