name: CI

# Ce que la CI garde, dans l'ordre où ça a réellement cassé :
#   1. la suite de tests ;
#   2. le schéma — les entités TypeORM tournent en `synchronize: false` et *décrivent*
#      des tables que les migrations créent ; un écart entre les deux ne se voit que
#      contre une vraie base (`schema-parity.integration-spec.ts`) ;
#   3. la portabilité entre moteurs, qu'aucune base simulée ne peut montrer.
#
# Node est épinglé par `.nvmrc` sur la LTS 24 : Angular refuse Node 25.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `npm ci` et pas `npm install` : le lockfile est ce qui rend l'arbre de
        # dépendances reproductible, et pour un outil qui audite des chaînes
        # d'approvisionnement, l'installer sans le respecter serait difficile à tenir.
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Tout ce qui exige un vrai serveur de base de données.
  #
  # Son propre job parce qu'il est lent (téléchargement d'images) et parce qu'il doit
  # être *vu* tourner : ces tests existent précisément pour les défauts invisibles sur
  # une base simulée et à une relecture attentive, donc une suite qui se sauterait en
  # silence serait pire que pas de suite du tout (docs/architecture/04).
  #
  # Aucun `services:` ici : c'est `test/jest-global-setup.ts` qui démarre la base par
  # testcontainers et applique les migrations, une fois pour la campagne. Docker est
  # disponible sur les runners GitHub, ce dont testcontainers a besoin.
  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run the server-backed tests on all four engines
        # Les quatre, et non le seul PostgreSQL : un défaut de portabilité ne se voit
        # qu'en les exécutant tous, et chacun en a révélé un.
        run: npm run test:integration:all --workspace @zanshin/backend
