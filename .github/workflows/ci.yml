# The pipeline, on GitHub's runners.
#
# **A rewrite of `.gitlab-ci.yml`, not a translation of it.** The two forges differ in the one
# place that shaped every hard decision in the GitLab file: there, the Docker daemon is a separate
# container (`docker:dind`) and a bind mount names a path on *its* filesystem, not the job's. Here
# the daemon is the runner's own, so `docker run -v "$PWD:…"` works — and the contortions the
# GitLab file needed (`create` + `cp` + `start -a` for the shell-less scanners, a MySQL started
# inside the daemon, `TESTCONTAINERS_HOST_OVERRIDE`) are not carried over. Copying them would be
# cargo: they are correct answers to a question this runner does not ask.
#
# What is carried over unchanged is every *assertion*. Same digests, same thresholds, same
# baseline. The point of a port is that the checks do not quietly get weaker.
#
# **Every `uses:` is pinned to a commit SHA**, with the version it was at in a trailing comment —
# the same reasoning that pins `anchore/syft@sha256:…` below. A tag is mutable: `actions/checkout@v4`
# is a moving target, and an action swapped under a tag runs with whatever permissions the job has.
# The comment is for a human reading a diff; the SHA is what runs. To upgrade, resolve the new tag
# and replace both — never widen back to a tag because a bump is inconvenient.

name: verify

on:
  push:
    branches: [develop, main]
  pull_request:

# Least privilege by default. The release workflow raises what it needs, where it needs it.
permissions:
  contents: read

# A superseded push has nothing to prove.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

# **Every job below carries a `timeout-minutes`, and the reason is a run that hung.**
# `nightly.yml` has bounded its four jobs since it was written; this file bounded none, and on
# 30 August the `images` job stopped inside `docker run` and sat there. Its own loops are capped
# — 120 one-second attempts for the database, 90 for application health, three and a half
# minutes at worst — so the wait was outside the logic, which is exactly the case a step timeout
# cannot cover and a job timeout can.
#
# **A hanging job is worse than a failing one.** GitHub's default ceiling is six hours, so the
# run reports neither success nor failure for that whole time: the commits under it are not
# green and not red, they are *unanswered*, and nothing downstream — no branch rule, no reviewer,
# no audit — treats "unanswered" as a signal. A red job at minute 30 is information.
#
# The budgets are the measured durations with generous headroom, not round numbers: on run #17
# `secrets` took 7s, `links` 4s, `c4-drift` 6s, `dockerfile-policy` 22s, `sbom` 23s,
# `npm-audit` 36s, `vulnerabilities` 57s, `frontend` 61s and `jvm` 4m15. Anything approaching
# these ceilings has stopped doing what it was measured doing.

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
      options: --entrypoint=""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history: the scan reads commits, not the working tree.
          fetch-depth: 0
      # **Scanned against a baseline, and the distinction from a wider allowlist matters.** The
      # first run over the full history surfaced 28 hits, every one in a directory the project
      # shed when it was rewritten, in commits that can no longer be edited. Widening
      # `.gitleaks.toml` would have blinded the scan to those *values* wherever they appear next;
      # a baseline pins each hit to its commit, file, rule and line, so the same string in a new
      # commit is a new finding and still fails.
      - run: gitleaks detect --source=. --config .gitleaks.toml --baseline-path .gitleaks-baseline.json --verbose

  docs-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 scripts/check-doc-links.py
      # **A link that resolves is not a sentence that is true.** The link check and the
      # bilingual parity count both passed for five consecutive audits while `README.md`
      # announced "Four engines are supported" and `README.fr.md` — its own counterpart — said
      # two engines and a test fixture, five days after ADR 0014 recorded that reversal. Parity
      # counted files; nothing read them. This reads them, against the tree that decides the
      # answer: the engine list Gradle iterates, the migration directories Flyway carries, the
      # compliance catalogue's own enum.
      #
      # It found a live one on its first run, in the other direction: the compliance guide said
      # "five major international regulatory frameworks" above a list of six, in both languages.
      # Underselling costs the same as overselling — a reader who checks is the one who gets it
      # wrong.
      - run: python3 scripts/check-doc-facts.py

  c4-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # **The diagrams were generated from this model, or somebody edited one and forgot the
      # other.** This checks the weaker of the two things it could, and says so: the fingerprint
      # of `workspace.dsl` recorded when the diagrams were last generated. It catches the real
      # failure — the model edited without regenerating — and not a hand-edited `.puml`. Somebody
      # hand-editing a generated file has already decided to; the person who forgets is the one
      # this protects.
      #
      # Regenerating and diffing would be stronger and is possible here, unlike on GitLab where
      # the Structurizr image has no shell. Left as it is so the port changes no assertion; worth
      # revisiting on its own, deliberately.
      - name: the C4 diagrams are in step with the model
        run: |
          recorded="$(cat docs/architecture/c4/diagrams/.workspace.sha256)"
          actual="$(sha256sum docs/architecture/c4/workspace.dsl | cut -d' ' -f1)"
          if [ "$recorded" != "$actual" ]; then
            echo "workspace.dsl has changed since the diagrams were generated."
            echo "  recorded: $recorded"
            echo "  actual:   $actual"
            echo "Run ./scripts/generate-c4-diagrams.sh and commit the result."
            exit 1
          fi
          echo "C4 diagrams are in step with the model."

  dockerfile-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: bridgecrew/checkov@sha256:12a62da01af22654883aee3b9da18ba4297f123f5122663bf65235db37934144
      options: --entrypoint=""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # **The product's own scanner, pointed at the product**, at the digest `ScannerImages`
      # pins — so the version auditing this repository is the version auditing its targets.
      #
      # `--framework` now names `github_actions` rather than `gitlab_ci`: the pipeline being
      # scanned is this file. It found two real things on the GitLab side before it was wired
      # (a CLI image running as root, a missing healthcheck), which is why it is blocking.
      - run: |
          checkov --quiet --compact \
            --framework dockerfile,github_actions \
            --directory . \
            --skip-path node_modules

  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: eclipse-temurin:25-jdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('vectispire-java/gradle/libs.versions.toml') }}
      - run: cd vectispire-java && ./gradlew build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: jar
          path: vectispire-java/vectispire-core/build/libs/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: node:24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
      - run: npm ci --prefer-offline
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui
          path: vectispire-angular/dist/
          retention-days: 7

  # The SBOM of what ships, and the vulnerabilities in it.
  #
  # **This is where the port simplifies most.** Neither tool image carries a shell, which on GitLab
  # meant they could not be a job image and had to be driven `create` + `cp` + `start -a` because
  # the daemon could not see the checkout. Here the daemon is the runner's, so a bind mount is
  # both possible and obvious.
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [jvm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jar
          path: libs
      - name: build the SBOM of the jar that ships
        run: |
          docker run --rm -v "$PWD/libs:/work:ro" \
            anchore/syft@sha256:1288ea4c8b38767b4e620c1e312c8cb26b6e887a99b4f07ab6cd19fc6f225026 \
            scan file:/work/vectispire-core.jar -o cyclonedx-json > vectispire-jvm.cdx.json
          echo "components: $(grep -o '"bom-ref"' vectispire-jvm.cdx.json | wc -l)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: vectispire-jvm.cdx.json
          retention-days: 30

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [sbom]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
      # One invocation, and the log still reads report-then-verdict: grype prints the whole table
      # and *then* exits non-zero on `--fail-on`, so an operator sees the list before the failure
      # without the job scanning twice. The GitLab version did run it twice, because there the
      # daemon could not see the checkout and each run was a `docker create` whose first argument
      # was the container's name — `report` and `verdict` were those names, consumed by a `shift`.
      # Porting to `docker run --rm` removed the name and I kept the words, which sent them to
      # grype as positional arguments: `accepts at most 1 arg(s), received 2`. There is no `report`
      # subcommand; the target is the only positional argument grype takes.
      - name: report, then fail on a fixable high
        run: |
          docker run --rm -v "$PWD:/work:ro" \
            anchore/grype@sha256:1e71065c0a4cff3e6bd3b8add525ffac4343eb4971694eb90a31cf6d4d3e85db \
            sbom:/work/vectispire-jvm.cdx.json --only-fixed --fail-on high -o table

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: npm ci --prefer-offline
      - run: npm audit --omit=dev --audit-level=high
      # The whole tree for the record, including dev dependencies that never ship. Not allowed to
      # fail the run: a build tool's advisory is not a shipped vulnerability.
      - run: npm audit || true

  # **The images, and proof they serve.** The defect that made this job necessary was a `COPY` of
  # a file the build never produced — green everywhere and broken on first run.
  #
  # MySQL is started here as a container on a network this job creates, rather than as a
  # `services:` block. On GitLab that was forced: a service is a sibling of the job container and
  # invisible to the daemon that runs the image under test. Here either would work, and this one
  # is kept because it is the arrangement that has actually been executed.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [jvm, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui
          path: vectispire-angular/dist
      - name: build both images with Jib
        run: |
          cd vectispire-java
          ./gradlew :vectispire-core:jibDockerBuild :vectispire-agent:jibDockerBuild -x test \
            -PuiDist="$GITHUB_WORKSPACE/vectispire-angular/dist/vectispire/browser"
      - name: the control plane image starts, migrates and serves
        run: |
          docker network create smoke
          docker run -d --name db --network smoke \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=vectispire \
            -e MYSQL_USER=vectispire -e MYSQL_PASSWORD=vectispire mysql:8
          # Waited for before the application starts, not alongside it: Hikari is configured to
          # fail fast, so a control plane that boots one second early does not retry — it exits,
          # and the job reports a broken image when the truth is a slow database.
          #
          # **`exec` into the running database, not a fresh container per probe.** This loop used
          # to be `docker run --rm mysql:8 mysqladmin ping`, up to 120 times, printing "ready
          # after ${attempt}s" as though an attempt cost a second. An attempt costs a container
          # create, start, run and remove; on 30 August this step took **67 minutes** for work
          # bounded, on paper, at three and a half. It passed, which is the reason nobody looked:
          # a slow green is invisible in a way a red is not.
          #
          # The bound is now wall-clock and the message reports wall-clock, so the number in the
          # log and the number in the ceiling mean the same thing.
          deadline=$(( $(date +%s) + 120 ))
          until docker exec db mysqladmin ping -h 127.0.0.1 -u vectispire -pvectispire --silent > /dev/null 2>&1; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "the database never became reachable in 120s — last 100 lines:"
              docker logs --tail 100 db; exit 1
            fi
            sleep 1
          done
          echo "database ready after $(( 120 - (deadline - $(date +%s)) ))s"
          docker run -d --name vectispire-smoke --network smoke \
            -e VECTISPIRE_DB_URL="jdbc:mysql://db:3306/vectispire" \
            -e VECTISPIRE_DB_USER=vectispire \
            -e VECTISPIRE_DB_PASSWORD=vectispire \
            -e ENCRYPTION_KEY="Y2ktc21va2Uta2V5LW5vdC1hLXNlY3JldC0zMmI=" \
            -e VECTISPIRE_BOOTSTRAP_PASSWORD="CiSmoke2026!" \
            -e VECTISPIRE_EMBEDDED_WORKER=false \
            vectispire:latest
          # Probed from inside the container's own network namespace: the runner and the container
          # under test do not share `localhost`.
          #
          # **One probe container that loops, not one container per probe.** Same defect as the
          # database wait above, and the larger half of the 67 minutes: this spawned a fresh
          # `curlimages/curl` for every one of up to 90 attempts. The retry now happens *inside*
          # a single container, so the loop costs one container start and the deadline is real
          # seconds.
          #
          # Exit 2 is kept distinct from exit 1 on purpose: "answers the API but not the
          # interface" is a packaging failure — the UI never made it into the image — and reads
          # nothing like "never came up".
          set +e
          docker run --rm --network container:vectispire-smoke --entrypoint sh \
            curlimages/curl:8.11.1 -c '
              deadline=$(( $(date +%s) + 180 ))
              until curl -sf http://localhost:3180/actuator/health > /dev/null 2>&1; do
                [ "$(date +%s)" -ge "$deadline" ] && exit 1
                sleep 1
              done
              curl -sf -o /dev/null http://localhost:3180/ || exit 2
              exit 0'
          probe=$?
          set -e
          case "$probe" in
            0) echo "the control plane image is healthy and serves the interface"; exit 0 ;;
            2) echo "the image serves the API but not the interface — the UI is missing from it"
               docker logs --tail 100 vectispire-smoke; exit 1 ;;
            *) echo "the image did not become healthy in 180s — last 100 lines:"
               docker logs --tail 100 vectispire-smoke; exit 1 ;;
          esac
      - if: always()
        run: docker logs --tail 200 vectispire-smoke || true

  # **La campagne moteurs, sur le changement qui touche au schéma.**
  #
  # Elle ne vivait que dans `nightly.yml`, et GitHub ne déclenche un workflow planifié que depuis
  # la branche par défaut : une migration fusionnée dans `develop` attendait donc que `main`
  # rattrape son retard avant qu'un moteur ne l'exécute une seule fois. Le 2 septembre, trois
  # migrations se trouvaient dans cet écart en même temps, dont une posant vingt-quatre clés
  # étrangères et supprimant des lignes orphelines. Le nocturne reste ; ceci fait qu'il n'est plus
  # le seul endroit où la campagne existe.
  #
  # **Elle se déclenche aussi sur les poussées directes, pas seulement sur les pull requests.**
  # L'écart ci-dessus a précisément été creusé par des commits poussés droit sur `develop` : ne
  # filtrer que les pull requests aurait laissé passer chacun d'eux, c'est-à-dire exactement la
  # panne que ce job existe pour empêcher.
  #
  # Pas de `container:` ici, contrairement à `jvm` plus haut : Testcontainers a besoin du démon du
  # runner, qu'un conteneur de job ne peut pas atteindre. Même forme que le job `databases` de
  # `nightly.yml`, délibérément.
  migration-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      touched: ${{ steps.detect.outputs.touched }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: detect
        env:
          # Par l'environnement plutôt qu'interpolé dans le script : ces valeurs viennent de
          # GitHub et non d'un contributeur, mais la règle ne souffre pas d'exception locale.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # **Indéterminé veut dire « exécuter ».** Une plage qu'on ne sait pas résoudre — une
          # branche nouvelle, une poussée forcée, un historique tronqué — n'est pas une preuve
          # qu'aucune migration n'a changé. Le repli va donc vers la campagne, pas vers le silence.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "plage non résoluble — la campagne est exécutée par défaut"
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -q 'src/main/resources/db/migration/'; then
            echo "une migration a changé — la campagne est exécutée"
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "aucune migration touchée — la campagne est ignorée"
            echo "touched=false" >> "$GITHUB_OUTPUT"
          fi

  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [migration-changes]
    # Ignoré plutôt qu'exécuté à vide : un job qui rapporte vert sans rien avoir fait est un
    # signal que personne ne peut lire, et ce fichier tient qu'« inattendu » n'est pas un signal.
    if: needs.migration-changes.outputs.touched == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: cd vectispire-java && ./gradlew integrationTestAll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: engine-campaign-reports-verify
          path: vectispire-java/vectispire-core/build/reports/tests/
          retention-days: 7
