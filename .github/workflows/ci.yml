name: CI

# What this guards, in order of how often it has actually broken:
#   1. the test suite;
#   2. schema drift — a model changed without a migration, which used to be
#      undetectable and is now a hard failure (`alembic check`);
#   3. migrations that don't actually run, including the backfill in 0002.
#
# `reflex compile --dry` is deliberately not here: it needs a provisioned .web
# directory (node/bun), which would make CI slow and flaky for a check that is
# fast and reliable to run locally. See CONTRIBUTING notes in README.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        # The suite runs entirely against in-memory SQLite and never touches a
        # real database, Docker daemon or network (see tests/conftest.py).
        run: uv run pytest -q

      - name: Build the schema from migrations
        # Proves the migrations run from empty on a clean database — the path a
        # fresh deployment takes, which is otherwise only exercised by hand.
        env:
          ZANSHIN_DATABASE_URL: sqlite:///${{ runner.temp }}/ci.sqlite
        run: uv run alembic upgrade head

      - name: Check for schema drift
        # Fails if the models declare anything the migrations don't create: the
        # class of mistake that silently produced a database the code couldn't
        # read.
        env:
          ZANSHIN_DATABASE_URL: sqlite:///${{ runner.temp }}/ci.sqlite
        run: uv run alembic check

      - name: Type check
        # Narrowed to the rules that find real defects here — see the long comment on
        # [tool.pyright] in pyproject.toml for why the rest are off. It earned its place
        # by catching a `NameError` in `ScanRepository.count_by_queue_state` that the
        # whole suite missed, because its only caller swallows exceptions into a toast.
        run: uvx pyright

      - name: Check migrations are reversible
        # Not to use downgrades in production, but because a downgrade that
        # doesn't parse usually means the upgrade was written without thinking
        # about what it changed.
        env:
          ZANSHIN_DATABASE_URL: sqlite:///${{ runner.temp }}/ci.sqlite
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

  # Everything that needs a real server: PostgreSQL for the schema and the transactional
  # claim, Redis for the shared security counters.
  #
  # Its own job because it is slow (image pulls) and because it must be *seen* to run:
  # these tests exist precisely for the defects that are invisible on SQLite and to a
  # careful reading, so a suite that skipped them quietly would be worse than not
  # having them (docs/architecture/04).
  backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run the server-backed tests
        # Docker is available on GitHub runners, which is what testcontainers needs.
        run: uv run pytest -m backends -q

  # La pile TypeScript en cours de construction (docs/migration-nestjs-angular.md).
  #
  # Son propre job, et non des étapes ajoutées à `test` : tant que les deux plans de
  # contrôle coexistent, un échec de l'un ne doit pas masquer l'état de l'autre. Node
  # est épinglé sur la LTS 24 — Angular refuse Node 25, ce qui a été le premier
  # obstacle rencontré.
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # `npm ci` et pas `npm install` : le lockfile est ce qui rend l'arbre de
        # dépendances reproductible, et pour un outil qui audite des chaînes
        # d'approvisionnement, l'installer sans le respecter serait difficile à tenir.
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Le pendant TypeScript du job `backends` : ce qui ne peut se vérifier que contre un
  # vrai serveur. Le pilote `node-postgres` rend par défaut un `Date` pour un
  # `timestamp`, ce qui perd la microseconde *et* applique le fuseau de la machine —
  # deux défauts silencieux qui casseraient la chaîne d'intégrité du journal d'audit.
  # Aucun test sur base simulée ne peut le voir.
  typescript-backends:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: zanshin
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run the server-backed tests
        env:
          ZANSHIN_TEST_DATABASE_URL: postgres://postgres:zanshin@localhost:5432/postgres
        run: npm run test:integration --workspace @zanshin/backend
