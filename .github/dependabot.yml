# Dependency updates, proposed as pull requests against `develop`.
#
# **Against `develop`, not the default branch.** `main` only ever moves by fast-forward to a
# commit `develop` has already verified; a pull request merged straight into it would skip the
# very pipeline the rule exists for. `target-branch` is what keeps Dependabot inside that flow.
#
# **Grouped, weekly.** One pull request per ecosystem for minors and patches, so a week of
# updates is one review and one pipeline rather than thirty. Majors stay separate: each one is a
# migration somebody has to read.
#
# **What each ecosystem must not be offered**, and why it is written here rather than trusted to
# a range somewhere else:
#
# - `pip` — `ci/docs/requirements.txt` is generated by `uv pip compile`, without the
#   `pip-compile` header Dependabot looks for, so it does not read the bounds in
#   `requirements.in` and would propose MkDocs 2, which removes plugins this site cannot live
#   without. A bump here must also be regenerated with the command in `requirements.in`, so the
#   hashes of every transitive package agree; Dependabot updates the line it names.
# - `docker` — Angular refuses Node 25, which `.nvmrc` pins to LTS 24 for the same reason.
#
# The scanners Vectispire runs on its targets are pinned by digest in `ScannerImages` and are not
# here: they are updated deliberately, together with `ci.yml`, so the same scanner audits
# Vectispire as audits its targets.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # **Dependabot does not update `gradle/verification-metadata.xml`.** A bump signed by a key
  # already trusted for its group verifies as it is; one bringing a new signer, a new group or an
  # unsigned artifact (every Gradle Plugin Portal one) fails `jvm` with the artifacts named. The
  # answer is `vectispire-java/gradle/update-verification-metadata.sh` on the pull request's
  # branch and a review of what it adds, pushed by a person — never a workflow regenerating on the
  # bot's behalf, which would trust whatever the pull request resolves, and would need a token
  # that writes to a branch in the job running the pull request's build (`quality-gate`, step 2).
  - package-ecosystem: gradle
    directory: /vectispire-java
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]
    # **Immutables follows docker-java, not its own releases.** It is on the classpath only so that
    # javac can read the annotations docker-java's transport types keep, and the version has to be
    # the one docker-java was compiled with (3.7.1 declares 2.10.1): any other risks the
    # "unknown enum constant" warning `-Werror` fails on. #24 proposed 2.12.2 in the weekly group.
    # It moves by hand, with docker-java.
    #
    # **Jackson 3 stays on the minor Spring Boot manages.** `jackson3` in `libs.versions.toml` is
    # pinned above the BOM only for security patches (3.1.7 fixes every advisory to date); #28 proposed
    # 3.2.3, a minor no Spring Boot 4.1 release has been tested with, and json-schema-validator 3.0.7,
    # which asks for it. Patches of 3.1 still come through. Lift both lines when the Spring Boot BOM
    # manages Jackson 3.2.
    ignore:
      - dependency-name: org.immutables:value-annotations
      - dependency-name: "tools.jackson*"
        update-types: [version-update:semver-minor, version-update:semver-major]
      - dependency-name: com.networknt:json-schema-validator
        versions: [">=3.0.7"]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # **Majors that are a migration, not an update.** Dependabot once proposed Angular 22 with
    # TypeScript 7 (#8), which Angular's compiler does not support, and vitest 5 (#11), whose
    # removed `vitest/node` Angular's own test runner still imported. Angular, TypeScript and
    # vitest move together through `ng update`, which also migrates the code — a deliberate
    # change, not a weekly pull request. Angular 22 was done that way; Angular 23 will be too.
    # happy-dom, the unit-test DOM, is held at its major for a different reason: it does not move
    # with `ng update`, but a DOM major changes what every spec observes, and one needs its own
    # look — jsdom 30 (#10) renamed a private Blob field vitest 4 reads and broke the download
    # specs, which is why jsdom was replaced. Its minors and patches come through, and they matter:
    # happy-dom has published five advisories since 2024, four of them fixed in a patch. The fifth,
    # a VM escape, was fixed only in 20.0.0 — a major this rule would hold back, and nothing turns
    # red for it: `npm-audit` fails on shipped dependencies only and merely records a dev one's.
    # When happy-dom appears in that record, its major is moved by hand.
    #
    # TypeScript minors are held as well: Angular supports exactly one of them at a time
    # (22 accepts `>=6.0 <6.1`), so a 6.1 pull request cannot build before Angular moves.
    ignore:
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@angular-devkit/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@schematics/angular"
        update-types: [version-update:semver-major]
      - dependency-name: angular-eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      # The coverage provider refuses a Vitest of another version, so its major is vitest's.
      - dependency-name: "@vitest/*"
        update-types: [version-update:semver-major]
      - dependency-name: happy-dom
        update-types: [version-update:semver-major]
    groups:
      # Angular's packages move together or not at all: a half-applied framework bump does not
      # build.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular", "angular-eslint", "typescript"]
      # **Playwright in a group of its own**, because it never moves without its image: the e2e job runs in
      # mcr.microsoft.com/playwright pinned to one version, in ci.yml and nightly.yml, and a
      # package ahead of its image fails the guard that checks them (#9). Dependabot does not see
      # the image; a pull request of its own is the reminder to move it in the same change.
      playwright:
        patterns: ["@playwright/test", "playwright", "playwright-core"]
      npm:
        patterns: ["*"]
        exclude-patterns: ["@playwright/test", "playwright", "playwright-core"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ci/docs
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: mkdocs
        update-types: [version-update:semver-major]
    groups:
      docs:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
