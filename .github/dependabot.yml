# Dependency updates, proposed as pull requests against `develop`.
#
# **Against `develop`, not the default branch.** `main` only ever moves by fast-forward to a
# commit `develop` has already verified; a pull request merged straight into it would skip the
# very pipeline the rule exists for. `target-branch` is what keeps Dependabot inside that flow.
#
# **Grouped, weekly.** One pull request per ecosystem for minors and patches, so a week of
# updates is one review and one pipeline rather than thirty. Majors stay separate: each one is a
# migration somebody has to read.
#
# **What each ecosystem must not be offered**, and why it is written here rather than trusted to
# a range somewhere else:
#
# - `pip` — `ci/docs/requirements.txt` is generated by `uv pip compile`, without the
#   `pip-compile` header Dependabot looks for, so it does not read the bounds in
#   `requirements.in` and would propose MkDocs 2, which removes plugins this site cannot live
#   without. A bump here must also be regenerated with the command in `requirements.in`, so the
#   hashes of every transitive package agree; Dependabot updates the line it names.
# - `docker` — Angular refuses Node 25, which `.nvmrc` pins to LTS 24 for the same reason.
#
# The scanners Vectispire runs on its targets are pinned by digest in `ScannerImages` and are not
# here: they are updated deliberately, together with `ci.yml`, so the same scanner audits
# Vectispire as audits its targets.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /vectispire-java
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # **Majors that are a migration, not an update.** Dependabot once proposed Angular 22 with
    # TypeScript 7 (#8), which Angular's compiler does not support, and vitest 5 (#11), whose
    # removed `vitest/node` Angular's own test runner still imported. Angular, TypeScript and
    # vitest move together through `ng update`, which also migrates the code — a deliberate
    # change, not a weekly pull request. Angular 22 was done that way; Angular 23 will be too.
    # jsdom 30 (#10) broke the download specs and needs its own look.
    #
    # TypeScript minors are held as well: Angular supports exactly one of them at a time
    # (22 accepts `>=6.0 <6.1`), so a 6.1 pull request cannot build before Angular moves.
    ignore:
      - dependency-name: "@angular/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@angular-devkit/*"
        update-types: [version-update:semver-major]
      - dependency-name: "@schematics/angular"
        update-types: [version-update:semver-major]
      - dependency-name: angular-eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: jsdom
        update-types: [version-update:semver-major]
    groups:
      # Angular's packages move together or not at all: a half-applied framework bump does not
      # build.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular", "angular-eslint", "typescript"]
      # **Playwright in a group of its own**, because it never moves without its image: the e2e job runs in
      # mcr.microsoft.com/playwright pinned to one version, in ci.yml and nightly.yml, and a
      # package ahead of its image fails the guard that checks them (#9). Dependabot does not see
      # the image; a pull request of its own is the reminder to move it in the same change.
      playwright:
        patterns: ["@playwright/test", "playwright", "playwright-core"]
      npm:
        patterns: ["*"]
        exclude-patterns: ["@playwright/test", "playwright", "playwright-core"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ci/docs
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: mkdocs
        update-types: [version-update:semver-major]
    groups:
      docs:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
