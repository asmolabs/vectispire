<p-dialog
    [header]="'repositories.scorecard_dialog_title' | translate"
    [(visible)]="page.scorecardVisible"
    [modal]="true"
    [style]="{ width: '38rem' }"
>
    @if (page.selectedScorecard(); as card) {
        <app-scorecard [card]="card">
            <!-- Dynamic Badge Preview & Copy Snippet -->
            @if (card.targetId) {
                <div class="p-4 border rounded-xl bg-surface-0 dark:bg-surface-900 flex flex-col gap-3">
                    <div class="text-sm font-semibold">{{ 'repositories.badge_title' | translate }}</div>
                    @if (page.badge(); as state) {
                        @if (state.published && state.url) {
                            <div class="flex items-center justify-between gap-4">
                                <img [src]="state.url" [alt]="'repositories.badge_alt' | translate" class="h-6" />
                                <div class="flex items-center gap-2">
                                    <p-button
                                        [label]="
                                            page.copied()
                                                ? ('repositories.badge_copied' | translate)
                                                : ('repositories.badge_copy' | translate)
                                        "
                                        [icon]="page.copied() ? 'pi pi-check' : 'pi pi-copy'"
                                        [severity]="page.copied() ? 'success' : 'primary'"
                                        size="small"
                                        (onClick)="copyBadgeMarkdown()"
                                    />
                                    <p-button
                                        [label]="'repositories.badge_revoke' | translate"
                                        icon="pi pi-eye-slash"
                                        severity="secondary"
                                        size="small"
                                        [disabled]="page.badgeBusy()"
                                        (onClick)="revokeBadge(card.targetId!)"
                                    />
                                </div>
                            </div>
                        } @else {
                            <div class="flex items-center justify-between gap-4">
                                <div class="text-sm text-surface-500">
                                    {{ 'repositories.badge_not_published' | translate }}
                                </div>
                                <p-button
                                    [label]="'repositories.badge_publish' | translate"
                                    icon="pi pi-share-alt"
                                    size="small"
                                    [disabled]="page.badgeBusy()"
                                    (onClick)="publishBadge(card.targetId!)"
                                />
                            </div>
                        }
                    }
                </div>
            }
        </app-scorecard>
    }
    <ng-template #footer>
        <p-button [label]="'common.close' | translate" [text]="true" (onClick)="page.scorecardVisible.set(false)" />
    </ng-template>
</p-dialog>
