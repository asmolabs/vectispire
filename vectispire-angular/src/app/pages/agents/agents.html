<div class="mb-6 flex flex-wrap items-center justify-between gap-4">
    <div>
        <h1 class="text-2xl font-semibold m-0">{{ 'agents.title' | translate }}</h1>
        <p class="text-muted-color mt-1 mb-0">{{ 'agents.subtitle' | translate }}</p>
    </div>
    <div class="flex items-center gap-2">
        <p-button
            icon="pi pi-refresh"
            severity="secondary"
            [outlined]="true"
            [loading]="page.loading()"
            [ariaLabel]="'common.refresh' | translate"
            (onClick)="page.reload()"
        />
        <p-button [label]="'agents.declare_btn' | translate" icon="pi pi-plus" (onClick)="page.openForm()" />
    </div>
</div>

<app-agent-notices />
<app-agent-kpis />
<app-running-scans />
<app-pending-scans />
<app-agent-table />

<app-declare-agent-dialog />
<app-concurrency-dialog />
<app-issued-secret-dialog />
<app-signing-key-dialog />
<app-delete-agent-dialog />
<app-reset-sealing-dialog />
