<p-dialog
    [header]="'agents.token_modal_title' | translate"
    [(visible)]="page.secretVisible"
    [modal]="true"
    [closable]="false"
    [style]="{ width: '36rem' }"
>
    <p-message severity="warn" [closable]="false" styleClass="mb-4 w-full">
        {{ 'agents.token_modal_desc' | translate }}
    </p-message>
    <div class="font-mono text-sm p-3 border rounded break-all select-all" style="border-color: var(--surface-border)">
        {{ page.issuedSecret() }}
    </div>
    <ng-template #footer>
        <p-button [label]="'common.confirm' | translate" (onClick)="dismissSecret()" />
    </ng-template>
</p-dialog>
