<div class="mb-4">
    <h1 class="text-2xl font-semibold m-0">{{ 'checklist_templates.title' | translate }}</h1>
    <p class="text-muted-color mt-1 mb-0">{{ 'checklist_templates.subtitle' | translate }}</p>
</div>

@if (page.error(); as message) {
    <p-message severity="error" [closable]="true" styleClass="mb-4 w-full">{{ message }}</p-message>
}
@if (page.notice(); as message) {
    <p-message severity="success" [closable]="true" styleClass="mb-4 w-full" data-testid="notice">{{
        message
    }}</p-message>
}

@if (page.writes()) {
    <app-template-import />
}

<app-template-list />

<app-template-version-panel />
