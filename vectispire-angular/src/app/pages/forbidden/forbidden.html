<div class="flex flex-col items-center justify-center text-center gap-4 py-16 px-4">
    <i class="pi pi-lock text-4xl text-muted-color"></i>

    <h1 class="text-2xl font-semibold m-0">{{ reason() }}</h1>

    <p class="text-muted-color max-w-prose m-0">
        {{ 'forbidden.your_role' | translate }} <strong>{{ role() }}</strong>.
        @if (page()) {
            <span class="block mt-1">{{ 'forbidden.page_asked' | translate }} <code>/{{ page() }}</code></span>
        }
    </p>

    <!--
        Deux sorties, pas un cul-de-sac. La seconde dépend du compte : un auditeur vient constater,
        on l'envoie au journal d'audit plutôt qu'à un backlog qu'il ne triera pas.
    -->
    <div class="flex flex-wrap gap-2 justify-center mt-2">
        <p-button [label]="'forbidden.back_to_dashboard' | translate" icon="pi pi-home" routerLink="/dashboard" />
        <p-button [label]="'forbidden.somewhere_useful' | translate" [outlined]="true" [routerLink]="elsewhere()" />
    </div>
</div>
