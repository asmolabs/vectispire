@if (total() > 0) {
    <div class="flex flex-wrap items-end gap-3 mb-4" data-testid="line-filter">
        @if (options().length > 0) {
            <div class="flex flex-col gap-1">
                <label for="filter-profiles" class="text-sm font-medium">{{
                    'project_checklist.filter_profiles' | translate
                }}</label>
                <p-multiselect
                    inputId="filter-profiles"
                    name="profiles"
                    [options]="options()"
                    optionLabel="label"
                    optionValue="value"
                    [ngModel]="page.lineFilter().profiles"
                    (ngModelChange)="setProfiles($event)"
                    [placeholder]="'project_checklist.filter_profiles_all' | translate"
                    display="chip"
                    appendTo="body"
                    styleClass="min-w-60"
                    data-testid="filter-profiles"
                />
            </div>
        }
        @if (mine().length > 0) {
            <p-button
                id="filter-mine"
                icon="pi pi-user"
                size="small"
                [outlined]="true"
                [label]="'project_checklist.filter_mine' | translate"
                (onClick)="showMine()"
            />
        }
        <div class="flex items-center gap-2">
            <p-checkbox
                inputId="filter-to-fill"
                [binary]="true"
                [ngModel]="page.lineFilter().toFill"
                (ngModelChange)="setToFill($event)"
            />
            <label for="filter-to-fill" class="text-sm">{{ 'project_checklist.filter_to_fill' | translate }}</label>
        </div>
        @if (active()) {
            <span class="text-sm text-muted-color" data-testid="filter-count">{{
                'project_checklist.filter_count' | translate: { shown: shown(), total: total() }
            }}</span>
            <p-button
                id="filter-clear"
                icon="pi pi-filter-slash"
                size="small"
                [text]="true"
                [label]="'project_checklist.filter_clear' | translate"
                (onClick)="clear()"
            />
        }
    </div>
    @if (active() && shown() === 0) {
        <p class="text-muted-color" data-testid="filter-none">{{ 'project_checklist.filter_none' | translate }}</p>
    }
}
