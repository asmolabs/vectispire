# The public documentation site, published at https://asmolabs.github.io/vectispire/
#
# **The site is not the repository.** `docs/` is the internal working folder: 30 dated security
# audit reports, two STRIDE threat models, a security/quality review, a compliance file, the
# architecture register. None of that is published, and it is not a question of length: a public
# site exposing the list of known weaknesses and the state of their remediation does a favour to
# the wrong person.
#
# The site therefore has its own source, `docs-site/`, written for a reader who *uses* Vectispire
# rather than for somebody building it. The two trees do not cross: `docs_dir` does not see
# `docs/`, so no internal document can end up published by accident — not even by guessing its
# URL, which a mere navigation exclusion would not have prevented.

site_name: Vectispire
site_description: How to install, operate and administer Vectispire
site_url: https://asmolabs.github.io/vectispire/
repo_url: https://github.com/asmolabs/vectispire
repo_name: asmolabs/vectispire
edit_uri: edit/main/docs-site/
copyright: Apache-2.0 — Asmolabs

docs_dir: docs-site
site_dir: site

theme:
  name: material
  custom_dir: docs-site-overrides
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        # **Translated per language below, in `languages:`.** This string does not belong to the
        # theme: it is written here, so `reconfigure_material` does not see it and "Rechercher"
        # ended up in French next to "Switch to dark mode".
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  # **Search comes first and i18n second**: `static-i18n` rebuilds the search index per language,
  # which it can only do if `search` is already registered.
  - search
  # The site in two languages, with one URL per language rather than a client-side switch.
  #
  # **The suffix is in the file name.** `installation.md` is the English, `installation.fr.md` the
  # French; the English page stays at `/getting-started/installation/` and the French one lands at
  # `/fr/getting-started/installation/`. No page changes URL, so no existing link breaks.
  #
  # `fallback_to_default: true` serves the English version under the French URL as long as the
  # translation does not exist. That is a chosen degradation, not an oversight: the alternative is
  # a 404 on a page the language switcher has just offered, which is worse. The banner below says
  # so to the reader instead of leaving them to work it out.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          # What the plugin cannot infer: the strings this file writes itself.
          site_name: Vectispire
          site_description: Installer, exploiter et administrer Vectispire
          copyright: Apache-2.0 — Asmolabs
          theme:
            language: fr
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/weather-night
                  name: Passer au thème sombre
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: indigo
                accent: indigo
                toggle:
                  icon: material/weather-sunny
                  name: Passer au thème clair
          nav_translations:
            Home: Accueil
            Getting started: Démarrer
            Installation: Installation
            Your first scan: Premier scan
            Reading the results: Lire les résultats
            User guide: Guide d'utilisation
            Dashboard: Tableau de bord
            Repositories: Dépôts
            Container images: Images de conteneur
            Scans: Scans
            Issues and triage: Constats et triage
            Remediation plan: Plan de remédiation
            Remediation times: Délais de correction
            Code quality: Qualité du code
            Inventory and licenses: Inventaire et licences
            Risk analysis: Analyse de risque
            Compliance: Conformité
            Statement of applicability: Déclaration d'applicabilité
            Certified scope: Périmètre certifié
            Exceptions: Exceptions
            History and evidence: Historique et preuves
            Attestation: Attestation
            Exports: Exports
            Integrations: Intégrations
            CI policy gate: Barrière CI
            Notifications: Notifications
            Tracker tickets: Tickets
            Administration: Administration
            Users and teams: Utilisateurs et équipes
            Solutions and projects: Solutions et projets
            Your account and MFA: Votre compte et le second facteur
            Four-eyes approval: Double validation
            Single sign-on: Authentification unique
            API keys: Clés d'API
            SSH keys: Clés SSH
            Gate policies: Politiques de barrière
            Agents: Agents
            Semgrep rule sets: Jeux de règles Semgrep
            Settings: Réglages
            Audit log: Journal d'audit
            Rotation and purge: Rotation et purge
            Reference: Référence
            Configuration: Configuration
            FAQ: FAQ

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Les pages renvoient vers le code sur GitHub en URL absolue, jamais en relatif : le code n'est
# pas sous `docs_dir` et un lien relatif vers lui ne pourrait que casser.
validation:
  omitted_files: warn
  absolute_links: ignore
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Your first scan: getting-started/first-scan.md
      - Reading the results: getting-started/reading-results.md
  - User guide:
      - Dashboard: guide/dashboard.md
      - Repositories: guide/repositories.md
      - Container images: guide/containers.md
      - Scans: guide/scans.md
      - Issues and triage: guide/issues.md
      - Remediation plan: guide/remediation.md
      - Remediation times: guide/remediation-delays.md
      - Code quality: guide/quality.md
      - Inventory and licenses: guide/inventory-and-licenses.md
      - Risk analysis: guide/risk-analysis.md
      - Compliance: guide/compliance.md
      - Statement of applicability: guide/statement-of-applicability.md
      - Certified scope: guide/certified-scope.md
      - Exceptions: guide/exceptions.md
      - History and evidence: guide/history.md
      - Attestation: guide/attestation.md
      - Exports: guide/exports.md
  - Integrations:
      - CI policy gate: integrations/ci-gate.md
      - Notifications: integrations/notifications.md
      - Tracker tickets: integrations/ticketing.md
  - Administration:
      - Users and teams: administration/users-and-teams.md
      - Solutions and projects: administration/solutions-and-projects.md
      - Your account and MFA: administration/account.md
      - Four-eyes approval: administration/four-eyes.md
      - Single sign-on: administration/sso.md
      - API keys: administration/api-keys.md
      - SSH keys: administration/ssh-keys.md
      - Gate policies: administration/gate-policies.md
      - Agents: administration/agents.md
      - Semgrep rule sets: administration/rule-sets.md
      - Settings: administration/settings.md
      - Audit log: administration/audit-log.md
      - Rotation and purge: administration/maintenance.md
  - Reference:
      - Configuration: reference/configuration.md
      - FAQ: reference/faq.md
