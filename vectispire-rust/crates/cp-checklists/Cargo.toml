[package]
name = "vectispire-cp-checklists"
description = "The control plane's security checklists: templates and their versions, each project's checklist, the rules that measure its lines."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Each engine's checked statements are a feature, as in vectispire-cp-db and for the same reason: the offline cache
# (`.sqlx/`, beside this file) is generated one engine at a time against a server of that engine
# (crates/cp-db/scripts/sqlx-prepare.sh). Both are on in every build, which compiles from the cache with no database.
default = ["mysql-queries", "postgres-queries"]
mysql-queries = []
postgres-queries = []

[dependencies]
axum.workspace = true
http.workspace = true
http-body-util.workspace = true
percent-encoding.workspace = true
serde.workspace = true
# `raw_value`: a bound rule and a layout are written by `forms` and carried into a view as written — a ratio keeps
# the digits it was stated with. Already in the graph (cp-platform, protocol).
serde_json = { workspace = true, features = ["raw_value"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "macros", "time"] }
time = { version = "0.3", features = ["std"] }
# Without its default features: cp-db's own checked statements are not this crate's, and a cache pass for one engine
# must not compile the other engine's statements of cp-db against it. A workspace build turns them on anyway.
vectispire-cp-db = { path = "../cp-db", default-features = false }
# `java.util.zip`'s inflater and deflater, on zlib itself (`libz-sys`, already linked for libgit2): the renderer's
# package must deflate to the bytes Java's `ZipOutputStream` writes, and the reader's ratio guard counts the
# compressed bytes zlib consumed. `miniz_oxide`, flate2's default, compresses to other bytes and is left out.
flate2 = { version = "1.1", default-features = false, features = ["zlib"] }
# `Digests.sha256Hex`: the rule's and the evidence's digests, which a measurement and a sign-off name.
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
# `\p{Cf}`, `\p{Z}` and `\p{Cc}` of `ChecklistText`'s patterns, at Unicode 16 as JDK 25 reads them. The regex
# crate's Unicode classes would need a feature the agent's graph shares; this crate is the control plane's alone.
unicode-general-category = "1.1"
# `Normalizer.Form.NFKC`, which every item key and content digest is computed over.
unicode-normalization = "0.1"
vectispire-cp-access = { path = "../cp-access" }
# The signing key a sign-off's document is signed with (`crypto` is shared: no edge line).
vectispire-cp-crypto = { path = "../cp-crypto" }
# The routes: the server stack is the control plane's (deny.toml lists this crate among axum's wrappers).
vectispire-cp-http.workspace = true
# The measurements read their evidence from its owners' APIs (decision 0032 §6).
vectispire-cp-inventory = { path = "../cp-inventory" }
vectispire-cp-issues = { path = "../cp-issues" }
# The weekly reminder's task, and the queued automatic answer (`maintenance` and `outbox` are shared).
vectispire-cp-maintenance = { path = "../cp-maintenance" }
vectispire-cp-outbox = { path = "../cp-outbox" }
vectispire-cp-scanning = { path = "../cp-scanning" }
vectispire-cp-audit = { path = "../cp-audit" }
vectispire-cp-settings = { path = "../cp-settings" }
vectispire-cp-targets = { path = "../cp-targets" }
vectispire-domain.workspace = true

[dev-dependencies]
# A database of its own per test, on a throwaway server or the shared one CI names (cp-db's `testing`).
vectispire-cp-db = { path = "../cp-db", default-features = false, features = ["test-support"] }
# The contract test: the routes against `openapi.json` and the list of routes not ported.
vectispire-cp-contract = { path = "../cp-contract" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
base64.workspace = true
vectispire-testkit = { path = "../testkit" }

[lints]
workspace = true
