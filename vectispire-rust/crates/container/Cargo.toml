[package]
name = "vectispire-container"
description = "Scanner containers through the Docker API — or the socket proxy in front of it — with the confinement every scanner runs under."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The registry login's `auth`, as a Docker configuration writes it.
base64.workspace = true
bollard.workspace = true
# The save of an image for its platform, which bollard 0.19 cannot ask for: a request of its own to the daemon, over
# the client bollard already links (`runner::save`).
bytes.workspace = true
futures-util.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
percent-encoding.workspace = true
# The Docker configuration's credentials, read and written; the login's directory, created 0700.
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# Java's digits, white space and `String.lines`, for the holder's `df` and the archive's headers.
vectispire-domain.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
# A paused clock: the save's lack of a deadline is shown in virtual minutes, not real ones.
tokio = { workspace = true, features = ["test-util"] }
vectispire-testkit = { path = "../testkit" }

[lints]
workspace = true
