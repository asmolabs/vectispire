[package]
name = "vectispire-agent"
description = "The remote agent: claims scans from a Vectispire control plane and runs them next to the code — Rust port, in progress, not shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vectispire-agent"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
vectispire-container.workspace = true
vectispire-crypto.workspace = true
vectispire-domain.workspace = true
vectispire-git.workspace = true
vectispire-protocol = { workspace = true, features = ["client"] }
vectispire-scanners.workspace = true
vectispire-tls.workspace = true

[dev-dependencies]
reqwest.workspace = true
sha2.workspace = true
vectispire-testkit = { path = "../testkit" }

[lints]
workspace = true
