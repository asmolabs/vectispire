[package]
name = "vectispire-cp-rules"
description = "The control plane's rules module: uploaded Semgrep rule sets, catalogue import, rule coverage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["mysql-queries", "postgres-queries"]
mysql-queries = []
postgres-queries = []

[dependencies]
axum.workspace = true
http.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "macros", "time"] }
thiserror.workspace = true
time = { version = "0.3", features = ["std", "serde", "formatting", "parsing"] }
tokio = { workspace = true, features = ["time", "rt"] }
tracing.workspace = true
tempfile.workspace = true
vectispire-cp-access = { path = "../cp-access" }
vectispire-cp-audit = { path = "../cp-audit" }
vectispire-cp-db = { path = "../cp-db", default-features = false }
vectispire-cp-http.workspace = true
vectispire-cp-scanning = { path = "../cp-scanning" }
vectispire-domain.workspace = true
vectispire-git.workspace = true
vectispire-protocol.workspace = true
vectispire-tls.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tower.workspace = true
vectispire-cp-contract = { path = "../cp-contract" }
vectispire-migrate = { path = "../migrate" }
vectispire-testkit = { path = "../testkit" }

[lints]
workspace = true
