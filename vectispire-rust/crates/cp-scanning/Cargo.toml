[package]
name = "vectispire-cp-scanning"
description = "The control plane's scanning module: the queue and its claim, the dispatcher that hands scans to agents and the built-in worker and writes their results, the leader lease and the scheduler, retention, the scan routes, and what targets asks of scans."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Each engine's checked statements are a feature, as in cp-db: the offline cache (`.sqlx/`) is generated one engine at
# a time against a server of that engine (crates/cp-db/scripts/sqlx-prepare.sh cp-scanning). Both are on in every build.
default = ["mysql-queries", "postgres-queries"]
mysql-queries = []
postgres-queries = []

[dependencies]
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "with-time", "sqlx-mysql", "sqlx-postgres", "runtime-tokio"] }
axum.workspace = true
http.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "macros", "time"] }
thiserror.workspace = true
time = { version = "0.3", features = ["std"] }
tokio = { workspace = true, features = ["time", "rt"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
vectispire-cp-access = { path = "../cp-access" }
vectispire-cp-audit = { path = "../cp-audit" }
vectispire-cp-crypto = { path = "../cp-crypto" }
# Without its default features, as cp-targets: a cache pass for one engine must not compile cp-db's statements of the
# other against it. A workspace build turns them on anyway.
vectispire-cp-db = { path = "../cp-db", default-features = false }
vectispire-cp-http.workspace = true
vectispire-cp-maintenance = { path = "../cp-maintenance" }
vectispire-cp-settings = { path = "../cp-settings" }
vectispire-cp-targets = { path = "../cp-targets" }
vectispire-crypto.workspace = true
vectispire-domain.workspace = true
# The wire and the server half only: the agent's HTTP client (`client`) stays off in the control plane.
vectispire-protocol.workspace = true
vectispire-runner.workspace = true
vectispire-tls.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tower.workspace = true
vectispire-cp-contract = { path = "../cp-contract" }
vectispire-cp-outbound = { path = "../cp-outbound" }
vectispire-migrate = { path = "../migrate" }
vectispire-testkit = { path = "../testkit" }
vectispire-tls.workspace = true
x25519-dalek.workspace = true
base64.workspace = true

[lints]
workspace = true
