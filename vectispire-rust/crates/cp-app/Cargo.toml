[package]
name = "vectispire-cp-app"
description = "The control plane's binary — Rust port, in progress, not shipped. Wires the runtime and the outbound door; the HTTP stack and the database are not wired yet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vectispire-control-plane"
path = "src/main.rs"

[dependencies]
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
vectispire-cp-audit = { path = "../cp-audit" }
vectispire-cp-http = { path = "../cp-http" }
vectispire-cp-maintenance = { path = "../cp-maintenance" }
vectispire-cp-outbound = { path = "../cp-outbound" }
vectispire-cp-runtime = { path = "../cp-runtime" }

[dev-dependencies]
vectispire-cp-arch-tests = { path = "../cp-arch-tests" }
vectispire-cp-contract = { path = "../cp-contract" }
tempfile.workspace = true

[lints]
workspace = true
