[package]
name = "vectispire-cp-app"
description = "The control plane's binary — Rust port, in progress, not shipped. Wires the runtime and the outbound door; the HTTP stack and the database are not wired yet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vectispire-control-plane"
path = "src/main.rs"

[dependencies]
axum.workspace = true
http.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["std"] }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
vectispire-cp-access = { path = "../cp-access" }
vectispire-cp-agents = { path = "../cp-agents" }
vectispire-cp-audit = { path = "../cp-audit" }
vectispire-cp-crypto = { path = "../cp-crypto" }
vectispire-cp-db = { path = "../cp-db" }
vectispire-cp-http = { path = "../cp-http" }
vectispire-cp-inventory = { path = "../cp-inventory" }
vectispire-cp-maintenance = { path = "../cp-maintenance" }
vectispire-cp-outbox = { path = "../cp-outbox" }
vectispire-cp-outbound = { path = "../cp-outbound" }
vectispire-cp-runtime = { path = "../cp-runtime" }
vectispire-cp-rules = { path = "../cp-rules" }
vectispire-cp-scanning = { path = "../cp-scanning" }
vectispire-cp-settings = { path = "../cp-settings" }
vectispire-cp-targets = { path = "../cp-targets" }
vectispire-domain.workspace = true
vectispire-runner = { path = "../runner" }
vectispire-tls.workspace = true

[dev-dependencies]
# The composition test builds the targets module over a pool that never connects: it runs no task.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
vectispire-cp-arch-tests = { path = "../cp-arch-tests" }
vectispire-cp-contract = { path = "../cp-contract" }
tempfile.workspace = true

[lints]
workspace = true
