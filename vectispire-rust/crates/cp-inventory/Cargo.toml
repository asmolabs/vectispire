[package]
name = "vectispire-cp-inventory"
description = "The control plane's inventory module: components, build SBOM imports, API attack surface discovery, license governance, blast radius and SBOM diff."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["mysql-queries", "postgres-queries"]
mysql-queries = []
postgres-queries = []

[dependencies]
axum.workspace = true
http.workspace = true
percent-encoding.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "macros", "time"] }
thiserror.workspace = true
time = { version = "0.3", features = ["std", "serde", "formatting", "parsing"] }
tokio = { workspace = true, features = ["time", "rt"] }
tracing.workspace = true
vectispire-cp-access = { path = "../cp-access" }
vectispire-cp-audit = { path = "../cp-audit" }
vectispire-cp-db = { path = "../cp-db", default-features = false }
vectispire-cp-http.workspace = true
vectispire-cp-scanning = { path = "../cp-scanning" }
vectispire-cp-targets = { path = "../cp-targets" }
vectispire-domain.workspace = true
vectispire-protocol.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tower.workspace = true
vectispire-cp-contract = { path = "../cp-contract" }
vectispire-cp-crypto = { path = "../cp-crypto" }
vectispire-cp-outbound = { path = "../cp-outbound" }
vectispire-migrate = { path = "../migrate" }
vectispire-testkit = { path = "../testkit" }
vectispire-tls = { path = "../tls" }

[lints]
workspace = true
