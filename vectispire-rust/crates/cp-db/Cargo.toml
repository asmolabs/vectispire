[package]
name = "vectispire-cp-db"
description = "The control plane's database layer: pools per engine, transactions, Visibility-gated queries, schema parity."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Each engine's checked queries are a feature of their own, so that the cache for one engine can be
# generated while only that engine's database is up (scripts/sqlx-prepare.sh, beside this file). Both are on in a build:
# the offline cache holds both, and `SQLX_OFFLINE=true` compiles them with no database at all.
default = ["mysql-queries", "postgres-queries"]
mysql-queries = []
postgres-queries = []

[dependencies]
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "postgres", "macros", "time"] }
sea-query = { version = "1", default-features = false, features = ["backend-mysql", "backend-postgres"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "with-time", "sqlx-mysql", "sqlx-postgres", "runtime-tokio"] }
sea-query-sqlx = { version = "0.9", default-features = false, features = ["sqlx-mysql", "sqlx-postgres", "runtime-tokio", "with-time"] }
thiserror.workspace = true
time = { version = "0.3", features = ["std"] }
tokio.workspace = true
vectispire-domain.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
trybuild = "1"
vectispire-testkit = { path = "../testkit" }

[lints]
workspace = true
