[package]
name = "vectispire-cp-crypto"
description = "The control plane's crypto module: encryption at rest (AES-256-GCM, the key's derivation, Vault Transit through the outbound door) and the document signing key — core.crypto, ported."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes-gcm.workspace = true
base64.workspace = true
# P-256 with the PKCS#8 and PEM encodings Java's CosignSigner reads and writes. Already in the graph through
# ssh-key; these features add no crate the lock does not hold.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "pem", "std"] }
rand_core.workspace = true
# The passphrase branch of EncryptionKey.derive: BouncyCastle's SCrypt.generate, N = 2^15, r = 8, p = 1.
scrypt = { version = "0.11", default-features = false }
# SEC1's own structure, to read the curve a `EC PRIVATE KEY` names. Already in the graph through p256.
sec1 = { version = "0.7", default-features = false, features = ["der"] }
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
# Normalizer.normalize(NFKC) before scrypt. Already in the graph (idna).
unicode-normalization = "0.1"
vectispire-cp-outbound = { path = "../cp-outbound" }
vectispire-cp-settings = { path = "../cp-settings" }
vectispire-domain.workspace = true
zeroize = "1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
vectispire-cp-db = { path = "../cp-db", features = ["test-support"] }
vectispire-cp-runtime = { path = "../cp-runtime" }
vectispire-crypto.workspace = true
vectispire-migrate = { path = "../migrate" }
vectispire-testkit = { path = "../testkit" }
vectispire-tls.workspace = true
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "pkcs8", "pem", "std"] }

[lints]
workspace = true
