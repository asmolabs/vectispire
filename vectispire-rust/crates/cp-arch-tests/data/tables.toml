# Which module owns which table — read from the 77 JPA entities of the 0.11.1 line (b8bd7e8d0), `@Entity` + `@Table(name)`
# in `core/<module>/persistence/`. The Rust control plane keeps the schema exactly (plan §2), so this list is
# the schema's ownership map and `sql.rs` reads it to find a query naming another module's table.
# Adding a table is a line here, in the module that owns it; a migration alone does not move ownership.

[tables.access]
t_api_key = "ApiKeyEntity"
t_login_attempt = "LoginAttemptEntity"
t_mfa_challenge = "MfaChallengeEntity"
t_rate_window = "RateWindowEntity"
