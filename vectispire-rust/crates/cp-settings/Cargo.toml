[package]
name = "vectispire-cp-settings"
description = "The control plane's settings module: the catalog, its validation, and the store of t_setting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regex.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres"] }
thiserror.workspace = true
vectispire-cp-db = { path = "../cp-db" }
vectispire-domain.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
vectispire-migrate = { path = "../migrate" }
vectispire-testkit = { path = "../testkit" }

[lints]
workspace = true
