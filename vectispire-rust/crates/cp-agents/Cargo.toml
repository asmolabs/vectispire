[package]
name = "vectispire-cp-agents"
description = "The control plane's agents module: remote agent protocol, administration, sealing key pinning, result attestation and long polling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["mysql-queries", "postgres-queries"]
mysql-queries = []
postgres-queries = []

[dependencies]
axum.workspace = true
bytes.workspace = true
http.workspace = true
http-body.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "macros", "time", "uuid"] }
thiserror.workspace = true
time = { version = "0.3", features = ["std"] }
tokio = { workspace = true, features = ["time", "rt", "sync"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
vectispire-cp-access = { path = "../cp-access" }
vectispire-cp-audit = { path = "../cp-audit" }
vectispire-cp-crypto = { path = "../cp-crypto" }
vectispire-cp-db = { path = "../cp-db", default-features = false }
vectispire-cp-http.workspace = true
vectispire-cp-maintenance = { path = "../cp-maintenance" }
vectispire-cp-outbox = { path = "../cp-outbox" }
vectispire-cp-scanning = { path = "../cp-scanning" }
vectispire-cp-settings = { path = "../cp-settings" }
vectispire-cp-targets = { path = "../cp-targets" }
vectispire-crypto.workspace = true
vectispire-domain.workspace = true
vectispire-protocol.workspace = true

[dev-dependencies]
# A database of its own per test, on a throwaway server or the shared one CI names (cp-db's `testing`).
vectispire-cp-db = { path = "../cp-db", default-features = false, features = ["test-support"] }
vectispire-cp-issues = { path = "../cp-issues" }
vectispire-cp-gate = { path = "../cp-gate" }
vectispire-cp-rules = { path = "../cp-rules" }
vectispire-cp-inventory = { path = "../cp-inventory" }
# The replay composes the SIEM export as the binary does: its listener queues the events the recordings hold.
vectispire-cp-siem = { path = "../cp-siem" }
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tower.workspace = true
vectispire-cp-contract = { path = "../cp-contract" }
vectispire-cp-outbound = { path = "../cp-outbound" }
vectispire-migrate = { path = "../migrate" }
vectispire-testkit = { path = "../testkit" }
vectispire-tls.workspace = true

[lints]
workspace = true
