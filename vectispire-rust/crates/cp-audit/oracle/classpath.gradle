// Adds `printAuditOracleClasspath` to vectispire-core for oracle.sh, without touching the build itself. It
// depends on the runtime classpath itself, not only on core's classes: AuditChain and AuditOperation live in
// vectispire-common, whose jar is on that classpath and has to exist before the oracle reads it.
allprojects {
    afterEvaluate { project ->
        if (project.name == 'vectispire-core') {
            project.tasks.register('printAuditOracleClasspath') {
                def classpath = project.sourceSets.main.runtimeClasspath
                dependsOn classpath
                doLast { println 'CLASSPATH=' + classpath.asPath }
            }
        }
    }
}
