[package]
name = "vectispire-cp-audit"
description = "The control plane's audit module: the hash-chained log, its mirror and listeners, its integrity report."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Each engine's checked queries are a feature of their own, as in cp-db: the offline cache of one engine is
# generated while only that engine's database is up (crates/cp-db/scripts/sqlx-prepare.sh, with this crate's name).
# Both are on in every other build.
default = ["mysql-queries", "postgres-queries"]
mysql-queries = []
postgres-queries = []
# The suite against the real Java code (tests/oracle.rs): it needs a JDK 25 and Gradle's cache for
# vectispire-core besides Docker, so it is a feature of its own, run by oracle/check-oracle.sh.
oracle = []

[dependencies]
futures-util.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "macros", "time"] }
thiserror.workspace = true
time = { version = "0.3", features = ["std"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }
vectispire-cp-db = { path = "../cp-db" }
vectispire-domain.workspace = true

[dev-dependencies]
# A database of its own per test, on a throwaway server or the shared one CI names (cp-db's `testing`).
vectispire-cp-db = { path = "../cp-db", default-features = false, features = ["test-support"] }
regex.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["std", "parsing", "formatting"] }
tokio = { workspace = true, features = ["test-util"] }
vectispire-migrate = { path = "../migrate" }
vectispire-testkit = { path = "../testkit" }

[lints]
workspace = true
