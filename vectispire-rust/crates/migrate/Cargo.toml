[package]
name = "vectispire-migrate"
description = "The control plane's migrations, run the way Flyway 12.4 runs them: the same files, the same flyway_schema_history, the same checksums and locks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crc32fast = "1"
regex.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["mysql", "postgres", "runtime-tokio"] }
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
vectispire-testkit = { path = "../testkit" }

[features]
# The suite run against the real Flyway (`tests/oracle.rs`): needs a JDK 25 and Gradle besides Docker.
oracle = []

[[test]]
name = "oracle"
required-features = ["oracle"]

[lints]
workspace = true
