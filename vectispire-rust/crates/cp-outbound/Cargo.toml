[package]
name = "vectispire-cp-outbound"
description = "The control plane's outbound door: the URL guard, the reserved endpoints and the sender that connects to the address that was checked — PinnedHttpSender, ported."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
reqwest.workspace = true
thiserror.workspace = true
tokio.workspace = true
vectispire-domain.workspace = true
vectispire-tls.workspace = true

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tempfile.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
serde_json.workspace = true
vectispire-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["io-util", "net", "time", "macros", "rt-multi-thread"] }

[lints]
workspace = true
