[package]
name = "vectispire-cp-access"
description = "The control plane's access module: who a request is — sessions, API keys, agent keys, the SCIM token (Phase 1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Each engine's checked queries are a feature, as in cp-db: the offline cache for one engine is generated while only
# that engine's database is up (crates/cp-db/scripts/sqlx-prepare.sh). Both are on in every build that ships.
default = ["mysql-queries", "postgres-queries"]
mysql-queries = []
postgres-queries = []

[dependencies]
# Argon2id over the PHC string `PasswordHasher` writes: an API key's stored hash is one, and Phase 1's passwords are
# the same format. Only `alloc` — the derivation itself; the PHC string is read and written here, as Java does it, so
# the `password-hash` crate's own (stricter) parser never decides whether a stored hash verifies.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64.workspace = true
rand_core.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["mysql", "postgres", "runtime-tokio", "macros", "time"] }
subtle.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["std"] }
tracing.workspace = true
uuid.workspace = true
# Without cp-db's own checked queries, which this crate does not call: a cache pass for one engine compiles this
# crate with only that engine's `DATABASE_URL`, and cp-db's statements for the other engine would fail to describe.
vectispire-cp-db = { path = "../cp-db", default-features = false }
vectispire-cp-http.workspace = true
vectispire-domain.workspace = true

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
vectispire-migrate = { path = "../migrate" }
vectispire-testkit = { path = "../testkit" }

[lints]
workspace = true
