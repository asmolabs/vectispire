[package]
name = "vectispire-cp-access"
description = "The control plane's access module: accounts and their passwords, the sign-in (throttle, second factor, challenges, the shared rate windows), who a request is — sessions, API keys, agent keys, the SCIM token — roles and their flags, what a caller may see (VisibilityService), the row guards that refuse with a 404, four-eyes, and who could approve."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Each engine's checked statements are a feature, as in vectispire-cp-db and for the same reason: the offline cache
# (`.sqlx/`, beside this file) is generated one engine at a time against a server of that engine
# (crates/cp-db/scripts/sqlx-prepare.sh). Both are on in every build, which compiles from the cache with no database.
default = ["mysql-queries", "postgres-queries"]
mysql-queries = []
postgres-queries = []

[dependencies]
# Argon2id over the PHC string `PasswordHasher` writes: an API key's stored hash is one, and Phase 1's passwords are
# the same format. Only `alloc` — the derivation itself; the PHC string is read and written here, as Java does it, so
# the `password-hash` crate's own (stricter) parser never decides whether a stored hash verifies.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
base64.workspace = true
# HMAC-SHA1 over the time step, RFC 6238 as `Totp` computes it: the workspace's, already linked by the agent (git).
hmac.workspace = true
http.workspace = true
rand_core.workspace = true
sha1.workspace = true
sha2.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "macros", "time"] }
subtle.workspace = true
thiserror.workspace = true
time = { version = "0.3", features = ["std"] }
tracing.workspace = true
# `Normalizer.normalize(NFKD)` and `\p{M}` in the sign-in throttle's user key. Already in the graph (idna, cp-crypto).
unicode-normalization = "0.1"
uuid = { workspace = true, features = ["v4"] }
# Without its default features: cp-db's own checked statements are not this crate's, and a cache pass for one engine
# must not compile the other engine's statements of cp-db against it. A workspace build turns them on anyway.
vectispire-cp-db = { path = "../cp-db", default-features = false }
# The second factor's secret and backup codes are encrypted at rest under `TotpService`'s contexts (`crypto` is a
# shared module: no edge line). The SESSION_CLEANUP task is a `MaintenanceTask` (`maintenance`, shared too).
vectispire-cp-crypto = { path = "../cp-crypto" }
vectispire-cp-http.workspace = true
vectispire-cp-maintenance = { path = "../cp-maintenance" }
vectispire-domain.workspace = true
# The password a hash is derived from, wiped when dropped.
zeroize = "1"

[dev-dependencies]
# A database of its own per test, on a throwaway server or the shared one CI names (cp-db's `testing`).
vectispire-cp-db = { path = "../cp-db", default-features = false, features = ["test-support"] }
# The engine test reads the backlog through a real `VisibleSelect`, ordered with cp-db's query vocabulary.
sea-query = { version = "1", default-features = false, features = ["backend-mysql", "backend-postgres"] }
# The route test drives a `.scoped()` route through the real chain: the request and the peer address are axum's.
axum.workspace = true
http-body-util.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tower.workspace = true
vectispire-cp-arch-tests = { path = "../cp-arch-tests" }
# The second factor's engine test seals with the real `Encryption`, whose Vault door names these.
vectispire-cp-outbound = { path = "../cp-outbound" }
vectispire-migrate = { path = "../migrate" }
vectispire-testkit = { path = "../testkit" }
vectispire-tls.workspace = true

[lints]
workspace = true
