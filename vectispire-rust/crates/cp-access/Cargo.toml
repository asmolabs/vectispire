[package]
name = "vectispire-cp-access"
description = "The control plane's access module: roles and their flags, what a caller may see (VisibilityService), the row guards that refuse with a 404, four-eyes, and who could approve."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
http.workspace = true
sea-query = { version = "1", default-features = false, features = ["backend-mysql", "backend-postgres"] }
sea-query-sqlx = { version = "0.9", default-features = false, features = ["sqlx-mysql", "sqlx-postgres", "runtime-tokio"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres"] }
thiserror.workspace = true
tracing.workspace = true
vectispire-cp-db = { path = "../cp-db" }
vectispire-cp-http.workspace = true

[dev-dependencies]
# The route test drives a `.scoped()` route through the real chain: the request and the peer address are axum's.
axum.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower.workspace = true
vectispire-cp-arch-tests = { path = "../cp-arch-tests" }
vectispire-domain.workspace = true
vectispire-migrate = { path = "../migrate" }
vectispire-testkit = { path = "../testkit" }

[lints]
workspace = true
