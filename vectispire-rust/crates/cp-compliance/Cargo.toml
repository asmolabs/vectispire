[package]
name = "vectispire-cp-compliance"
description = "The control plane's compliance: the framework matrix, the statement of applicability, the certified scope, the monthly history, the OWASP Top 10 grid and its weekly record, and the OWASP report."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
http.workspace = true
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "with-time", "sqlx-mysql", "sqlx-postgres", "runtime-tokio"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "macros", "time"] }
thiserror.workspace = true
time = { version = "0.3", features = ["std", "serde", "formatting", "parsing"] }
tracing.workspace = true
vectispire-cp-access = { path = "../cp-access" }
vectispire-cp-audit = { path = "../cp-audit" }
vectispire-cp-db = { path = "../cp-db", default-features = false }
vectispire-cp-gate = { path = "../cp-gate" }
vectispire-cp-http.workspace = true
vectispire-cp-issues = { path = "../cp-issues" }
vectispire-cp-maintenance = { path = "../cp-maintenance" }
vectispire-cp-posture = { path = "../cp-posture" }
vectispire-cp-rules = { path = "../cp-rules" }
vectispire-cp-scanning = { path = "../cp-scanning" }
vectispire-cp-settings = { path = "../cp-settings" }
vectispire-cp-targets = { path = "../cp-targets" }
vectispire-domain.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
# A database of its own per test, on a throwaway server or the shared one CI names (cp-db's `testing`).
vectispire-cp-db = { path = "../cp-db", default-features = false, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
# The reference set's doubles read exactly: without it a decimal can parse an ulp away from the double Java wrote.
serde_json = { workspace = true, features = ["float_roundtrip"] }
vectispire-testkit = { path = "../testkit" }
vectispire-cp-contract = { path = "../cp-contract" }
vectispire-cp-crypto = { path = "../cp-crypto" }
vectispire-cp-inventory = { path = "../cp-inventory" }
vectispire-cp-outbound = { path = "../cp-outbound" }
vectispire-cp-outbox = { path = "../cp-outbox" }
vectispire-tls = { path = "../tls" }

[lints]
workspace = true
