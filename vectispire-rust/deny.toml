# What the agent may link — `cargo deny check`, run by check.sh.
#
# The Rust side of `gradle/verification-metadata.xml` and the npm audit: every crate comes from
# crates.io under a licence listed here, none carries a known advisory, and the crates that would
# break decision 0003 are banned outright.

[graph]
all-features = false
# **The platforms the agent is built for, and those it is tested on** — not every platform a crate
# supports. Without the list every Windows and WebAssembly crate of the graph is checked and allowed
# too, and an allowance nobody needs is one nobody reviews (the build-script list below, the licences).
targets = [
    "x86_64-unknown-linux-musl",  # the image (Dockerfile.agent)
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",   # CI's runner, which builds and runs the test suites
    "aarch64-apple-darwin",       # a developer's machine
]

[advisories]
# Every advisory fails the check, including unmaintained crates and yanked versions: an exception is
# written here, with its reason, by whoever accepts it.
yanked = "deny"
unmaintained = "all"
ignore = [
    # crypto-bigint 0.5's non-constant-time operations (subtraction, division, Montgomery multiplication). It is
    # reached only through elliptic-curve 0.13 behind ssh-key 0.6, which the agent uses to *parse* an OpenSSH
    # deploy key and see whether it is encrypted (crates/git/src/deploy_key.rs): ssh-key's ECDSA decode copies the
    # key's bytes and runs no curve arithmetic, and libssh2 signs. The fix is crypto-bigint 0.7.6, behind
    # elliptic-curve 0.14 and ssh-key 0.7, still a release candidate — remove this line when it is released.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 runs on no secret here: ssh-key only parses the deploy key; ssh-key 0.7 is a release candidate" },
]

[licenses]
# Exactly the licences the graph carries on the platforms above: one nobody uses is removed rather than
# kept "in case", so that the next crate under it is a decision in a diff, not an allowance waiting.
confidence-threshold = 0.9
unused-allowed-license = "deny"
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0", # webpki-roots: Mozilla's CA list, compiled in
    "ISC",
    "MIT",
    "MIT-0", # borrow-or-share, which jsonschema's URI reader (fluent-uri) uses: no attribution required
    "Unicode-3.0",
    "Zlib", # foldhash, the default hasher of the hash maps sqlx and indexmap use
]

[bans]
# Two versions of one crate are two to audit (supply-chain/) and two to patch on the next advisory: a new
# duplicate fails, and the two the graph carries today are listed with why they cannot be merged yet.
multiple-versions = "deny"
skip = [
    { crate = "base64@0.22", reason = "bollard 0.19 still asks for 0.22; hyper-util has moved to 0.23" },
    { crate = "syn@2", reason = "curve25519-dalek-derive and the serde/tokio/tracing derives are on syn 2; displaydoc and the ICU crates on 3" },
    # RustCrypto's two generations. The agent's cryptography and the SSH stack (ed25519-dalek 2, the elliptic
    # curves 0.13, aes-gcm 0.10, ssh-key 0.6) are on the 0.10 traits; sqlx 0.9's MySQL and PostgreSQL
    # authentication (the control plane's database crates only) is on the 0.11 traits. They cannot be merged
    # until the curve and AEAD crates are released on the new ones; the older half is listed, so that a third
    # generation, or a duplicate of any other crate, still fails.
    { crate = "digest@0.10", reason = "RustCrypto 0.10 traits: ed25519-dalek 2, elliptic-curve 0.13, aes-gcm 0.10" },
    { crate = "block-buffer@0.10", reason = "digest 0.10's" },
    { crate = "crypto-common@0.1", reason = "digest 0.10's" },
    { crate = "cpufeatures@0.2", reason = "the 0.10 generation's (aes, sha2, poly1305, curve25519-dalek)" },
    { crate = "sha2@0.10", reason = "ed25519-dalek 2, the elliptic curves and ssh-key 0.6" },
    { crate = "sha1@0.10", reason = "the SSH stack's, beside sqlx 0.9's sha1 0.11" },
    { crate = "hmac@0.12", reason = "hkdf 0.12 (vectispire-crypto), rfc6979 0.4 and vectispire-git" },
    { crate = "hkdf@0.12", reason = "vectispire-crypto's key derivation, on the 0.10 traits" },
    { crate = "rand_core@0.6", reason = "the 0.10 generation's RNG traits; sqlx 0.9 and tempfile use rand_core 0.10" },
    { crate = "getrandom@0.2", reason = "rand_core 0.6's" },
    { crate = "getrandom@0.3", reason = "ahash 0.8, behind jsonschema (the contract checks); the rest are on 0.4" },
    { crate = "heck@0.4", reason = "sea-bae, behind sea-orm-macros 2.0 (build time only); the other derives are on 0.5" },
    { crate = "hashbrown@0.16", reason = "hashlink 0.11, behind sqlx-core 0.9; indexmap and jsonschema's referencing are on 0.17" },
]
wildcards = "deny"
# The workspace's own crates, by path: nothing here is published, so a path is the version.
allow-wildcard-paths = true
deny = [
    # Decision 0003: the agent holds no database connection, so no crate here may be a client of one.
    # `wrappers`: the control plane's database layer, its migration runner and the modules' persistence (each
    # module crate's private `persistence`, which cp-arch-tests' layering keeps the only place that names it) may
    # use it, and nothing else may
    # — the agent depending on sqlx directly fails here, and `crates/agent/tests/isolation.rs` proves the
    # agent's closure holds none of it. (sea-query-sqlx is the layer's query-builder binding, a dependent of sqlx;
    # vectispire-cp-contract replays the recorded traffic, seeding and reading every table — no module uses it.
    # sea-orm builds the repositories' statements; its own sqlx connections are never opened, cp-db runs them.)
    { crate = "sqlx", wrappers = ["vectispire-migrate", "vectispire-cp-db", "sea-query-sqlx", "sea-orm", "vectispire-cp-access", "vectispire-cp-audit", "vectispire-cp-settings", "vectispire-cp-maintenance", "vectispire-cp-outbox", "vectispire-cp-targets", "vectispire-cp-scanning", "vectispire-cp-agents", "vectispire-cp-rules", "vectispire-cp-inventory", "vectispire-cp-issues", "vectispire-cp-gate", "vectispire-cp-contract"], reason = "decision 0003: the agent holds no database connection" },
    { crate = "diesel", reason = "decision 0003: the agent holds no database connection" },
    { crate = "postgres", reason = "decision 0003: the agent holds no database connection" },
    { crate = "tokio-postgres", reason = "decision 0003: the agent holds no database connection" },
    { crate = "mysql", reason = "decision 0003: the agent holds no database connection" },
    { crate = "mysql_async", reason = "decision 0003: the agent holds no database connection" },
    { crate = "rusqlite", reason = "decision 0003: the agent holds no database connection" },
    # SeaORM describes the repositories' tables (the hybrid adopted after the cp-issues spike, 2026-10-26): cp-db
    # runs its statements, and a module crate is listed here when its repository is ported to it — never the agent.
    { crate = "sea-orm", wrappers = ["vectispire-cp-db", "vectispire-cp-issues", "vectispire-cp-gate", "vectispire-cp-scanning", "vectispire-cp-inventory"], reason = "decision 0003: the agent holds no database connection" },
    # The agent opens no port: the server stack is linkable by the control plane's crates only. A wrapper is a
    # crate allowed to depend on it directly; any other dependent — the agent above all — fails the check, and
    # crates/agent/tests/isolation.rs forbids it in the agent's graph whatever this says.
    { crate = "axum", wrappers = ["vectispire-cp-app", "vectispire-cp-http", "vectispire-cp-contract", "vectispire-cp-access", "vectispire-cp-targets", "vectispire-cp-scanning", "vectispire-cp-agents", "vectispire-cp-rules", "vectispire-cp-inventory", "vectispire-cp-issues", "vectispire-cp-gate"], reason = "the agent opens no port; the control plane's crates may" },
    { crate = "actix-web", reason = "the agent opens no port" },
    { crate = "warp", reason = "the agent opens no port" },
    { crate = "rocket", reason = "the agent opens no port" },
    # Git is libgit2 in-process: a crate that runs the `git` or `ssh` binaries would bring back what
    # the image was built without, so that a configuration file could not bypass a host-key check.
    { crate = "gix-transport", reason = "its SSH transport runs the system ssh binary" },
]

# **A build script runs on the build machine with the builder's rights**, before any test: it is the
# one place a crate executes code on CI and on the release runner without being called. Only the crates
# listed may have one — a new dependency with a build script fails until someone reads it and adds it
# here, with what it builds. Executables shipped inside a crate's source are refused outright.
[bans.build]
executables = "deny"
include-dependencies = true
allow-build-scripts = [
    { crate = "ahash" },             # cfgs from a rustc feature probe and the target architecture
    { crate = "crc32fast" },         # cfgs from `rustc --version`: which CRC intrinsics are stable
    { crate = "crossbeam-utils" },   # cfgs from the target: whether it has the atomics it needs
    { crate = "curve25519-dalek" },  # selects its arithmetic backend from the target
    { crate = "generic-array" },     # emits cfgs for the compiler version
    { crate = "getrandom" },
    { crate = "httparse" },          # detects SIMD support
    { crate = "icu_normalizer_data" },  # the ICU data the URL parser normalises with
    { crate = "icu_properties_data" },
    { crate = "jsonschema-value" },  # empty unless its `pyo3` feature is on, which it is not
    { crate = "libc" },
    { crate = "libgit2-sys" },       # compiles the vendored libgit2 (C)
    { crate = "libssh2-sys" },       # compiles the vendored libssh2 (C)
    { crate = "libz-sys" },          # compiles the vendored zlib (C)
    { crate = "openssl-sys" },       # compiles the vendored OpenSSL (C) that libssh2 links
    { crate = "mime_guess" },        # writes its MIME-type table into OUT_DIR from the list it ships
    { crate = "num-traits" },        # an autocfg probe: compiles one expression to see what rustc has
    { crate = "parking_lot_core" },  # a cfg when the thread sanitizer is on
    { crate = "proc-macro2" },
    { crate = "quote" },
    { crate = "ref-cast" },          # writes a private module into OUT_DIR; runs `rustc --version`
    { crate = "ring" },              # assembles its cryptographic primitives (C and assembly)
    { crate = "rustix" },
    { crate = "rustls" },
    { crate = "serde" },
    { crate = "serde_core" },
    { crate = "serde_json" },
    { crate = "target-tuple" },      # writes the build's target and host triples into a macro in OUT_DIR
    { crate = "thiserror" },
    { crate = "unicode-general-category" },  # writes its category table into OUT_DIR from the tables it ships
    { crate = "zerocopy" },          # cfgs from `rustc --version` and the crate's own manifest
    { crate = "zmij" },              # serde_json's float formatting; emits cfgs
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
