# La configuration de détection de secrets, **fournie par Zanshin et non par la cible**.
#
# Sans `--config`, gitleaks retombe sur `<source>/.gitleaks.toml` — un fichier du dépôt
# scanné, donc écrit par qui on audite — et l'utilise *à la place* de son jeu intégré.
# Un fichier vide avec une exclusion universelle éteignait la détection sans erreur : le
# scan rendait « analysé, rien trouvé », ce qui résolvait en silence tout l'historique des
# secrets de cette cible, triage compris. Le dépôt fermait ses propres constats.
#
# Ce fichier est copié dans l'espace de travail à côté des règles Semgrep, hors de l'arbre
# analysé, et passé explicitement en ligne de commande.

title = "Zanshin"

# Le jeu de règles intégré de gitleaks, et rien de plus : il est maintenu en amont, couvre
# les fournisseurs courants, et le remplacer par une liste maison serait s'engager à la
# tenir à jour — ce que personne ne fait.
[extend]
useDefault = true

# **Aucune section `[allowlist]`, et c'est délibéré.** Un secret dans un fichier de test
# est un secret : il est dans l'historique git, il a été poussé, et « ce n'est qu'un
# exemple » est une affirmation qui se vérifie au triage, pas un défaut d'analyse.
#
# Une liste d'exclusion ici serait aussi le premier endroit qu'un attaquant chercherait à
# élargir. Le jeu intégré porte déjà les siennes, écrites par l'amont ; Zanshin n'en ajoute
# aucune. (gitleaks refuse d'ailleurs une allowlist vide — la seule façon de n'exclure rien
# est de ne pas déclarer la section du tout.)
