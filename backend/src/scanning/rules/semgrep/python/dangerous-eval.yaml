# Les règles de Zanshin, écrites ici et sans licence tierce.
#
# **Pourquoi si peu.** Le dépôt `semgrep-rules` a été relicencié sous une licence qui en
# interdit la distribution, et le fork `opengrep-rules` porte une Commons Clause qui
# ferait sortir Zanshin de l'open source au sens OSI. Zanshin embarque donc ses propres
# règles — peu nombreuses et à fort signal — et va chercher les autres chez leur auteur,
# à l'installation, dans un répertoire que l'opérateur fournit.
rules:
  - id: zanshin.python.eval-sur-entree
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      confidence: HIGH
    message: >-
      `eval` exécute la chaîne qu'on lui donne. Si elle vient d'une requête, d'un fichier
      ou d'une variable d'environnement, l'appelant choisit le code qui tourne. Utilisez
      `ast.literal_eval` pour une donnée, ou une table de correspondance pour un choix.
    patterns:
      - pattern: eval(...)
      - pattern-not: eval("...")
