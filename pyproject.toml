[project]
name = "backend-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.0",
    "bcrypt>=4.2.0",
    "cryptography>=49.0.0",
    "docker>=7.1.0",
    "fastapi>=0.141.1",
    "gitpython>=3.1.50",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "pydantic>=2.13.4",
    "python-jose>=3.5.0",
    "reflex>=0.9.6.post1",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["zanshin"]
omit = [
    # The *view* functions of the UI layer: `depots_page()`, `issue_row()` and
    # friends build component trees, and what can go wrong in them — a mistyped
    # attribute on a row model, a prop given the wrong type — is caught by
    # `reflex compile --dry`, not by executing them under pytest. Their loaders
    # and event handlers ARE tested, through the harness in tests/conftest.py
    # (see tests/test_ui_pages.py), which is why these files are no longer
    # omitted wholesale.
    "zanshin/zanshin.py",
]
