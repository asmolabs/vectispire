[project]
name = "backend-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.0",
    "bcrypt>=4.2.0",
    "croniter>=6.0",
    "cryptography>=49.0.0",
    "docker>=7.1.0",
    "fastapi>=0.141.1",
    "gitpython>=3.1.50",
    "httpx>=0.28.1",
    "passlib>=1.7.4",
    "pydantic>=2.13.4",
    "python-jose>=3.5.0",
    "reflex>=0.9.6.post1",
    "sqlalchemy>=2.0.51",
]

# Optional, because the default deployment is a single SQLite file and making the
# PostgreSQL driver a hard dependency would build a C extension every deployment
# that will never open a socket. Install with `uv sync --extra postgres`.
[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Real database servers for the cross-backend tests: the portability defects
    # found so far (a DDL type PostgreSQL rejects, a reserved word in raw SQL) were
    # all invisible to SQLite and to reading the code.
    "testcontainers[postgres]>=4.8",
    "psycopg[binary]>=3.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The cross-backend tests start real database servers, so they are opt-in: an image
# pull has no place in the loop a developer runs on every edit. Run them with
# `pytest -m backends` (and in CI, as their own job).
addopts = "-m 'not backends'"
markers = [
    "backends: runs against real servers (PostgreSQL, Redis) via testcontainers (needs Docker)",
]

[tool.coverage.run]
source = ["zanshin"]
omit = [
    # The *view* functions of the UI layer: `depots_page()`, `issue_row()` and
    # friends build component trees, and what can go wrong in them — a mistyped
    # attribute on a row model, a prop given the wrong type — is caught by
    # `reflex compile --dry`, not by executing them under pytest. Their loaders
    # and event handlers ARE tested, through the harness in tests/conftest.py
    # (see tests/test_ui_pages.py), which is why these files are no longer
    # omitted wholesale.
    "zanshin/zanshin.py",
]

# Pyright, deliberately narrowed to the rules that find defects *in this codebase*.
#
# Run as-is over `zanshin/`, pyright reports ~674 errors, and essentially all of them
# are one of two shapes:
#
#   * the models declare columns the SQLAlchemy 1.x way (`id = Column(Integer)`)
#     rather than `Mapped[int]`, so every attribute is typed `Column[Any]`. Passing
#     `scan.id` to anything typed `int`, or writing `if repo.name:`, is then an error
#     — 460 of them, none real;
#   * Reflex event handlers and `Var` arithmetic, where the class attribute is a
#     descriptor rather than the method, so `State.handler(x)` reads as a bad call.
#
# A gate that fails on all of that would be turned off within a week. The rules kept
# below are the ones whose findings were checked one by one and were all true: chiefly
# `reportUndefinedVariable`, which caught `func.count` used without importing `func`
# in `ScanRepository.count_by_queue_state` — a `NameError` on every call, and the
# reason the Paramètres screen silently loaded defaults for everything after it.
#
# Widening this list is a good thing to do *after* the models move to `Mapped[...]`,
# which is what would make the type-of-a-column errors mean something.
[tool.pyright]
include = ["zanshin", "scripts", "migrations"]
exclude = ["**/__pycache__", ".venv", ".web"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# The project's own environment, not whatever `python` happens to be on PATH: without
# this, pyright resolves no third-party import and reports 145 phantom errors.
venvPath = "."
venv = ".venv"

reportArgumentType = "none"
reportAttributeAccessIssue = "none"
reportGeneralTypeIssues = "none"
reportReturnType = "none"
reportCallIssue = "none"
reportAssignmentType = "none"
reportOptionalMemberAccess = "none"
reportIndexIssue = "none"
reportFunctionMemberAccess = "none"

reportUndefinedVariable = "error"
reportPossiblyUnboundVariable = "error"
reportSelfClsParameterName = "error"
reportUnsupportedDunderAll = "warning"
