# Versions in one place, so that "which Spring Boot is this?" has exactly one answer.
[versions]
springBoot = "4.1.0"
archunit = "1.4.1"
junit = "6.0.1"
assertj = "3.27.6"
postgresql = "42.7.12"
mariadb = "3.5.7"
mysql = "9.5.0"
sqlite = "3.51.0.0"
bouncycastle = "1.85"
dockerJava = "3.7.1"
# **Raised above what the Spring Boot BOM and docker-java ask for, for named advisories.**
# The BOM manages 5.6.1/5.4.2, and Vectispire's own SBOM scan reports fixable High findings
# against both — GHSA-v3jc-474w-2wm6 and GHSA-hf6x-8p5f-cgmf on httpcore5, GHSA-hjcp-jmpx-g3qm
# on httpclient5. Gradle resolves to the highest of the declared version and the platform
# constraint, so naming them here is what raises them. Drop these two lines when the BOM
# catches up: an override kept past its usefulness is how a dependency silently stops
# following upstream.
apacheHttpClient5 = "5.6.3"
apacheHttpCore5 = "5.4.3"
jgit = "7.7.1.202607240634-r"
pdfbox = "3.0.6"
bucket4j = "8.10.1"
springdoc = "2.8.5"
# Jib builds the container images from the build itself — no Dockerfile, no daemon.
jib = "3.4.4"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
# Version managed by the Spring Boot BOM: pinning it here split it from what the
# autoconfiguration module expects, which is the kind of mismatch that surfaces as a
# ClassNotFoundError at startup rather than as a dependency conflict.
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql" }
spring-boot-flyway = { module = "org.springframework.boot:spring-boot-flyway" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
sqlite = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
docker-java-core = { module = "com.github.docker-java:docker-java-core", version.ref = "dockerJava" }
docker-java-transport = { module = "com.github.docker-java:docker-java-transport-httpclient5", version.ref = "dockerJava" }
apache-httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "apacheHttpClient5" }
apache-httpcore5 = { module = "org.apache.httpcomponents.core5:httpcore5", version.ref = "apacheHttpCore5" }
apache-httpcore5-h2 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version.ref = "apacheHttpCore5" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
hibernate-community-dialects = { module = "org.hibernate.orm:hibernate-community-dialects" }
# Apache-2.0, and a drawing API rather than an HTML engine: the alternative that renders HTML
# to PDF drags in an XHTML parser and a CSS subset, which is a second rendering stack to keep
# correct for a document of four sections.
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
jgit-ssh = { module = "org.eclipse.jgit:org.eclipse.jgit.ssh.apache", version.ref = "jgit" }
bucket4j-core = { module = "com.bucket4j:bucket4j-core", version.ref = "bucket4j" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }

[plugins]
springBoot = { id = "org.springframework.boot", version.ref = "springBoot" }
jib = { id = "com.google.cloud.tools.jib", version.ref = "jib" }
