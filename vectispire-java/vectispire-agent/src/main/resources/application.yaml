# The agent's whole configuration. Everything else it needs, it is told by the control plane.
spring:
  application:
    name: vectispire-agent
  main:
    # It dials out and listens on nothing. An agent that listened would be a second attack
    # surface inside the network the control plane is deliberately kept out of.
    web-application-type: none

vectispire:
  agent:
    url: ${VECTISPIRE_URL:}
    token: ${VECTISPIRE_AGENT_TOKEN:}
    # The long wait is the server's to hold, so a queued scan leaves within the second.
    claim-wait: ${VECTISPIRE_AGENT_WAIT:30s}
    retry-delay: ${VECTISPIRE_AGENT_RETRY:10s}
    # Well under the lease, so one missed beat cannot expire a scan that is progressing.
    heartbeat: ${VECTISPIRE_AGENT_HEARTBEAT:60s}
    # No `version`: the agent announces its own build's, read from build-info. It used to read
    # VECTISPIRE_VERSION — the control plane's export override — with a default of "1".

    # **The private half of the key an administrator pinned on this agent's row.** Empty: results
    # are accepted on the API key alone, which is the prior behaviour and every agent's behaviour
    # until somebody pins anything.
    #
    # This is *configuration*, never an announcement, and the asymmetry with the sealing key is the
    # whole point: a signature verified against a key the signer published itself over the same
    # channel proves nothing more than the bearer token does. See `ResultAttestation`.
    signing-key: ${VECTISPIRE_AGENT_SIGNING_KEY:}

    # **The scanner images.** Blank keeps the pinned digest. An agent runs on somebody else's
    # network, which is where a pull goes through an internal registry rather than to Docker Hub —
    # so this matters more here than on the control plane. Overriding a digest with a tag hands
    # back what the pin was protecting.
    images:
      syft: ${VECTISPIRE_IMAGE_SYFT:}
      grype: ${VECTISPIRE_IMAGE_GRYPE:}
      gitleaks: ${VECTISPIRE_IMAGE_GITLEAKS:}
      checkov: ${VECTISPIRE_IMAGE_CHECKOV:}
      semgrep: ${VECTISPIRE_IMAGE_SEMGREP:}
