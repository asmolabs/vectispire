# The agent's whole configuration. Everything else it needs, it is told by the control plane.
spring:
  application:
    name: vectispire-agent
  main:
    # It dials out and listens on nothing. An agent that listened would be a second attack
    # surface inside the network the control plane is deliberately kept out of.
    web-application-type: none

vectispire:
  agent:
    url: ${VECTISPIRE_URL:}
    token: ${VECTISPIRE_AGENT_TOKEN:}
    # The long wait is the server's to hold, so a queued scan leaves within the second.
    claim-wait: ${VECTISPIRE_AGENT_WAIT:30s}
    retry-delay: ${VECTISPIRE_AGENT_RETRY:10s}
    # Well under the lease, so one missed beat cannot expire a scan that is progressing.
    heartbeat: ${VECTISPIRE_AGENT_HEARTBEAT:60s}
    # No `version`: the agent announces its own build's, read from build-info. It used to read
    # VECTISPIRE_VERSION — the control plane's export override — with a default of "1".

    # **The private half of the key an administrator pinned on this agent's row.** Empty: results
    # are accepted on the API key alone, which is the prior behaviour and every agent's behaviour
    # until somebody pins anything.
    #
    # This is *configuration*, never an announcement, and the asymmetry with the sealing key is the
    # whole point: a signature verified against a key the signer published itself over the same
    # channel proves nothing more than the bearer token does. See `ResultAttestation`.
    signing-key: ${VECTISPIRE_AGENT_SIGNING_KEY:}

    # **The scanner images.** Blank keeps the pinned digest. An agent runs on somebody else's
    # network, which is where a pull goes through an internal registry rather than to Docker Hub —
    # so this matters more here than on the control plane. Overriding a digest with a tag hands
    # back what the pin was protecting.
    images:
      syft: ${VECTISPIRE_IMAGE_SYFT:}
      grype: ${VECTISPIRE_IMAGE_GRYPE:}
      gitleaks: ${VECTISPIRE_IMAGE_GITLEAKS:}
      checkov: ${VECTISPIRE_IMAGE_CHECKOV:}
      semgrep: ${VECTISPIRE_IMAGE_SEMGREP:}
      # The internal registry plugin images are pulled from: the host relocated, the path and the
      # digest kept, so the mirror serves a plugin and cannot substitute another. Blank pulls each
      # from its own registry.
      plugin-registry: ${VECTISPIRE_PLUGIN_REGISTRY:}
      # Refuse a plugin whose manifest declares no signer, unless the platform governor waived the
      # requirement for that plugin in writing. On by default (decision 0017 §9.1, 2026-09-30). A
      # declared signer is verified whatever this says, with cosign, before the image is pulled;
      # false runs every unsigned plugin on this agent's host — its operator's explicit choice.
      plugin-signature-required: ${VECTISPIRE_PLUGIN_SIGNATURE_REQUIRED:true}

    # **The matcher's database, once per host.** Downloaded here under a lock — some 3 GB — and
    # mounted read-only by every scan, instead of once per scan. Blank is a directory beside the
    # workspaces; a disk that survives a restart spares the first scan after one the download. The
    # daemon mounts it, so it is a path on the daemon's host, like the workspaces.
    vulnerability-db-dir: ${VECTISPIRE_VULNERABILITY_DB_DIR:}

    # **What runs the scanners** (decision 0045). `docker`: the daemon this agent reaches, as every
    # release before. `kubernetes`: one pod per scanner run in a namespace of its own, for a cluster with
    # no Docker — the agent then runs in a pod whose service account holds the Role the chart renders.
    executor:
      kind: ${VECTISPIRE_AGENT_EXECUTOR:docker}
      kubernetes:
        namespace: ${VECTISPIRE_SCANS_NAMESPACE:}
        # This agent's name on its scan pods, stable across restarts: what its start sweeps.
        name: ${VECTISPIRE_AGENT_NAME:vectispire-agent}
        helper-image: ${VECTISPIRE_KUBERNETES_HELPER_IMAGE:}
        user: ${VECTISPIRE_KUBERNETES_SCAN_USER:}
        start-timeout: ${VECTISPIRE_KUBERNETES_START_TIMEOUT:5m}
        # nodeSelector, tolerations and affinity as JSON: the agents' own pool.
        placement: ${VECTISPIRE_KUBERNETES_PLACEMENT:}
        # Refuse to start unless a probe pod, offline and online, cannot reach the API server: a CNI that
        # ignores NetworkPolicy is otherwise invisible. False only where no policy is rendered on purpose.
        require-isolation: ${VECTISPIRE_KUBERNETES_REQUIRE_ISOLATION:true}
        # Each scan pod's scanner, request and limit alike. Set rather than derived from this JVM's cores,
        # which are the agent pod's view of its node.
        cpu-millis: ${VECTISPIRE_KUBERNETES_SCAN_CPU_MILLIS:2000}
        memory-mib: ${VECTISPIRE_KUBERNETES_SCAN_MEMORY_MIB:2048}
        # The claim in the scans' namespace that keeps the matcher's database generations for scan pods, and
        # the node this agent runs on, where the pods mounting it go. Blank copies the database into each pod.
        matcher-cache-claim: ${VECTISPIRE_KUBERNETES_MATCHER_CACHE_CLAIM:}
        node-name: ${VECTISPIRE_KUBERNETES_NODE_NAME:}
