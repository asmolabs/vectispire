# Defaults for a single-instance deployment. Everything here is overridable, and the two
# settings that must never be is stated below rather than left to a reviewer's memory.
spring:
  application:
    name: vectispire

  config:
    # **Secrets as files, read under the name of the variable they replace.** A file
    # `/run/secrets/ENCRYPTION_KEY` answers `${ENCRYPTION_KEY}` below exactly as the variable would,
    # so the shipped compose hands the three secrets over this way and nothing else changes. The
    # environment was the wrong place for them: it is part of what the daemon's inspect returns to
    # any client of the socket proxy. A variable, when set, still wins; `optional:` because a
    # deployment without the directory is a deployment without file secrets, not a broken one.
    import: optional:configtree:/run/secrets/

  datasource:
    # **MySQL is the default engine**, and the same one `docker-compose.yml` ships — the two
    # used to disagree, so a reader had to guess which was authoritative. The engine is chosen
    # by this URL and nothing else: Hibernate and Flyway both read it from here.
    url: ${VECTISPIRE_DB_URL:jdbc:mysql://localhost:3306/vectispire}
    username: ${VECTISPIRE_DB_USER:vectispire}
    password: ${VECTISPIRE_DB_PASSWORD:}

  jpa:
    hibernate:
      # **`validate`, never `update`, and never `create`.** The schema belongs to the migrations.
      # Letting Hibernate reconcile it would mean two authorities for one schema, and the one
      # that runs second wins silently — on whichever engine happens to boot first.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

server:
  # The API and the agent protocol share it. Long polling holds a request open, which is why
  # the read timeout below is generous and the connection count is not.
  port: ${VECTISPIRE_PORT:3180}

# **What an operator can see while this runs.**
#
# Only `health` was exposed, which answers "is it up" and nothing else. The questions an incident
# raises — is the queue draining, are the agents being served, is the outbox behind, how long does
# a scan take now — had no instrument at all, and the audit log is the wrong one: it records what
# people did, not how the system is behaving.
#
# `health` stays anonymous because a container probe has no session; everything else here needs
# one. A metrics endpoint names internal structure and volumes, which is not something to publish
# to whoever can reach the port.
#
# Shipping these somewhere is one dependency away — add `io.micrometer:micrometer-registry-prometheus`
# and refresh the lockfile, and `prometheus` joins the list below. Without it the meters still
# exist and `/actuator/metrics` serves them.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # Every series says which instance produced it. Without this a fleet's numbers are summed
      # into one line, and "the queue is draining" can be true of the fleet while one instance
      # has stopped claiming anything at all.
      application: ${spring.application.name}

vectispire:
  scanning:
    # Empty lets the daemon pick, which means the host's architecture — an arm64 development
    # machine would then audit a variant nobody deploys.
    image-platform: ${VECTISPIRE_IMAGE_SCAN_PLATFORM:}

    # A repository with no deployment key attached falls back to this machine's own ~/.ssh.
    host-ssh: ${VECTISPIRE_HOST_SSH:true}

    # **The scanner images, overridable one by one.** Blank keeps the digest Vectispire ships
    # with — the pinned, reviewed one. Set these to run from an internal registry (an air-gapped
    # or regulated estate has no other option), or to substitute an engine.
    #
    # Whoever overrides one takes on what the digest was protecting: a tag pulls whatever came
    # down this morning, into a container that reads code nobody controls. Prefer a digest.
    images:
      syft: ${VECTISPIRE_IMAGE_SYFT:}
      grype: ${VECTISPIRE_IMAGE_GRYPE:}
      gitleaks: ${VECTISPIRE_IMAGE_GITLEAKS:}
      checkov: ${VECTISPIRE_IMAGE_CHECKOV:}
      semgrep: ${VECTISPIRE_IMAGE_SEMGREP:}

  branding:
    # **The two nested chains in this file are the only real ones, and they are here on purpose.**
    # Each name is an earlier spelling kept working for deployments that already set it, tried in
    # order, newest first. Eight other settings carried the same shape by accident — the same
    # variable written three times, which is exactly `${X:default}` — and reading them made these
    # two impossible to recognise as deliberate. Do not add a level unless it names a *different*
    # variable.
    name: ${VECTISPIRE_BRAND_NAME:${VECTISPIRE_BRANDING_NAME:${VECTISPIRE_INSTANCE_NAME:Vectispire}}}
    gitlab-url: ${VECTISPIRE_GITLAB_URL:https://github.com/asmolabs/vectispire}

  exports:
    # Named in SARIF's information URI and in a VEX document's identifier, so a document handed
    # to somebody else says where it came from.
    public-url: ${VECTISPIRE_PUBLIC_URL:}
    vex-author: ${VECTISPIRE_VEX_AUTHOR:${VECTISPIRE_BRAND_NAME:${VECTISPIRE_BRANDING_NAME:Vectispire}}}
    # **Empty means the build's own version**, read from build-info by `ProductVersion`, which
    # every signed document uses. A VEX or CSAF document names the tool that wrote it, and a version
    # other than the artefact's makes the two unreconcilable where an assessor reads them. Set only
    # for a rebuild shipped under a version of its own. It used to repeat the version as a literal,
    # to be edited at every release.
    tool-version: ${VECTISPIRE_VERSION:}

  bootstrap:
    username: ${VECTISPIRE_BOOTSTRAP_USERNAME:}
    password: ${VECTISPIRE_BOOTSTRAP_PASSWORD:}

  security:
    # **Whose word to take for the client's address.** Empty means "nothing in front of us", so
    # `X-Forwarded-For` is ignored entirely and the peer address is what the rate limiter counts.
    # Behind a load balancer, name it here (address or CIDR, comma-separated) — otherwise every
    # request arrives from the balancer and the whole estate shares one bucket.
    trusted-proxies: ${VECTISPIRE_TRUSTED_PROXIES:}

    # **Who may read the API's own map.** `springdoc` below is off by default, so nothing is
    # served until it is switched on; this decides who may read it when it is. Default closed —
    # a control plane that inventories other people's attack surface should not publish its own
    # endpoint catalogue to anonymous callers unless somebody decided it should. `true` suits a
    # public demo, or a deployment behind a gateway that already authenticates.
    anonymous-api-docs: ${VECTISPIRE_ANONYMOUS_API_DOCS:false}

    # **A ceiling on refused bearer tokens**, which the password had and the keys did not. Sessions,
    # agent API keys and the SCIM token count together, per address, and only failures count: an
    # agent long-polling with a valid key spends nothing.
    #
    # Deliberately generous. These tokens are long and random, so the threat is not guessing but
    # silence: a sweep left no trace distinguishable from a misconfigured agent retrying. Most of
    # the control's value is the audit entry written when the ceiling is reached, not the refusal
    # itself — hence a threshold that does not lock an operator out of their own control plane.
    bearer-failures-per-window: ${VECTISPIRE_BEARER_FAILURES_PER_WINDOW:60}
    bearer-failure-window: ${VECTISPIRE_BEARER_FAILURE_WINDOW:PT5M}

    # **A budget per integration API key**, on successful requests this time (decision 0024). A key
    # acts for an account from a machine that may loop: a pipeline retried in a tight loop, or a
    # leaked key, should hit a 429 with Retry-After rather than the database.
    api-key-requests-per-minute: ${VECTISPIRE_API_KEY_REQUESTS_PER_MINUTE:600}

    # **A ceiling per address on the inbound tracker webhook**, the one anonymous route that writes.
    # Generous, because a bulk transition of a few hundred tickets is a few hundred deliveries in a
    # minute from one of the tracker's addresses; a flood beyond it is answered 429 before any secret
    # is decrypted. Its refusals are audited sparingly whatever this says — see `WebhookRefusals`.
    webhook-requests-per-window: ${VECTISPIRE_WEBHOOK_REQUESTS_PER_WINDOW:300}
    webhook-request-window: ${VECTISPIRE_WEBHOOK_REQUEST_WINDOW:PT1M}

  # **The three request bodies read whole into memory**, which no container setting bounds: Tomcat's
  # and Spring's limits apply to forms and multipart only. Past these, 413. The reasoning for each
  # value is on `RequestBodyLimitFilter`.
  http:
    max-body:
      ticket-webhook: ${VECTISPIRE_MAX_BODY_TICKET_WEBHOOK:1MB}
      vex-ingest: ${VECTISPIRE_MAX_BODY_VEX_INGEST:16MB}
      agent-result: ${VECTISPIRE_MAX_BODY_AGENT_RESULT:256MB}

  session:
    absolute-lifetime: ${VECTISPIRE_SESSION_LIFETIME:12h}
    idle-lifetime: ${VECTISPIRE_SESSION_IDLE:60m}

  oidc:
    password-login: ${VECTISPIRE_PASSWORD_LOGIN:true}
    # **Whether an administrative account may be linked on its first sign-on by its username.**
    # Off: a username is a claim, and in a realm with self-registration anyone can claim `admin`.
    # Turn it on only for a realm where nobody chooses their own username; otherwise link those
    # accounts through SCIM, which takes the subject from the provider.
    link-privileged-accounts: ${VECTISPIRE_OIDC_LINK_PRIVILEGED_ACCOUNTS:false}
    # **A single sign-on skips the local TOTP: the provider owns the second factor.** Every
    # federated sign-in records what the provider stated (RFC 8176 `amr`, or an `acr` level named
    # below). With require-mfa, a sign-on stating none is refused — turn it on once the provider is
    # configured to send `amr` (Keycloak: an "Authentication Method Reference" mapper) or an `acr`.
    require-mfa: ${VECTISPIRE_OIDC_REQUIRE_MFA:false}
    mfa-amr: ${VECTISPIRE_OIDC_MFA_AMR:mfa,otp,hwk,fido}
    mfa-acr: ${VECTISPIRE_OIDC_MFA_ACR:}

  git:
    # **The hosts repositories may be cloned from.** Empty (the default) means every host but the
    # link-local ones, which are always refused: a forge on the internal network is the ordinary
    # case. Listed — `gitlab.corp.example, *.corp.example` — only those are cloned from, checked
    # when a URL is entered and again before each scan.
    allowed-hosts: ${VECTISPIRE_GIT_ALLOWED_HOSTS:}

  audit:
    mirror-path: ${VECTISPIRE_AUDIT_MIRROR:}

  encryption:
    key: ${ENCRYPTION_KEY:}
    key-file: ${ENCRYPTION_KEY_FILE:}
    previous-keys: ${VECTISPIRE_PREVIOUS_ENCRYPTION_KEYS:}
    previous-keys-file: ${VECTISPIRE_PREVIOUS_ENCRYPTION_KEYS_FILE:}

  worker:
    enabled: ${VECTISPIRE_EMBEDDED_WORKER:true}
    max-concurrent: ${VECTISPIRE_SCAN_MAX_CONCURRENT:2}
    labels: ${VECTISPIRE_WORKER_LABELS:}
    interval: ${VECTISPIRE_WORKER_INTERVAL:15s}

  jobs:
    relay-interval: ${VECTISPIRE_RELAY_INTERVAL:60s}
    scheduler-interval: ${VECTISPIRE_SCHEDULER_INTERVAL:60s}
    maintenance-interval: ${VECTISPIRE_MAINTENANCE_INTERVAL:1h}

springdoc:
  swagger-ui:
    # Disabled by default in production. Enable explicitly with VECTISPIRE_SWAGGER_UI_ENABLED=true
    enabled: ${VECTISPIRE_SWAGGER_UI_ENABLED:false}
  api-docs:
    # OpenAPI JSON specification endpoint. Enable explicitly with VECTISPIRE_API_DOCS_ENABLED=true
    enabled: ${VECTISPIRE_API_DOCS_ENABLED:false}

