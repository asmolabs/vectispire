# Defaults for a single-instance deployment. Everything here is overridable, and the two
# settings that must never be is stated below rather than left to a reviewer's memory.
spring:
  application:
    name: vectispire

  datasource:
    url: ${VECTISPIRE_DB_URL:${VERISCAPE_DB_URL:${ZANSHIN_DB_URL:jdbc:postgresql://localhost:5432/vectispire}}}
    username: ${VECTISPIRE_DB_USER:${VERISCAPE_DB_USER:${ZANSHIN_DB_USER:vectispire}}}
    password: ${VECTISPIRE_DB_PASSWORD:${VERISCAPE_DB_PASSWORD:${ZANSHIN_DB_PASSWORD:}}}

  jpa:
    hibernate:
      # **`validate`, never `update`, and never `create`.** The schema belongs to the changelog.
      # Letting Hibernate reconcile it would mean two authorities for one schema, and the one
      # that runs second wins silently — on whichever engine happens to boot first.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}

server:
  # The API and the agent protocol share it. Long polling holds a request open, which is why
  # the read timeout below is generous and the connection count is not.
  port: ${VECTISPIRE_PORT:${VERISCAPE_PORT:${ZANSHIN_PORT:3180}}}

zanshin:
  scanning:
    # Empty lets the daemon pick, which means the host's architecture — an arm64 development
    # machine would then audit a variant nobody deploys.
    image-platform: ${VECTISPIRE_IMAGE_SCAN_PLATFORM:${VERISCAPE_IMAGE_SCAN_PLATFORM:${ZANSHIN_IMAGE_SCAN_PLATFORM:}}}

    # A repository with no deployment key attached falls back to this machine's own ~/.ssh.
    host-ssh: ${VECTISPIRE_HOST_SSH:${VERISCAPE_HOST_SSH:${ZANSHIN_HOST_SSH:true}}}

  exports:
    # Named in SARIF's information URI and in a VEX document's identifier, so a document handed
    # to somebody else says where it came from.
    public-url: ${VECTISPIRE_PUBLIC_URL:${VERISCAPE_PUBLIC_URL:${ZANSHIN_PUBLIC_URL:}}}
    vex-author: ${VECTISPIRE_VEX_AUTHOR:${VERISCAPE_VEX_AUTHOR:${ZANSHIN_VEX_AUTHOR:Vectispire}}}
    tool-version: ${VECTISPIRE_VERSION:${VERISCAPE_VERSION:${ZANSHIN_VERSION:1.0.0}}}

  bootstrap:
    username: ${VECTISPIRE_BOOTSTRAP_USERNAME:${VERISCAPE_BOOTSTRAP_USERNAME:${ZANSHIN_BOOTSTRAP_USERNAME:}}}
    password: ${VECTISPIRE_BOOTSTRAP_PASSWORD:${VERISCAPE_BOOTSTRAP_PASSWORD:${ZANSHIN_BOOTSTRAP_PASSWORD:}}}

  session:
    absolute-lifetime: ${VECTISPIRE_SESSION_LIFETIME:${VERISCAPE_SESSION_LIFETIME:${ZANSHIN_SESSION_LIFETIME:12h}}}
    idle-lifetime: ${VECTISPIRE_SESSION_IDLE:${VERISCAPE_SESSION_IDLE:${ZANSHIN_SESSION_IDLE:60m}}}

  oidc:
    password-login: ${VECTISPIRE_PASSWORD_LOGIN:${VERISCAPE_PASSWORD_LOGIN:${ZANSHIN_PASSWORD_LOGIN:true}}}

  audit:
    mirror-path: ${VECTISPIRE_AUDIT_MIRROR:${VERISCAPE_AUDIT_MIRROR:${ZANSHIN_AUDIT_MIRROR:}}}

  encryption:
    key: ${ENCRYPTION_KEY:}
    key-file: ${ENCRYPTION_KEY_FILE:}
    previous-keys: ${VECTISPIRE_PREVIOUS_ENCRYPTION_KEYS:${VERISCAPE_PREVIOUS_ENCRYPTION_KEYS:${ZANSHIN_PREVIOUS_ENCRYPTION_KEYS:}}}
    previous-keys-file: ${VECTISPIRE_PREVIOUS_ENCRYPTION_KEYS_FILE:${VERISCAPE_PREVIOUS_ENCRYPTION_KEYS_FILE:${ZANSHIN_PREVIOUS_ENCRYPTION_KEYS_FILE:}}}

  worker:
    enabled: ${VECTISPIRE_EMBEDDED_WORKER:${VERISCAPE_EMBEDDED_WORKER:${ZANSHIN_EMBEDDED_WORKER:true}}}
    max-concurrent: ${VECTISPIRE_SCAN_MAX_CONCURRENT:${VERISCAPE_SCAN_MAX_CONCURRENT:${ZANSHIN_SCAN_MAX_CONCURRENT:2}}}
    labels: ${VECTISPIRE_WORKER_LABELS:${VERISCAPE_WORKER_LABELS:${ZANSHIN_WORKER_LABELS:}}}
    interval: ${VECTISPIRE_WORKER_INTERVAL:${VERISCAPE_WORKER_INTERVAL:${ZANSHIN_WORKER_INTERVAL:15s}}}

  jobs:
    relay-interval: ${VECTISPIRE_RELAY_INTERVAL:${VERISCAPE_RELAY_INTERVAL:${ZANSHIN_RELAY_INTERVAL:60s}}}
    scheduler-interval: ${VECTISPIRE_SCHEDULER_INTERVAL:${VERISCAPE_SCHEDULER_INTERVAL:${ZANSHIN_SCHEDULER_INTERVAL:60s}}}
    maintenance-interval: ${VECTISPIRE_MAINTENANCE_INTERVAL:${VERISCAPE_MAINTENANCE_INTERVAL:${ZANSHIN_MAINTENANCE_INTERVAL:1h}}}
