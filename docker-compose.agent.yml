# A Zanshin scan agent: a worker that executes scans somewhere other than the
# machine serving the UI (docs/architecture/04).
#
# Why you would run this: the controller's host should not need the Docker socket;
# a repository or a registry is only reachable from another network segment; or the
# queue is longer than one host can drain. Nothing here is required for a normal
# single-machine install — the web process has a built-in agent and scans on its
# own.
#
# Setup:
#   1. In Zanshin, open Agents → « Ajouter un agent distant ». Copy the key: it is
#      shown once, and it carries only the `agent` scope.
#   2. Put it in `.env` next to this file, with the controller's URL:
#        ZANSHIN_URL=https://zanshin.interne
#        ZANSHIN_AGENT_TOKEN=zsk_...
#   3. docker compose -f docker-compose.agent.yml up -d
#
# The agent appears as online in the Agents page within a minute, and starts
# claiming queued scans.
#
# Two things worth knowing before deploying:
#
# * **Git access is the agent's own.** By default the controller sends no secret
#   (credentials_mode=local, the recommendation of décision 0003): this machine needs
#   its own read access to the repositories it will scan — mount an SSH key below,
#   or use a credential helper. If you would rather the controller hand over its
#   deploy key per job, switch the agent to « délégué » in the UI *and* serve the
#   controller over HTTPS: it refuses to send key material over plain HTTP.
# * **The Docker socket is root-equivalent** on this host. That is the trade being
#   made — the privilege moves here, off the process exposed to users.

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: zanshin-agent
    environment:
      ZANSHIN_URL: ${ZANSHIN_URL}
      ZANSHIN_AGENT_TOKEN: ${ZANSHIN_AGENT_TOKEN}
      # docker | local_api | osv — where the scanning tools run on this machine.
      ZANSHIN_AGENT_SCANNER_ENGINE: ${ZANSHIN_AGENT_SCANNER_ENGINE:-docker}
      # Shown in the Agents page; defaults to the container's hostname, which is a
      # random hex string and tells an operator nothing.
      ZANSHIN_AGENT_NAME: ${ZANSHIN_AGENT_NAME:-}
    volumes:
      # Ephemeral scanner containers are started through this socket.
      - /var/run/docker.sock:/var/run/docker.sock
      # An SSH key for cloning private repositories, read-only. Leave commented out
      # if every repository this agent scans is public, or if you use the delegated
      # credentials mode instead.
      # - ~/.ssh/zanshin_deploy:/root/.ssh/id_ed25519:ro
      # - ./known_hosts:/root/.ssh/known_hosts:ro
    restart: unless-stopped
