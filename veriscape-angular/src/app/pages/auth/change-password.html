<div class="flex items-center justify-center min-h-screen overflow-hidden">
    <div class="flex flex-col items-center justify-center w-full max-w-md">
        <div style="border-radius: 56px; padding: 0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%)">
            <div class="w-full bg-surface-0 dark:bg-surface-900 py-12 px-8 sm:px-12" style="border-radius: 53px">
                <div class="text-center mb-8">
                    <div class="text-surface-900 dark:text-surface-0 text-2xl font-medium mb-2">{{ 'auth.change_pw_title' | translate }}</div>
                    @if (imposed()) {
                        <span class="text-muted-color">{{ 'auth.temporary_pw_msg' | translate }}</span>
                    } @else {
                        <span class="text-muted-color">{{ 'auth.other_sessions_msg' | translate }}</span>
                    }
                </div>

                <form (ngSubmit)="submit()">
                    <label for="current" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">{{ 'auth.current_pw_label' | translate }}</label>
                    <p-password id="current" name="current" [(ngModel)]="currentPassword" [toggleMask]="true" [feedback]="false"
                                styleClass="mb-6" [fluid]="true" autocomplete="current-password" />

                    <label for="next" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2">{{ 'auth.next_pw_label' | translate }}</label>
                    <p-password id="next" name="next" [(ngModel)]="newPassword" [toggleMask]="true" [feedback]="false"
                                styleClass="mb-2" [fluid]="true" autocomplete="new-password" />

                    <label for="confirm" class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2 mt-4">{{ 'auth.confirm_pw_label' | translate }}</label>
                    <p-password id="confirm" name="confirm" [(ngModel)]="confirmation" [toggleMask]="true" [feedback]="false"
                                styleClass="mb-2" [fluid]="true" autocomplete="new-password" (keyup.enter)="submit()" />

                    <p class="text-muted-color text-sm mt-2 mb-4">{{ 'auth.min_length_msg' | translate }}</p>

                    @if (error(); as message) {
                        <p-message severity="error" styleClass="w-full mb-4">{{ message }}</p-message>
                    }

                    <p-button type="submit" [label]="'auth.change_pw_btn' | translate" styleClass="w-full" [loading]="loading()" />
                </form>
            </div>
        </div>
    </div>
</div>
