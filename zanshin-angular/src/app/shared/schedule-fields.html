<div class="flex flex-col gap-2">
    <label [for]="idPrefix() + '-interval'" class="font-medium">
        {{ 'schedule.interval_label' | translate }} <span class="text-muted-color font-normal">({{ 'common.optional' | translate }})</span>
    </label>
    <p-inputnumber [inputId]="idPrefix() + '-interval'" [min]="0" [ngModel]="interval()"
                   (ngModelChange)="interval.set($event)" suffix=" min" styleClass="w-full" />
    <small class="text-muted-color">
        {{ 'schedule.interval_hint' | translate }}
    </small>
</div>

<div class="flex flex-col gap-2">
    <label [for]="idPrefix() + '-cron'" class="font-medium">
        {{ 'schedule.cron_label' | translate }} <span class="text-muted-color font-normal">({{ 'common.optional' | translate }})</span>
    </label>
    <input pInputText [id]="idPrefix() + '-cron'" [ngModel]="cron()" (ngModelChange)="cron.set($event)"
           placeholder="0 2 * * *" />
    <small class="text-muted-color">
        {{ 'schedule.cron_hint' | translate }}
    </small>
</div>

@if (cronWins()) {
    <p-message severity="info" [closable]="false">
        {{ 'schedule.cron_wins_warning' | translate }}
    </p-message>
}
@if (manualOnly()) {
    <p-message severity="warn" [closable]="false">
        {{ 'schedule.manual_only_warning' | translate }}
    </p-message>
}
